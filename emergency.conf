server {
    listen 8091 default_server;
    server_name _;
    
    access_log /var/log/nginx/emergency_access.log;
    error_log /var/log/nginx/emergency_error.log debug;

    root /var/www/emergency/public;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/health {
        proxy_pass http://localhost:3000/api/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /server/health {
        proxy_pass http://localhost:8055/server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /metrics {
        proxy_pass http://localhost:9100/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
