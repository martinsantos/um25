version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: database-dev
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-dev_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dev_password}
      POSTGRES_DB: ${DB_DATABASE:-umbot_dev}
    ports:
      - "5432:5432"
    volumes:
      - dev-postgres-data:/var/lib/postgresql/data
    networks:
      - umbot-dev-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dev_user} -d ${DB_DATABASE:-umbot_dev}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  directus:
    image: directus/directus:10.8
    container_name: directus-dev
    restart: always
    ports:
      - "8055:8055"
    depends_on:
      - database
    env_file:
      - .env.development
    environment:
      KEY: ${DIRECTUS_KEY:-pzdIoGXgfJODqy8lLFxwi2NOK/K7j7Qii7W26rHS9Tk=}
      SECRET: ${DIRECTUS_SECRET:-d/QUPftXXNdfnAmN5SSmWPrYLzHqWF9rixk6XrwchR4=}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER:-dev_user}
      DB_PASSWORD: ${DB_PASSWORD:-dev_password}
      DB_DATABASE: ${DB_DATABASE:-umbot_dev}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpassword}
      PUBLIC_URL: ${PUBLIC_DIRECTUS_URL:-http://localhost:8055}
      PUBLIC_ASSETS: true
      ASSETS_TRANSFORM_TOKEN_OPTIONAL: true
      CORS_ENABLED: true
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4321,http://dev.ultimamilla.com.ar}
      PUBLIC_ROLE: ${PUBLIC_ROLE:-74e3b05e-0f14-422e-9ad3-759d426db60a}
    volumes:
      - directus-dev-uploads:/directus/uploads
      - directus-dev-extensions:/directus/extensions
    networks:
      - umbot-dev-network

  astro-app:
    build: 
      context: .
      dockerfile: Dockerfile.development
    container_name: astro-dev
    restart: always
    ports:
      - "4321:4321"
    volumes:
      - ./:/app
      - /app/node_modules
    env_file:
      - .env.development
    environment:
      - NODE_ENV=development
      - DIRECTUS_URL=http://directus:8055
      - DIRECTUS_STATIC_TOKEN=${DIRECTUS_STATIC_TOKEN:-k6P8LAY8_x_y1miB_KTlWnysCnx2Abky}
      - PUBLIC_DIRECTUS_TOKEN=${PUBLIC_DIRECTUS_TOKEN:-k6P8LAY8_x_y1miB_KTlWnysCnx2Abky}
    depends_on:
      - directus
    networks:
      - umbot-dev-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  umbot-dev-network:
    driver: bridge

volumes:
  dev-postgres-data:
  directus-dev-uploads:
  directus-dev-extensions:
