upstream astro_emergency {
    server astro-emergency:80;
}

upstream directus_emergency {
    server directus-emergency:8055;
}

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name www.umbot.com.ar;
    return 301 https://$server_name$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl http2;
    server_name www.umbot.com.ar;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/www.umbot.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.umbot.com.ar/privkey.pem;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Panel de administración Directus
    location /admin {
        proxy_pass http://directus_emergency;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        
        # WebSocket support para admin
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # API Directus
    location /api/ {
        proxy_pass http://directus_emergency;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets de Directus
    location /assets/ {
        proxy_pass http://directus_emergency;
        proxy_set_header Host $host;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sitio web principal
    location / {
        proxy_pass http://astro_emergency;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets estáticos con cache
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://astro_emergency;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
    }
}

# Acceso directo a Directus (puerto 8055)
server {
    listen 8055;
    server_name www.umbot.com.ar;

    location / {
        proxy_pass http://directus_emergency;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
