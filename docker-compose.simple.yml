version: '3.8'

networks:
  umbot-simple:
    driver: bridge

volumes:
  postgres_simple:
  directus_simple:

services:
  # PostgreSQL
  postgres-simple:
    image: postgres:15-alpine
    container_name: umbot-postgres-simple
    environment:
      POSTGRES_DB: directus
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres_simple:/var/lib/postgresql/data
    networks:
      - umbot-simple
    restart: unless-stopped

  # Directus CMS
  directus-simple:
    image: directus/directus:10.8.3
    container_name: umbot-directus-simple
    environment:
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET}
      DB_CLIENT: pg
      DB_HOST: postgres-simple
      DB_PORT: 5432
      DB_DATABASE: directus
      DB_USER: directus
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      ADMIN_EMAIL: admin@umbot.com.ar
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: https://www.umbot.com.ar
    volumes:
      - directus_simple:/directus/uploads
    networks:
      - umbot-simple
    depends_on:
      - postgres-simple
    restart: unless-stopped

  # Nginx estático simple
  nginx-simple:
    image: nginx:alpine
    container_name: umbot-nginx-simple
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./dist/client:/usr/share/nginx/html:ro
      - ./nginx.simple.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    networks:
      - umbot-simple
    depends_on:
      - directus-simple
    restart: unless-stopped
