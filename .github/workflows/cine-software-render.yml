name: Blender software architecture
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Inspect three native proof frames before full rendering'
        type: choice
        options: [proof, full]
        default: proof
permissions:
  contents: read
concurrency:
  group: blender-software-${{ github.ref }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PYPLAN'
          import json,os
          rows=[dict(part=i+1,start=f,end=f,frames=1) for i,f in enumerate([0,144,288])] if os.environ['MODE']=='proof' else [dict(part=i+1,start=i*48,end=i*48+47,frames=48) for i in range(12)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('matrix='+json.dumps({'include':rows})+'\n')
          PYPLAN
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install verified official Blender
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxrender1 libxi6 ffmpeg
          curl -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender-4.5.3-linux-x64.tar.xz
          curl -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 -o blender.sha256
          awk '$2 == "blender-4.5.3-linux-x64.tar.xz" {print}' blender.sha256 > blender-selected.sha256
          test -s blender-selected.sha256
          sha256sum -c blender-selected.sha256
          tar -xf blender-4.5.3-linux-x64.tar.xz
      - name: Render the software architecture
        run: |
          python3 scripts/cine/render-software-system-v1.py --validate-only
          ./blender-4.5.3-linux-x64/blender -b -t 4 --python scripts/cine/render-software-system-v1.py -- --samples 24 --start ${{ matrix.start }} --end ${{ matrix.end }} --output frames
      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'proof'
        with:
          name: software-proof-${{ matrix.part }}
          path: frames
          retention-days: 2
      - name: Encode recoverable part
        if: inputs.mode == 'full'
        run: |
          cp frames/render-info.json part-${{ matrix.part }}-info.json
          ffmpeg -v error -framerate 24 -start_number ${{ matrix.start }} -i frames/%04d.png -frames:v ${{ matrix.frames }} -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 24 -g 48 -an -movflags +faststart part-${{ matrix.part }}.mp4
      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'full'
        with:
          name: software-part-${{ matrix.part }}
          path: |
            part-${{ matrix.part }}.mp4
            part-${{ matrix.part }}-info.json
          retention-days: 2
  assemble:
    needs: render
    if: inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: software-part-*
      - name: Assemble and verify cinema
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir delivery
          for PART in $(seq 1 12); do printf "file 'software-part-%s/part-%s.mp4'\n" "$PART" "$PART"; done > parts.txt
          ffmpeg -v error -f concat -safe 0 -i parts.txt -c copy -movflags +faststart delivery/cine-software-system-v1.mp4
          ffmpeg -v error -i delivery/cine-software-system-v1.mp4 -vf 'crop=1080:1080:690:0' -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an -movflags +faststart delivery/cine-software-system-v1-sq.mp4
          ffmpeg -v error -i delivery/cine-software-system-v1.mp4 -frames:v 1 -q:v 2 delivery/cine-software-system-v1-poster.jpg
          ffmpeg -v error -i delivery/cine-software-system-v1-sq.mp4 -frames:v 1 -q:v 2 delivery/cine-software-system-v1-poster-sq.jpg
          for SUFFIX in poster poster-sq; do ffmpeg -v error -i delivery/cine-software-system-v1-$SUFFIX.jpg -c:v libaom-av1 -still-picture 1 -crf 24 delivery/cine-software-system-v1-$SUFFIX.avif; done
          ffmpeg -v error -i delivery/cine-software-system-v1.mp4 -f null -
          ffmpeg -v error -i delivery/cine-software-system-v1-sq.mp4 -f null -
          ffprobe -v error -count_frames -show_streams -show_format -of json delivery/cine-software-system-v1.mp4 > delivery/validation.json
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          v=json.loads(Path('delivery/validation.json').read_text())['streams'][0]
          assert (v['width'],v['height'],v['nb_read_frames'],v['avg_frame_rate'])==(1920,1080,'576','24/1'),v
          assert abs(float(v['duration'])-24)<.01,v
          assert sum(p.stat().st_size for p in Path('delivery').iterdir())<40_000_000
          PYVERIFY
          cp software-part-1/part-1-info.json delivery/render-info.json
          sha256sum delivery/* > delivery/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: software-cinema-v1
          path: delivery
          retention-days: 2
