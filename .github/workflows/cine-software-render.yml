name: Blender software architecture
'on':
  workflow_dispatch:
    inputs:
      mode:
        description: Inspect five native proof frames before full rendering
        type: choice
        options:
          - proof
          - full
        default: proof
      version:
        description: Authored movie version
        type: choice
        options:
          - v1
          - v2
        default: v2
permissions:
  contents: read
concurrency:
  group: blender-software-${{ github.ref }}-${{ inputs.version || 'v2' }}-${{ inputs.mode }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  VERSION: ${{ inputs.version || 'v2' }}
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          MODE: ${{ inputs.mode }}
        run: |
          python3 - <<'PYPLAN'
          import json,os
          rows=[dict(part=i+1,start=f,end=f,frames=1) for i,f in enumerate([0,144,288,432,575])] if os.environ['MODE']=='proof' else [dict(part=i+1,start=i*48,end=i*48+47,frames=48) for i in range(12)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:out.write('matrix='+json.dumps({'include':rows})+'\n')
          PYPLAN
  render:
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |-
            scripts/cine/render-software-system-v1.py
            scripts/cine/render-software-system-v2.py
            public/fonts/um-sans/UMSans-Regular.ttf
            public/fonts/um-sans/UMSans-SemiBold.ttf
          sparse-checkout-cone-mode: false
      - name: Install verified official Blender
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get install -y -qq libgl1 libegl1 libxrender1 libxi6 ffmpeg
          curl --retry 3 --connect-timeout 15 --max-time 240 -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender-4.5.3-linux-x64.tar.xz
          curl --retry 3 --connect-timeout 15 --max-time 240 -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 -o blender.sha256
          awk '$2 == "blender-4.5.3-linux-x64.tar.xz" {print}' blender.sha256 > blender-selected.sha256
          test -s blender-selected.sha256
          sha256sum -c blender-selected.sha256
          tar -xf blender-4.5.3-linux-x64.tar.xz
        timeout-minutes: 15
      - name: Render the software architecture
        run: |
          python3 scripts/cine/render-software-system-$VERSION.py --validate-only
          ./blender-4.5.3-linux-x64/blender -b -t 4 --python-exit-code 1 --python scripts/cine/render-software-system-$VERSION.py -- --samples 24 --start ${{ matrix.start }} --end ${{ matrix.end }} --output frames
      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'proof'
        with:
          name: software-proof-${{ matrix.part }}
          path: frames
          retention-days: 4
      - name: Encode recoverable part
        if: inputs.mode == 'full'
        run: |
          cp frames/render-info.json part-${{ matrix.part }}-info.json
          ffmpeg -v error -framerate 24 -start_number ${{ matrix.start }} -i frames/%04d.png -frames:v ${{ matrix.frames }} -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 24 -g 48 -an -movflags +faststart part-${{ matrix.part }}.mp4
      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'full'
        with:
          name: software-part-${{ matrix.part }}
          path: |
            part-${{ matrix.part }}.mp4
            part-${{ matrix.part }}-info.json
          retention-days: 4
  assemble:
    needs: render
    if: inputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: software-part-*
      - name: Assemble and verify cinema
        run: |
          sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update -qq
          sudo apt-get install -y -qq ffmpeg
          mkdir delivery
          for PART in $(seq 1 12); do printf "file 'software-part-%s/part-%s.mp4'\n" "$PART" "$PART"; done > parts.txt
          ffmpeg -v error -f concat -safe 0 -i parts.txt -c copy -movflags +faststart delivery/cine-software-system-$VERSION.mp4
          ffmpeg -v error -i delivery/cine-software-system-$VERSION.mp4 -vf 'crop=1520:1080:400:0,pad=1520:1520:0:220:color=0x0B1019,scale=1080:1080' -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an -movflags +faststart delivery/cine-software-system-$VERSION-sq.mp4
          ffmpeg -v error -i delivery/cine-software-system-$VERSION.mp4 -frames:v 1 -q:v 2 delivery/cine-software-system-$VERSION-poster.jpg
          ffmpeg -v error -i delivery/cine-software-system-$VERSION-sq.mp4 -frames:v 1 -q:v 2 delivery/cine-software-system-$VERSION-poster-sq.jpg
          for SUFFIX in poster poster-sq; do ffmpeg -v error -i delivery/cine-software-system-$VERSION-$SUFFIX.jpg -c:v libaom-av1 -still-picture 1 -crf 24 delivery/cine-software-system-$VERSION-$SUFFIX.avif; done
          ffmpeg -v error -i delivery/cine-software-system-$VERSION.mp4 -f null -
          ffmpeg -v error -i delivery/cine-software-system-$VERSION-sq.mp4 -f null -
          ffprobe -v error -count_frames -show_streams -show_format -of json delivery/cine-software-system-$VERSION.mp4 > delivery/validation.json
          python3 - <<'PYVERIFY'
          import json
          from pathlib import Path
          v=json.loads(Path('delivery/validation.json').read_text())['streams'][0]
          assert (v['width'],v['height'],v['nb_read_frames'],v['avg_frame_rate'])==(1920,1080,'576','24/1'),v
          assert abs(float(v['duration'])-24)<.01,v
          assert sum(p.stat().st_size for p in Path('delivery').iterdir())<40_000_000
          PYVERIFY
          python3 - <<'PYINFO'
          import json
          from pathlib import Path
          parts=[json.loads(Path(f'software-part-{i}/part-{i}-info.json').read_text()) for i in range(1,13)]
          info=parts[0]
          assert all(p['scene']==info['scene'] and p['samples']==info['samples'] and p['engine']==info['engine'] for p in parts)
          info['timings']=[t for p in parts for t in p['timings']]
          info['bounds']=[b for p in parts for b in p['bounds']]
          assert [t['frame'] for t in info['timings']]==list(range(576))
          Path('delivery/render-info.json').write_text(json.dumps(info))
          PYINFO
          ffprobe -v error -count_frames -show_streams -show_format -of json delivery/cine-software-system-$VERSION-sq.mp4 > delivery/validation-square.json
          ffmpeg -v error -i delivery/cine-software-system-$VERSION.mp4 -f framemd5 delivery/frame-integrity.txt
          sha256sum delivery/* > delivery/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: software-cinema-${{ inputs.version }}
          path: delivery
          retention-days: 5
