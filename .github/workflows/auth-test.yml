name: Authentication Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  test-auth:
    runs-on: ubuntu-latest
    env:
      DIRECTUS_STATIC_TOKEN: ${{ secrets.DIRECTUS_STATIC_TOKEN || 'k6P8LAY8_x_y1miB_KTlWnysCnx2Abky' }}
      PUBLIC_DIRECTUS_URL: ${{ secrets.PUBLIC_DIRECTUS_URL || 'http://localhost:8055' }}
      NODE_ENV: test

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'

    - name: Install dependencies
      run: npm ci

    - name: Test authentication
      run: |
        # Test Directus connection
        echo "Testing Directus connection..."
        curl -H "Authorization: Bearer $DIRECTUS_STATIC_TOKEN" \
             -s -o /dev/null -w "%{http_code}" \
             $PUBLIC_DIRECTUS_URL/items/antecedentes \
             | grep -q 200 || (echo "Directus authentication failed" && exit 1)
        
        # Test static token in .env
        if ! grep -q "DIRECTUS_STATIC_TOKEN=k6P8LAY8_x_y1miB_KTlWnysCnx2Abky" .env; then
          echo "Static token not found in .env"
          exit 1
        fi
        
        # Test public role ID in database (if available)
        if [ "$NODE_ENV" = "test" ]; then
          echo "Testing public role configuration..."
          # Add database test here if needed
        fi

    - name: Verify environment variables
      run: |
        echo "Verifying required environment variables..."
        for var in DIRECTUS_STATIC_TOKEN PUBLIC_DIRECTUS_URL; do
          if [ -z "${!var}" ]; then
            echo "Error: $var is not set"
            exit 1
          fi
          echo "$var is set"
        done
