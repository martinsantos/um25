name: Verify SITREP write fence on disposable PostgreSQL

on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-sitrep-lock-rehearsal.yml'
      - 'scripts/ops/hostinger-migration/*sitrep*lock*.py'
      - 'scripts/ops/hostinger-migration/*sitrep*gate*.py'
      - 'scripts/ops/hostinger-migration/*sitrep*swap*.py'

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  isolated-lock-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - name: Check gate generation and noninteractive lock contract
        run: |
          python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sitrep_gate_config.py' -v
          python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sitrep_write_lock.py' -v
          python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sitrep_database_swap.py' -v
      - name: Verify the actual PostgreSQL lock without network or persistent storage
        run: |
          docker run --detach --network none --tmpfs /var/lib/postgresql/data --name umsa-sitrep-lock-ci -e POSTGRES_USER=directus -e POSTGRES_PASSWORD=ci-only -e POSTGRES_DB=trazabilidad_rrpp postgres:15
          SITREP_LOCK_CI=1 python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sitrep_lock_integration.py' -v
