name: Activate the verified SITREP target

on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-sitrep-public-activate.yml'
      - 'scripts/ops/hostinger-migration/*sitrep*.py'
  workflow_dispatch:
    inputs:
      run_id:
        description: 'Completed scoped-fence run and attempt, for example 123456-1'
        required: true
        type: string
      verified_sha256:
        description: 'Independently verified SHA-256 of the offsite final SITREP database backup'
        required: true
        type: string
      verified_files_sha256:
        description: 'Independently verified SHA-256 of the offsite final SITREP files backup'
        required: true
        type: string
      acknowledgement:
        description: 'Enter ACTIVATE to switch the already authorized SITREP cutover'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-migration-${{ github.event_name == 'workflow_dispatch' && 'preparation' || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sitrep_*' -v
  activate:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.acknowledgement == 'ACTIVATE'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Activate the single SITREP writer and source proxy
        env:
          RUN_ID: ${{ inputs.run_id }}
          VERIFIED_SHA256: ${{ inputs.verified_sha256 }}
          VERIFIED_FILES_SHA256: ${{ inputs.verified_files_sha256 }}
        run: |
          set -euo pipefail
          [[ "$RUN_ID" =~ ^[0-9]{1,20}-[0-9]{1,4}$ && "$VERIFIED_SHA256" =~ ^[0-9a-f]{64}$ && "$VERIFIED_FILES_SHA256" =~ ^[0-9a-f]{64}$ ]]
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15)
          source=root@23.105.176.45
          target=root@179.198.115.115
          source_run="/root/umsa-sitrep-migration/$RUN_ID"
          target_run="/srv/umsa-migration/sitrep-cutover-tooling/$RUN_ID"
          done=false
          cleanup() {
            if [[ "$done" != true ]]; then
              ssh "${opts[@]}" "$source" "python3 $source_run/sitrep-fence-watchdog.py $RUN_ID" || true
            fi
          }
          trap cleanup EXIT
          for file in sitrep-source-fence.py sitrep-fence-watchdog.py sitrep-write-lock.py sitrep-gate-config.py; do
            local_hash=$(sha256sum "scripts/ops/hostinger-migration/$file" | cut -d ' ' -f1)
            remote_hash=$(ssh "${opts[@]}" "$source" "sha256sum $source_run/$file" | cut -d ' ' -f1)
            [[ "$local_hash" = "$remote_hash" ]]
          done
          for file in sitrep-final-refresh.py sitrep-database-swap.py sitrep-public-ingress.py sitrep-public-activate.py rehearse-sitrep-ingress.py; do
            local_hash=$(sha256sum "scripts/ops/hostinger-migration/$file" | cut -d ' ' -f1)
            remote_hash=$(ssh "${opts[@]}" "$target" "sha256sum $target_run/$file" | cut -d ' ' -f1)
            [[ "$local_hash" = "$remote_hash" ]]
          done
          ssh -A "${opts[@]}" "$target" "python3 $target_run/sitrep-public-activate.py $RUN_ID $RUN_ID $VERIFIED_SHA256 $VERIFIED_FILES_SHA256"
          done=true
