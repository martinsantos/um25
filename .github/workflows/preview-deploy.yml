name: Preview Deploy to GitHub Pages

on:
  push:
    branches:
      - 'feature/*'
      - 'claude/*'
      - 'develop'
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    name: Build Preview
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static preview
        run: npm run build:preview
        env:
          PUBLIC_DIRECTUS_URL: ''

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-preview:
    needs: build-preview
    runs-on: ubuntu-latest
    name: Deploy Preview
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Preview URL
        run: echo "Preview URL - ${{ steps.deployment.outputs.page_url }}"
