name: Prepare final SITREP cutover under a scoped fence

on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-sitrep-fence-refresh.yml'
      - 'scripts/ops/hostinger-migration/*sitrep*.py'
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Enter START only after the brief SITREP maintenance window is explicitly authorized'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-migration-${{ github.event_name == 'workflow_dispatch' && 'preparation' || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sitrep_*' -v
  prepare:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.acknowledgement == 'START'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Fence SITREP, preserve its data, and test a restricted ingress
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15)
          source=root@23.105.176.45
          target=root@179.198.115.115
          source_root=/root/umsa-sitrep-migration
          source_run="$source_root/$id"
          target_root=/srv/umsa-migration/sitrep-cutover-tooling
          target_run="$target_root/$id"
          ssh "${opts[@]}" "$source" "test ! -L $source_root && { test -d $source_root || install -d -m 0700 $source_root; } && test \"\$(stat -c %a $source_root)\" = 700 && test ! -e $source_run && test ! -L $source_run && install -d -m 0700 $source_run"
          ssh "${opts[@]}" "$target" "test ! -L $target_root && { test -d $target_root || install -d -m 0700 $target_root; } && test \"\$(stat -c %a $target_root)\" = 700 && test ! -e $target_run && test ! -L $target_run && install -d -m 0700 $target_run"
          source_files=(sitrep-source-fence.py sitrep-fence-watchdog.py sitrep-write-lock.py sitrep-gate-config.py)
          target_files=(sitrep-final-refresh.py sitrep-database-swap.py sitrep-public-ingress.py sitrep-public-activate.py rehearse-sitrep-ingress.py)
          for file in "${source_files[@]}"; do
            scp "${opts[@]}" "scripts/ops/hostinger-migration/$file" "$source:$source_run/"
            local_hash=$(sha256sum "scripts/ops/hostinger-migration/$file" | cut -d ' ' -f1)
            remote_hash=$(ssh "${opts[@]}" "$source" "sha256sum $source_run/$file" | cut -d ' ' -f1)
            [[ "$local_hash" = "$remote_hash" ]]
          done
          for file in "${target_files[@]}"; do
            scp "${opts[@]}" "scripts/ops/hostinger-migration/$file" "$target:$target_run/"
            local_hash=$(sha256sum "scripts/ops/hostinger-migration/$file" | cut -d ' ' -f1)
            remote_hash=$(ssh "${opts[@]}" "$target" "sha256sum $target_run/$file" | cut -d ' ' -f1)
            [[ "$local_hash" = "$remote_hash" ]]
          done
          fenced=false
          ready=false
          cleanup() {
            if [[ "$fenced" = true && "$ready" != true ]]; then
              ssh "${opts[@]}" "$source" "python3 $source_run/sitrep-fence-watchdog.py $id" || true
            fi
          }
          trap cleanup EXIT
          ssh "${opts[@]}" "$source" "python3 $source_run/sitrep-source-fence.py $id"
          fenced=true
          ssh -A "${opts[@]}" "$target" "python3 $target_run/sitrep-final-refresh.py $id $id"
          ssh -A "${opts[@]}" "$target" "python3 $target_run/sitrep-public-ingress.py $id $id 40601305799-1"
          ready=true
          echo "SITREP remains in maintenance until the offsite hash is independently checked and activation is dispatched."
