name: Hostinger UMSA production

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tailwind.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-umsa-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && vars.UMSA_PRODUCTION_TARGET == 'hostinger'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.6'
      - name: Validate and build the exact release
        run: |
          npm ci --include=dev
          npm run lint
          npm run typecheck
          npm run audit:css
          npm run test:ci
          npm run build
          npm run seo:ci
          python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_*.py' -q
          npm prune --omit=dev --ignore-scripts
          tar -czf "$RUNNER_TEMP/umsa-clean-web.tar.gz" dist node_modules package.json package-lock.json
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Check available disk before sending the CI package
        env:
          PREVIOUS_MASTER: ${{ github.event.before }}
          CLEAN_WEB_PACKAGE: ${{ runner.temp }}/umsa-clean-web.tar.gz
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15)
          size=$(stat -c %s "$CLEAN_WEB_PACKAGE")
          available=$(ssh "${opts[@]}" root@179.198.115.115 "df -B1 --output=avail /srv | tail -n 1" | tr -d '[:space:]')
          [[ "$available" =~ ^[0-9]+$ ]]
          required=$((size + (5 * size > 5 * 1024**3 ? 5 * size : 5 * 1024**3)))
          if [[ "$PREVIOUS_MASTER" == '8ed527635d8c0f3bbdf869c7cb31c3d38457df05' ]]; then
            installed=$(du -sc -B1 dist node_modules package.json package-lock.json | awk 'END {print $1}')
            backup_floor=$((10 * 1024**3 + size + installed))
            if (( backup_floor > required )); then required=$backup_floor; fi
            if (( available < required )); then
              program=scripts/ops/hostinger-migration/share-portadas-20261123.py
              remote_command=$(python3 "$program" command "$required")
              ssh "${opts[@]}" -o ServerAliveInterval=30 root@179.198.115.115 "$remote_command" < "$program" | tee "$RUNNER_TEMP/umsa-portadas-static.jsonl"
              python3 "$program" verify "$required" < "$RUNNER_TEMP/umsa-portadas-static.jsonl"
              available=$(ssh "${opts[@]}" root@179.198.115.115 "df -B1 --output=avail /srv | tail -n 1" | tr -d '[:space:]')
              [[ "$available" =~ ^[0-9]+$ ]]
            fi
          fi
          case "$PREVIOUS_MASTER" in
            d0a039d6e0071ed34af96ea28561dde1eb19b347) retirement=prune-pr678-transport.py ;;
            cd55cedf308e4904916cf57e8a3a29871c6cbd82) retirement=prune-catalog-transports.py ;;
            2e3f76b99044bbd05fe3bc30a555f6dba598398a) retirement=prune-pr687-transport.py ;;
            e4c8024ab6231aa6e8eab99dc9191ce77cbd5bf2)
              retirement=prune-featured-case-transports.py
              installed=$(du -sc -B1 dist node_modules package.json package-lock.json | awk 'END {print $1}')
              backup_floor=$((10 * 1024**3 + size + installed))
              if (( backup_floor > required )); then required=$backup_floor; fi
              ;;
            14f54947c91902fe9bdb390d41aa16d1c74f8a37)
              retirement=prune-software-case-transports.py
              installed=$(du -sc -B1 dist node_modules package.json package-lock.json | awk 'END {print $1}')
              backup_floor=$((10 * 1024**3 + size + installed))
              if (( backup_floor > required )); then required=$backup_floor; fi
              ;;
            *) retirement='' ;;
          esac
          if (( available < required )) && [[ -n "$retirement" ]]; then
            ops=scripts/ops/hostinger-migration
            program="$RUNNER_TEMP/prune-approved.py"
            sed '/^if __name__ == /,$d' "$ops/prune-reviewed-migration.py" > "$program"
            sed '/^if __name__==/,$d' "$ops/prune-20261115-equipment-packages.py" >> "$program"
            cat "$ops/$retirement" >> "$program"
            inspect=$(ssh "${opts[@]}" root@179.198.115.115 "python3 -B - inspect $required" < "$program")
            snapshot=$(jq -er '.snapshot_sha256' <<< "$inspect")
            [[ "$snapshot" =~ ^[a-f0-9]{64}$ ]]
            ssh "${opts[@]}" root@179.198.115.115 "env GITHUB_ACTIONS=true python3 -B - apply $required $snapshot" < "$program"
            available=$(ssh "${opts[@]}" root@179.198.115.115 "df -B1 --output=avail /srv | tail -n 1" | tr -d '[:space:]')
            [[ "$available" =~ ^[0-9]+$ ]]
          fi
          if (( available < required )); then
            echo "Available disk $available bytes is below the existing publisher requirement of $required bytes before transfer." >&2
            exit 1
          fi
      - name: Publish only after the migration cutover gate
        env:
          CLEAN_WEB_PACKAGE: ${{ runner.temp }}/umsa-clean-web.tar.gz
        run: bash scripts/ops/hostinger-migration/ship-web-build.sh publish
