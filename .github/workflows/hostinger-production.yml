name: Hostinger UMSA production

on:
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'astro.config.mjs'
      - 'tailwind.config.*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hostinger-umsa-production
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  publish:
    if: github.ref == 'refs/heads/master' && vars.UMSA_PRODUCTION_TARGET == 'hostinger'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20.19.6'
      - name: Validate and build the exact release
        run: |
          npm ci --include=dev
          npm run lint
          npm run typecheck
          npm run audit:css
          npm run test:ci
          npm run build
          npm run seo:ci
          python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_*.py' -q
          npm prune --omit=dev --ignore-scripts
          tar -czf "$RUNNER_TEMP/umsa-clean-web.tar.gz" dist node_modules package.json package-lock.json
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Remove only the four transfer archives approved on November 12
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15 -o ServerAliveInterval=30)
          script=scripts/ops/hostinger-migration/prune-approved-transfer-archives.py
          ssh "${opts[@]}" root@179.198.115.115 'python3 - inspect' < "$script" > "$RUNNER_TEMP/transport-inspection.json"
          snapshot=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["snapshot_sha256"])' "$RUNNER_TEMP/transport-inspection.json")
          [[ "$snapshot" =~ ^[a-f0-9]{64}$ ]]
          cat "$RUNNER_TEMP/transport-inspection.json"
          ssh "${opts[@]}" root@179.198.115.115 "env GITHUB_ACTIONS=true python3 - apply $snapshot" < "$script"
      - name: Check available disk before sending the CI package
        env:
          CLEAN_WEB_PACKAGE: ${{ runner.temp }}/umsa-clean-web.tar.gz
        run: |
          set -euo pipefail
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15)
          size=$(stat -c %s "$CLEAN_WEB_PACKAGE")
          available=$(ssh "${opts[@]}" root@179.198.115.115 "df -B1 --output=avail /srv | tail -n 1" | tr -d '[:space:]')
          [[ "$available" =~ ^[0-9]+$ ]]
          required=$((size + (5 * size > 5 * 1024**3 ? 5 * size : 5 * 1024**3)))
          if (( available < required )); then
            echo "Available disk $available bytes is below the existing publisher requirement of $required bytes before transfer." >&2
            exit 1
          fi
      - name: Publish only after the migration cutover gate
        env:
          CLEAN_WEB_PACKAGE: ${{ runner.temp }}/umsa-clean-web.tar.gz
        run: bash scripts/ops/hostinger-migration/ship-web-build.sh publish
