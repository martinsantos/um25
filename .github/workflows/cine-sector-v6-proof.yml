name: Sector cinema v6 proof
on:
  workflow_call:
    inputs:
      scenes:
        type: string
        default: 'clinic,winery'
      frames:
        type: string
        default: '60,504,756'
      width:
        type: string
        default: '1920'
      samples:
        type: string
        default: '48'
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - id: plan
        env:
          SCENES: ${{ inputs.scenes }}
          FRAMES: ${{ inputs.frames }}
        run: |
          python3 - <<'PY'
          import os, json
          allowed = {'building', 'clinic', 'terminal', 'plant', 'winery', 'mine'}
          scenes = [s.strip() for s in os.environ['SCENES'].split(',') if s.strip()]
          frames = [int(f) for f in os.environ['FRAMES'].split(',') if f.strip()]
          assert scenes and all(s in allowed for s in scenes) and frames and all(0 <= f < 1080 for f in frames)
          rows = [dict(scene=s, frame=f) for s in scenes for f in frames]
          open(os.environ['GITHUB_OUTPUT'], 'a').write('matrix=' + json.dumps({'include': rows}) + '\n')
          PY
  render:
    needs: plan
    name: ${{ matrix.scene }} / ${{ matrix.frame }}
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cine/render-sector-project-v6.py
            scripts/cine/prepare-blender-fonts.py
            src/assets/cine/isometric/site-projects-v1.json
            public/fonts/um-sans
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Prepare remote studio
        run: |
          sudo timeout 120 apt-get -o Acquire::Retries=1 update -qq || true
          sudo timeout 240 apt-get install -y --no-install-recommends libgl1 libegl1 libxrender1 libxi6 xvfb libgl1-mesa-dri
          curl --retry 3 --connect-timeout 15 --max-time 240 -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender.tar.xz
          curl --retry 3 --connect-timeout 15 --max-time 240 -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 -o blender.sha256
          awk '$2 == "blender-4.5.3-linux-x64.tar.xz" {print $1 "  blender.tar.xz"}' blender.sha256 > selected.sha256
          test -s selected.sha256 && sha256sum -c selected.sha256
          tar -xf blender.tar.xz
          python -m pip install --disable-pip-version-check fonttools==4.58.0 skia-pathops==0.8.0.post2 pillow==11.2.1 numpy==2.2.6
          python scripts/cine/prepare-blender-fonts.py public/fonts/um-sans /tmp/um-fonts
      - name: Render proof frame
        run: |
          ulimit -c 0
          STATUS=0
          xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./blender-4.5.3-linux-x64/blender -b -t 4 --python-exit-code 1 --python scripts/cine/render-sector-project-v6.py -- --scene ${{ matrix.scene }} --composition wide --width ${{ inputs.width }} --samples ${{ inputs.samples }} --start ${{ matrix.frame }} --end ${{ matrix.frame }} --font-dir /tmp/um-fonts --output frames || STATUS=$?
          if [ "$STATUS" != 0 ] && [ "$STATUS" != 139 ]; then exit "$STATUS"; fi
          test -s frames/$(printf '%04d' ${{ matrix.frame }}).png
          cat frames/render-info.json
      - uses: actions/upload-artifact@v7
        with:
          name: v6-proof-${{ matrix.scene }}-${{ matrix.frame }}
          path: frames
          retention-days: 7
