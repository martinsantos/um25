name: Blender service cinema
on:
  workflow_dispatch:
    inputs:
      version:
        description: Authored delivery and recoverable native fire installation cinema
        type: choice
        options: [v1, fire-v2, network-v2]
        default: v1
      mode:
        type: choice
        options: [proof, motion-proof, full, repair, assemble]
        default: proof
      services:
        description: 'Comma-separated service codes, or all'
        default: all
      proof_frames:
        description: 'Native v2 films; up to five exact native frame numbers for a targeted framing check'
        default: '0,460,960'
      repairs:
        description: 'Exact missing fragments, for example 102:11,107:3'
        default: ''
      source_run:
        description: 'Original full render, for assembly after recovery'
        default: ''
      repair_runs:
        description: 'Comma-separated successful repair runs'
        default: ''
      engine:
        type: choice
        options: [eevee, cycles, workbench, baked]
        default: cycles
permissions:
  contents: read
  actions: read
concurrency:
  group: blender-services-${{ github.ref }}-${{ inputs.version || 'v1' }}-${{ inputs.engine || 'cycles' }}-${{ inputs.mode || 'proof' }}-${{ inputs.mode == 'repair' && inputs.repairs || 'batch' }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  LIBGL_ALWAYS_SOFTWARE: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      services: ${{ steps.plan.outputs.services }}
    steps:
      - id: plan
        env:
          VERSION: ${{ inputs.version || 'v1' }}
          ENGINE: ${{ inputs.engine || 'cycles' }}
          MODE: ${{ inputs.mode || 'proof' }}
          SERVICES: ${{ inputs.services || 'all' }}
          REPAIRS: ${{ inputs.repairs }}
          PROOF_FRAMES: ${{ inputs.proof_frames || '0,460,960' }}
        run: |
          python3 - <<'PY'
          import json,os
          assert os.environ['ENGINE'] in (['cycles','workbench','baked'] if os.environ['VERSION'] in ['fire-v2','network-v2'] else ['eevee','cycles'])
          assert os.environ['MODE']!='motion-proof' or os.environ['VERSION'] in ['fire-v2','network-v2']
          codes=['101','102','103','105','106','107','108']
          selected=codes if os.environ['SERVICES']=='all' else os.environ['SERVICES'].split(',')
          assert selected and set(selected)<=set(codes) and len(selected)==len(set(selected))
          stride=120 if os.environ['VERSION'] in ['fire-v2','network-v2'] else 48
          rows=[dict(service=s,part=1,start=0,end=0) for s in selected] if os.environ['MODE']=='proof' else [dict(service=s,part=i+1,start=i*stride,end=(i+1)*stride-1) for s in selected for i in range(12)]
          if os.environ['MODE']=='repair':
              pairs=[item.split(':') for item in os.environ['REPAIRS'].split(',')]
              assert pairs and all(len(pair)==2 and pair[0] in codes and pair[1].isdigit() and 1<=int(pair[1])<=12 for pair in pairs)
              assert len({tuple(pair) for pair in pairs})==len(pairs)
              rows=[dict(service=code,part=int(part),start=(int(part)-1)*stride,end=int(part)*stride-1) for code,part in pairs]
          if os.environ['VERSION'] in ['fire-v2','network-v2']:
              code='107' if os.environ['VERSION']=='fire-v2' else '101'
              assert selected==[code] and all(row['service']==code for row in rows), 'The installation belongs to its authored discipline'
              if code=='101':assert os.environ['MODE'] in ['proof','motion-proof'], 'Review network composition before enabling a full render'
              frames=[int(f) for f in os.environ['PROOF_FRAMES'].split(',')]
              assert 1<=len(frames)<=5 and len(set(frames))==len(frames) and all(0<=f<1440 for f in frames)
              if os.environ['MODE']=='proof':rows=[dict(service=code,part=i+1,start=f,end=f) for i,f in enumerate(frames)]
              elif os.environ['MODE']=='motion-proof':rows=[dict(service=code,part=4,start=790 if code=='107' else 580,end=801 if code=='107' else 591)]
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write('matrix='+json.dumps({'include':rows})+'\n')
              out.write('services='+json.dumps(selected)+'\n')
          PY
  render:
    if: inputs.mode != 'assemble'
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cine/render-service-cinema-v1.py
            scripts/cine/render-fire-project-v2.py
            scripts/cine/render-network-project-v2.py
            scripts/cine/check-service-composition.py
          sparse-checkout-cone-mode: false
      - name: Install verified official Blender
        timeout-minutes: 20
        run: |
          MISSING=()
          PACKAGES=(libgl1 libegl1 libxrender1 libxi6 xvfb)
          if [ '${{ inputs.mode }}' = full ] || [ '${{ inputs.mode }}' = repair ]; then PACKAGES+=(ffmpeg); fi
          for PACKAGE in "${PACKAGES[@]}"; do
            if ! dpkg-query -W -f='${Status}' "$PACKAGE" 2>/dev/null | grep -q '^install ok installed$'; then MISSING+=("$PACKAGE"); fi
          done
          if [ ${#MISSING[@]} -gt 0 ]; then
            echo "Installing only missing render dependencies: ${MISSING[*]}"
            sudo timeout 90 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 update -qq || true
            sudo timeout 180 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 install -y --no-install-recommends "${MISSING[@]}"
          fi
          curl --retry 3 --connect-timeout 15 --max-time 240 -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3-linux-x64.tar.xz -o blender-4.5.3-linux-x64.tar.xz
          curl --retry 3 --connect-timeout 15 --max-time 60 -fsSL https://download.blender.org/release/Blender4.5/blender-4.5.3.sha256 -o blender.sha256
          awk '$2 == "blender-4.5.3-linux-x64.tar.xz" {print}' blender.sha256 > blender-selected.sha256
          test -s blender-selected.sha256
          sha256sum -c blender-selected.sha256
          tar -xf blender-4.5.3-linux-x64.tar.xz
      - name: Render authored discipline
        env:
          SERVICE: ${{ matrix.service }}
          ENGINE: ${{ inputs.engine || 'cycles' }}
          MODE: ${{ inputs.mode || 'proof' }}
          START: ${{ matrix.start }}
          END: ${{ matrix.end }}
        run: |
          if [ '${{ inputs.version }}' = fire-v2 ] || [ '${{ inputs.version }}' = network-v2 ]; then
            AUTHOR='scripts/cine/render-fire-project-v2.py'
            if [ '${{ inputs.version }}' = network-v2 ]; then AUTHOR='scripts/cine/render-network-project-v2.py'; fi
            python3 "$AUTHOR" --validate-only
            RENDER=(./blender-4.5.3-linux-x64/blender)
            if [ "$ENGINE" != cycles ]; then RENDER=(xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1 ./blender-4.5.3-linux-x64/blender); fi
            "${RENDER[@]}" -b -t 4 --python-exit-code 1 --python "$AUTHOR" -- --engine "$ENGINE" --samples 32 --width 3840 --start "$START" --end "$END" --output frames
            exit 0
          fi
          python3 scripts/cine/render-service-cinema-v1.py --service "$SERVICE" --validate-only
          python3 scripts/cine/check-service-composition.py scripts/cine/render-service-cinema-v1.py "$SERVICE"
          SAMPLES=48
          if [ "$ENGINE" = cycles ]; then SAMPLES=24; fi
          EXTRA=()
          if [ "$MODE" = proof ]; then EXTRA=(--proof-frames 0,144,288); fi
          xvfb-run -a ./blender-4.5.3-linux-x64/blender -b -t 4 --python-exit-code 1 --python scripts/cine/render-service-cinema-v1.py -- --service "$SERVICE" --engine "$ENGINE" --samples "$SAMPLES" --start "$START" --end "$END" --output frames "${EXTRA[@]}"
      - uses: actions/upload-artifact@v7
        if: always() && ((inputs.mode || 'proof') == 'proof' || inputs.mode == 'motion-proof')
        with:
          name: ${{ inputs.version == 'network-v2' && format('network-project-v2-proof-{0}', matrix.part) || inputs.version == 'fire-v2' && format('fire-project-v2-proof-{0}', matrix.part) || format('service-proof-{0}', matrix.service) }}
          path: frames
          retention-days: 3
      - name: Encode recoverable part
        if: inputs.mode == 'full' || inputs.mode == 'repair'
        run: |
          cp frames/render-info.json part-${{ matrix.part }}-info.json
          if [ '${{ inputs.version }}' = fire-v2 ] || [ '${{ inputs.version }}' = network-v2 ]; then
            ffmpeg -v error -framerate 60 -start_number ${{ matrix.start }} -i frames/%04d.png -frames:v 120 -vf 'scale=out_color_matrix=bt709:out_range=tv,format=yuv420p' -c:v libx264 -preset medium -crf 18 -r 60 -g 120 -color_range tv -colorspace bt709 -color_primaries bt709 -color_trc iec61966-2-1 -an -movflags +faststart part-${{ matrix.part }}.mp4
            exit 0
          fi
          ffmpeg -v error -framerate 24 -start_number ${{ matrix.start }} -i frames/%04d.png -frames:v 48 -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -r 24 -g 48 -an -movflags +faststart part-${{ matrix.part }}.mp4
      - uses: actions/upload-artifact@v7
        if: inputs.mode == 'full' || inputs.mode == 'repair'
        with:
          name: ${{ inputs.version == 'network-v2' && format('network-project-v2-part-{0}', matrix.part) || inputs.version == 'fire-v2' && format('fire-project-v2-part-{0}', matrix.part) || format('service-{0}-part-{1}', matrix.service, matrix.part) }}
          path: |
            part-${{ matrix.part }}.mp4
            part-${{ matrix.part }}-info.json
          retention-days: 3
  assemble:
    needs: [plan, render]
    if: always() && needs.plan.result == 'success' && ((inputs.mode == 'full' && needs.render.result == 'success') || inputs.mode == 'assemble')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.plan.outputs.services) }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/cine/assemble-fire-project-v2.py
            scripts/cine/assemble-technical-project-v2.py
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v8
        with:
          pattern: ${{ inputs.version == 'network-v2' && 'network-project-v2-part-*' || inputs.version == 'fire-v2' && 'fire-project-v2-part-*' || format('service-{0}-part-*', matrix.service) }}
          run-id: ${{ inputs.source_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Restore only the recovered fragments
        if: inputs.mode == 'assemble' && inputs.repair_runs != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPAIR_RUNS: ${{ inputs.repair_runs }}
          VERSION: ${{ inputs.version }}
        run: |
          [[ "$REPAIR_RUNS" =~ ^[0-9]+(,[0-9]+)*$ ]]
          IFS=',' read -ra RUNS <<< "$REPAIR_RUNS"
          for RUN in "${RUNS[@]}"; do
            PATTERN='^service-[0-9]+-part-[0-9]+$'
            if [ "$VERSION" = fire-v2 ]; then PATTERN='^fire-project-v2-part-[0-9]+$'; fi
            if [ "$VERSION" = network-v2 ]; then PATTERN='^network-project-v2-part-[0-9]+$'; fi
            NAMES=$(gh api "repos/$GH_REPO/actions/runs/$RUN/artifacts?per_page=100" --jq ".artifacts[].name | select(test(\"$PATTERN\"))")
            test -n "$NAMES"
            while IFS= read -r NAME; do gh run download "$RUN" -n "$NAME" -D "$NAME"; done <<< "$NAMES"
          done
      - name: Assemble, derive mobile edition and validate
        env:
          SERVICE: ${{ matrix.service }}
          SOURCE_RUN: ${{ inputs.source_run || github.run_id }}
          REPAIR_RUNS: ${{ inputs.repair_runs }}
        run: |
          if ! sudo timeout 120 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update -qq; then
            echo "Package index refresh timed out; using runner cached signed indexes."
          fi
          sudo timeout 600 apt-get -o Acquire::Retries=1 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y -qq ffmpeg
          if [ '${{ inputs.version }}' = network-v2 ]; then
            python3 scripts/cine/assemble-technical-project-v2.py --scene network-project-v2
            exit 0
          fi
          if [ '${{ inputs.version }}' = fire-v2 ]; then
            python3 scripts/cine/assemble-fire-project-v2.py
            exit 0
          fi
          mkdir delivery
          for PART in $(seq 1 12); do printf "file 'service-%s-part-%s/part-%s.mp4'\n" "$SERVICE" "$PART" "$PART"; done > parts.txt
          SCENE=$(python3 -c "import json;print(json.load(open('service-${SERVICE}-part-1/part-1-info.json'))['scene'])")
          NAME="delivery/cine-$SCENE"
          ffmpeg -v error -f concat -safe 0 -i parts.txt -c copy -movflags +faststart "$NAME.mp4"
          ffmpeg -v error -i "$NAME.mp4" -vf 'crop=1520:1080:400:0,pad=1520:1520:0:220:color=0x0B1019,scale=1080:1080' -c:v libx264 -preset medium -crf 18 -pix_fmt yuv420p -an -movflags +faststart "$NAME-sq.mp4"
          ffmpeg -v error -i "$NAME.mp4" -frames:v 1 -q:v 2 "$NAME-poster.jpg"
          ffmpeg -v error -i "$NAME-sq.mp4" -frames:v 1 -q:v 2 "$NAME-poster-sq.jpg"
          for SUFFIX in poster poster-sq; do ffmpeg -v error -i "$NAME-$SUFFIX.jpg" -c:v libaom-av1 -still-picture 1 -crf 24 "$NAME-$SUFFIX.avif"; done
          ffmpeg -v error -i "$NAME.mp4" -f framemd5 delivery/frame-integrity.txt
          ffmpeg -v error -i "$NAME-sq.mp4" -f null -
          ffprobe -v error -count_frames -show_streams -show_format -of json "$NAME.mp4" > delivery/validation.json
          ffprobe -v error -count_frames -show_streams -show_format -of json "$NAME-sq.mp4" > delivery/validation-square.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          for filename,width,height in [('validation.json',1920,1080),('validation-square.json',1080,1080)]:
              v=json.loads(Path('delivery',filename).read_text())['streams'][0]
              assert (v['codec_name'],v['width'],v['height'],v['nb_read_frames'],v['avg_frame_rate'],v['pix_fmt'])==('h264',width,height,'576','24/1','yuv420p'),v
              assert abs(float(v['duration'])-24)<.01
          infos=[json.loads(Path(f"service-{os.environ['SERVICE']}-part-{i}/part-{i}-info.json").read_text()) for i in range(1,13)]
          decoded=[line for line in Path('delivery/frame-integrity.txt').read_text().splitlines() if line and not line.startswith('#')]
          assert len(decoded)==576
          assert len({line.split(',')[-1].strip() for line in decoded})>=570, 'Encoded movie freezes or duplicates its frames'
          info=infos[0]
          assert all(item['service']==os.environ['SERVICE'] and item['scene']==info['scene'] and item['engine']==info['engine'] and item['samples']==info['samples'] for item in infos)
          info['sourceRuns']=[os.environ['SOURCE_RUN']]+[r for r in os.environ.get('REPAIR_RUNS','').split(',') if r]
          info['timings']=[t for item in infos for t in item['timings']]
          info['bounds']=[b for item in infos for b in item['bounds']]
          assert [t['frame'] for t in info['timings']]==list(range(576))
          assert sum(p.stat().st_size for p in Path('delivery').glob('*'))<40_000_000
          Path('delivery/render-info.json').write_text(json.dumps(info))
          PY
          sha256sum delivery/* > delivery/SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.version == 'network-v2' && 'network-project-v2-delivery' || inputs.version == 'fire-v2' && 'fire-project-v2-delivery' || format('service-cinema-{0}', matrix.service) }}
          path: delivery
          retention-days: 5
