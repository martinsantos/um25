name: Production Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggers

env:
  NODE_VERSION: '18.x'
  DEPLOY_PATH: '/root/fumbling-field'

jobs:
  #===========================================================================
  # JOB 1: BUILD & TEST
  #===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for better caching

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Lint check completed"
        continue-on-error: true  # No bloquear por ahora

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test || echo "Tests completed"
        continue-on-error: true  # No bloquear por ahora

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true  # Don't fail build if storage quota exceeded
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  #===========================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  #===========================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://ultimamilla.com.ar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download build artifacts
        id: download-artifact
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: dist-build
          path: dist/

      - name: Build locally if artifacts not available
        if: steps.download-artifact.outcome == 'failure' || !hashFiles('dist/**')
        run: |
          npm ci --include=dev
          npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 23.105.176.45 >> ~/.ssh/known_hosts

      - name: Deploy to server via rsync
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='directus-admin/.env' \
            --exclude='backups' \
            --exclude='.local_production_files' \
            --exclude='public/cache' \
            --exclude='uploads' \
            --exclude='ecosystem.config.cjs' \
            --exclude='*.log' \
            ./ root@23.105.176.45:${{ env.DEPLOY_PATH }}/

      - name: Install dependencies on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            npm ci --production
            # Ensure Directus uploads dir is writable by container (uid 1000)
            chown -R 1000:1000 ${{ env.DEPLOY_PATH }}/uploads/ 2>/dev/null || true
            chmod 775 ${{ env.DEPLOY_PATH }}/uploads/ 2>/dev/null || true

      - name: Restart PM2 process
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            export SMTP_HOST='${{ secrets.SMTP_HOST }}'
            export SMTP_PORT='${{ secrets.SMTP_PORT }}'
            export SMTP_USER='${{ secrets.SMTP_USER }}'
            export SMTP_PASS='${{ secrets.SMTP_PASS }}'
            export SMTP_FROM='${{ secrets.SMTP_FROM }}'
            pm2 startOrRestart ecosystem.config.cjs --only astro-ultimamilla --update-env
            pm2 restart astro-ultimamilla --update-env
            pm2 save

      - name: Health check
        run: |
          echo "Waiting 15s for app to start..."
          sleep 15

          APEX_CHECK=$(curl -4 -sS -o /dev/null --max-time 20 \
            -w "%{http_code} %{redirect_url}" \
            https://ultimamilla.com.ar/ || true)
          WWW_CHECK=$(curl -4 -sS -o /dev/null --max-time 20 \
            -w "%{http_code} %{redirect_url}" \
            https://www.ultimamilla.com.ar/ || true)

          echo "apex check: $APEX_CHECK"
          echo "www check: $WWW_CHECK"

          if echo "$APEX_CHECK" | grep -Eq '^200[[:space:]]*$' && \
             echo "$WWW_CHECK" | grep -Eq '^30(1|8)[[:space:]]+https://ultimamilla\.com\.ar/'; then
            echo "✅ Canonical health check passed: apex serves 200 and www redirects to apex"
          else
            echo "❌ Canonical health check failed"
            exit 1
          fi

      - name: Smoke test - verify content integrity
        run: |
          HOMEPAGE=$(curl -sL https://ultimamilla.com.ar)
          ERRORS=0

          # 1. Service images can use either Directus /assets/ URLs OR local /images/ paths
          DIRECTUS_IMGS=$(echo "$HOMEPAGE" | grep -oE 'src="/assets/[a-f0-9-]{36}[^"]*"' | wc -l)
          LOCAL_IMGS=$(echo "$HOMEPAGE" | grep -oE 'src="/images/services/[^"]*"' | wc -l)
          TOTAL_IMGS=$((DIRECTUS_IMGS + LOCAL_IMGS))

          if [ "$TOTAL_IMGS" -lt 4 ]; then
            echo "❌ Only $TOTAL_IMGS service images found (expected >= 4)"
            echo "   Directus: $DIRECTUS_IMGS, Local: $LOCAL_IMGS"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Service images: $TOTAL_IMGS found (Directus: $DIRECTUS_IMGS, Local: $LOCAL_IMGS)"
          fi

          # 2. Hero section must have background images
          HERO_IMGS=$(echo "$HOMEPAGE" | grep -oE 'hero-image' | wc -l)
          if [ "$HERO_IMGS" -lt 1 ]; then
            echo "❌ No hero images found"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Hero images: $HERO_IMGS found"
          fi

          # 3. Check for excessive placeholder images (should be fallbacks only)
          DEFAULTS=$(echo "$HOMEPAGE" | grep -oE 'src="[^"]*default-background[^"]*"' | wc -l)
          if [ "$DEFAULTS" -gt 10 ]; then
            echo "⚠️ WARNING: $DEFAULTS default-background images found (should be fallback only)"
          elif [ "$DEFAULTS" -gt 0 ]; then
            echo "✅ $DEFAULTS placeholder images found (acceptable as fallback)"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Smoke test failed with $ERRORS errors"
            exit 1
          fi
          echo "✅ All smoke tests passed"

      - name: Send deployment notification
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)

          echo "🚀 Deployment to production"
          echo "Commit: $COMMIT_SHA"
          echo "Author: $AUTHOR"
          echo "Message: $COMMIT_MSG"
          echo "Status: ${{ job.status }}"

  #===========================================================================
  # JOB 3: ROLLBACK (manual, solo en caso de fallo)
  #===========================================================================
  rollback:
    name: Rollback to Previous Version
    if: failure() && github.event_name == 'workflow_dispatch'
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            git fetch --tags
            git checkout v1.0.0-mvp
            npm ci --production
            pm2 restart astro-ultimamilla

      - name: Verify rollback
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://ultimamilla.com.ar)
          echo "Rollback health check: HTTP $HTTP_STATUS"
