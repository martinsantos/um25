name: Production Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      operation:
        description: 'Deploy or run separately approved, audited storage maintenance'
        type: choice
        default: deploy
        options: [deploy, storage-plan, storage-apply, uploads-audit]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '18.x'
  DEPLOY_PATH: '/root/fumbling-field'
  RELEASE_ID: ${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  #===========================================================================
  # JOB 1: BUILD & TEST
  #===========================================================================
  build-and-test:
    name: Build & Test
    if: github.event_name != 'workflow_dispatch' || inputs.operation == 'deploy'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better caching

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Check TypeScript
        run: npm run typecheck

      - name: CSS interaction contract
        run: npm run audit:css

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Don't fail build if storage quota exceeded
        with:
          name: dist-build
          path: |
            dist/
            !dist/client/cine/media/cine-v5-*
            !dist/client/cine/cine-studies-v5.js
            !dist/client/cine/services-story-v5.js
            !dist/client/cine/software-layers-v5.js
          retention-days: 1

  #===========================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  #===========================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.ultimamilla.com.ar

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install audit dependencies on runner
        run: npm ci

      - name: Download build artifacts
        id: download-artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dist-build
          path: dist/

      - name: Build locally if artifacts not available
        if: steps.download-artifact.outcome == 'failure' || !hashFiles('dist/**')
        run: |
          npm ci --include=dev
          npm run build

      - name: Setup SSH key
        id: ssh_agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 23.105.176.45 >> ~/.ssh/known_hosts

      # Continue the protected runtime release without touching production
      # source, unpublished cinema work or existing static assets. Restore the
      # ordinary source deploy only after that work is integrated.
      - name: Verify scoped release contents
        run: |
          set -euo pipefail
          git diff --name-only "${GITHUB_SHA}^1" "$GITHUB_SHA" > /tmp/umsa-release-paths.txt
          test -s /tmp/umsa-release-paths.txt
          while IFS= read -r path; do
            case "$path" in
              .github/workflows/production-deploy.yml|.github/workflows/community-demo-integrity.yml|\
              scripts/ops/deploy-scoped-dist.sh|scripts/ops/prune-inactive-umbot-deps.sh|scripts/ops/audit-directus-uploads.sh|\
              __tests__/runtimeConfigContracts.test.js|__tests__/nginxOps.test.ts|\
              docs/campaign-preview/PHOTO-SOURCES.md|docs/campaign-preview/README.md|\
              docs/campaign-preview/compose-email.mjs|docs/campaign-preview/comunidades-email.html|\
              docs/campaign-preview/variants/photo-a-wide.jpg|\
              docs/campaign-preview/variants/photo-b-wide.jpg|\
              docs/campaign-preview/variants/photo-c-wide.jpg|\
              public/images/software-comunidades/credencial-demo-email.gif|\
              public/images/software-comunidades/comunidad-rosario.jpg|\
              public/sw.js|\
              public/software/gestion-de-comunidades-profesionales/demo/*|\
              work/um-comunidades-demo/*|\
              src/pages/software/gestion-de-comunidades-profesionales.astro|\
              src/pages/software/gestion-de-comunidades-profesionales/demo/index.astro|\
              __tests__/blogEditorialScoringContracts.test.js|\
              __tests__/blogTopicMap.test.ts|package.json|\
              scripts/build-blog-topic-map.mjs|\
              src/components/SEO/SEOHead.astro|\
              src/components/SEO/TopicGuides.astro|\
              src/components/blog/BlogTopicLinks.astro|\
              src/components/blog/BlogTopicNav.astro|\
              src/config/servicios.ts|\
              src/data/blogTopicMap.generated.json|\
              src/data/blogTopicTaxonomy.ts|\
              src/data/geoResources.ts|\
              src/data/strategicLinkGraph.ts|\
              src/env.d.ts|src/pages/'[sector].astro'|\
              src/pages/blog/'[slug].astro'|\
              src/pages/blog/categoria/'[cat].astro'|\
              src/pages/blog/categoria/'[cat]'/rss.xml.ts|\
              src/pages/blog/index.astro|\
              src/pages/blog/tema/'[tema].astro'|\
              src/pages/blog/tema/'[tema]'/rss.xml.ts|\
              src/pages/llms-full.txt.ts|src/pages/llms.txt.ts|\
              src/pages/servicios/'[id]'/'[slug].astro'|\
              src/pages/sitemap-blog.xml.ts|\
              src/utils/blogRss.ts|src/utils/blogTopicCases.ts|\
              src/utils/blogTopicMap.ts|src/utils/getBlogData.ts) ;;
              # UM25 refactor: cine v4 (40 recorridos), páginas de producto
              # 104/105/106 y control visual.
              public/cine/cine-banner-v4.js|public/cine/cine-banner-v5.js|public/cine/cine-banner-v6.js|public/cine/cine-banner-v7.js|public/cine/cine-banner-v8.js|public/cine/sector-atlas-v2.js|public/cine/sector-atlas-v3.js|public/cine/cine-studies-v5.js|public/cine/product-tour-v5.js|\
              public/cine/services-story-v5.js|public/cine/software-layers-v5.js|\
              public/cine/isometric-services-v6.js|public/cine/isometric-services-v7.js|public/cine/service-atlas-v6.js|public/cine/service-atlas-v7.js|public/cine/service-atlas-v8.js|public/cine/service-atlas-v9.js|public/cine/service-atlas-v10.js|public/cine/service-atlas-v11.js|public/cine/service-atlas-v12.js|public/cine/service-atlas-v13.js|public/cine/service-atlas-v14.js|public/cine/service-atlas-v15.js|public/cine/service-atlas-v16.js|public/cine/request-sequence-v1.js|public/cine/request-sequence-v2.js|public/cine/request-sequence-v3.js|public/cine/request-sequence-v4.js|public/cine/operation-geometry-v2.js|public/cine/operation-geometry-v1.js|public/cine/service-atlas-v17.js|public/cine/service-atlas-v18.js|public/cine/service-atlas-v19.js|public/cine/network-journey-v7.js|public/cine/network-rack-v8.js|public/cine/network-rack-v9.js|public/cine/network-rack-v10.js|public/cine/network-rack-v11.js|public/cine/network-rack-v12.js|public/cine/network-rack-v13.js|public/cine/software-layers-v6.js|public/cine/software-layers-v7.js|public/cine/software-layers-v8.js|public/cine/software-layers-v9.js|\
              public/cine/hairline-v5.js|public/cine/hairline-v7.js|public/cine/LICENSE-hairline-v5.txt|public/cine/media/cine-*|\
              __tests__/visualInformationHubContracts.test.js|__tests__/cineMotionLifecycle.test.js|\
              docs/cine/v5-integration.md|docs/cine/storage-maintenance-20261004.md|\
              scripts/cine/import-v4-media.mjs|scripts/cine/build-hairline-v5.mjs|scripts/cine/vendor/*|\
              src/components/cine/*.astro|\
              src/components/templates/SectorTemplateUM26.astro|\
              src/components/v4/NavbarV4.astro|\
              src/data/cine/scenes.ts|src/data/cine/v4-media.json|\
              src/data/productPages.ts|src/data/cine/hardware.ts|src/data/cine/isometric.ts|src/data/cine/networkAssembly.ts|src/data/cine/serviceNarrative.ts|src/data/cine/sectorNarrative.ts|src/data/cine/site-movies-v1.json|src/data/cine/projectCinema.ts|\
              __tests__/requestSequence.test.js|docs/cine/causal-operation-20261006.md|docs/cine/narrative-direction-20261007.md|docs/cine/continuous-operation-20261006.md|docs/cine/experience-refinement-20261006.md|\
              scripts/cine/audit-webkit-layout.mjs|scripts/cine/build-request-operation-v1.py|scripts/cine/build-request-operation-v2.py|scripts/cine/build-request-operation-v3.py|\
              src/components/templates/SectorIndexUM26.astro|src/data/cine/operationGeometry.json|src/data/cine/operationNarrative.ts|src/data/cine/disciplineSystems.ts|src/data/cine/requestSequence.ts|\
              src/assets/cine/isometric/*|scripts/cine/build-isometric-v6.mjs|scripts/cine/isometric-models-v6.mjs|scripts/cine/build-operation-isometrics-v7.mjs|scripts/cine/build-site-project-v1.mjs|scripts/cine/build-discipline-systems.py|scripts/cine/render-site-project-v1.py|scripts/cine/render-site-project-v2.py|scripts/cine/render-software-system-v1.py|.github/workflows/cine-software-render.yml|scripts/cine/check-sector-preview.mjs|scripts/cine/check-integrated-preview.mjs|scripts/cine/audit-cinema-experience.mjs|.github/workflows/cine-experience-audit.yml|scripts/cine/import-site-cinema.mjs|scripts/cine/import-project-cinema-v3.mjs|scripts/cine/import-project-cinema-v4.mjs|scripts/cine/import-software-cinema-v1.mjs|.github/workflows/cine-project-render.yml|\
              __tests__/isometricServices.test.js|__tests__/isometricNarrative.test.js|__tests__/serviceAtlasAutoplay.test.js|__tests__/sectorProjectJourney.test.js|__tests__/sectorAtlasAutoplay.test.js|__tests__/visualInformationHubContracts.test.js|__tests__/networkJourney.test.js|scripts/cine/build-network-journey-v7.mjs|scripts/cine/build-network-rack-v8.mjs|scripts/cine/build-network-rack-v9.mjs|scripts/cine/build-network-rack-v10.mjs|scripts/cine/share-svg-primitives.js|scripts/cine/build-software-preview.mjs|scripts/cine/build-software-hairline-v7.mjs|__tests__/isometricPerformance.test.js|__tests__/disciplineSystems.test.js|__tests__/mobileOverflowContracts.test.js|docs/cine/isometric-v6.md|\
              src/pages/antecedentes/index.astro|\
              src/pages/certificaciones.astro|\
              src/pages/index.astro|\
              src/pages/servicios/'[id]'/ficha.astro|\
              src/pages/servicios/index.astro|\
              src/styles/cine-banner.css) ;;
              # Reviewed precision diagrams, native cinema and their evidence.
              .github/workflows/cine-framing-audit.yml|.github/workflows/cine-layer-camera-audit.yml|.github/workflows/cine-services-render.yml|__tests__/precisionSystemLifecycle.test.js|__tests__/fireSystemLifecycle.test.js|__tests__/disciplineCameraGeometry.test.js|\
              docs/cine/precision-review-20261007.md|docs/cine/seven-service-cinema-20261007.md|docs/cine/software-product-direction-20261007.md|\
              docs/cine/work-status-20261007.md|public/cine/cine-banner-v9.js|public/cine/precision-systems-v1.js|\
              public/cine/precision-systems-v2.js|public/cine/precision-systems-v3.js|public/cine/precision-systems-v4.js|\
              public/cine/precision-systems-v5.js|public/cine/precision-systems-v6.js|public/cine/fire-system-v1.js|public/cine/discipline-camera-v1.js|public/cine/service-atlas-v20.js|scripts/cine/assemble-software-v3.py|scripts/cine/assemble-fire-project-v2.py|scripts/cine/assemble-technical-project-v2.py|scripts/cine/import-technical-project-v2.mjs|scripts/cine/import-fire-project-v2.mjs|\
              scripts/cine/audit-precision-network.mjs|scripts/cine/audit-precision-webkit.mjs|scripts/cine/audit-software-frame.mjs|scripts/cine/audit-layer-camera.mjs|\
              scripts/cine/build-precision-network.py|scripts/cine/build-precision-fire.py|scripts/cine/build-precision-software.py|scripts/cine/check-service-composition.py|\
              scripts/cine/import-service-cinema-v1.mjs|scripts/cine/import-software-cinema-v2.mjs|scripts/cine/import-software-cinema-v3.mjs|\
              scripts/cine/precision-diagram-content.py|scripts/cine/prepare-blender-fonts.py|scripts/cine/recover-software-parts.py|\
              scripts/cine/refine-discipline-linework.py|scripts/cine/render-fire-project-v2.py|scripts/cine/render-network-project-v2.py|scripts/cine/render-security-project-v2.py|scripts/cine/render-telecom-project-v2.py|scripts/cine/render-service-cinema-v1.py|scripts/cine/render-software-system-v2.py|\
              scripts/cine/render-software-system-v3.py|scripts/cine/repack-software-color-v4.py|src/data/serviceSingleDemoSystem.ts) ;;
              *) echo "Unexpected release path: $path" >&2; exit 1 ;;
            esac
          done < /tmp/umsa-release-paths.txt
          # The scoped overlay restores every already-published public asset, so a
          # modified file under public/cine would silently ship its old version.
          # Cinema assets may only be added; ship changes under a new name.
          git diff --name-only --diff-filter=MR "${GITHUB_SHA}^1" "$GITHUB_SHA" -- public/cine \
            > /tmp/umsa-cine-modified.txt
          if [[ -s /tmp/umsa-cine-modified.txt ]]; then
            echo 'Published cinema assets cannot change in a scoped release:' >&2
            cat /tmp/umsa-cine-modified.txt >&2
            exit 1
          fi
          test -f dist/server/entry.mjs
          test -f dist/client/images/software-comunidades/credencial-demo-email.gif
          test -f dist/client/software/gestion-de-comunidades-profesionales/demo/index.html
          grep -Fq '/software/gestion-de-comunidades-profesionales/demo/' dist/client/sw.js

      # Each scoped release keeps the runtime it replaced (~1 GB). Only the newest
      # folder is a rollback target; keep the two newest and prune older ones so
      # the disk does not fill up release after release.
      - name: Prune old scoped release folders
        run: |
          set -euo pipefail
          ssh root@23.105.176.45 "bash -s -- '$DEPLOY_PATH'" <<'EOF'
          set -euo pipefail
          backups="$1/backups"
          mapfile -t old < <(
            find "$backups" -maxdepth 1 -type d -name 'umsa-campaign-[0-9]*-[0-9]*' -printf '%f\n' 2>/dev/null |
              sort -t- -k3,3n -k4,4n | head -n -2
          )
          if (( ${#old[@]} == 0 )); then
            echo 'No old scoped release folders to prune'
            exit 0
          fi
          for name in "${old[@]}"; do
            [[ "$name" =~ ^umsa-campaign-[0-9]+-[0-9]+$ ]] || continue
            du -sh "$backups/$name"
            rm -rf -- "${backups:?}/$name"
          done
          echo "Pruned ${#old[@]} old scoped release folders"
          EOF

      # Read-only: report what is using the server disk (scoped release folders,
      # git worktrees) and stop before uploading when the staged build plus the
      # swap script's 2.5 GB reserve would not fit, so an aborted release never
      # leaves another orphan incoming-dist behind.
      - name: Report and check server storage
        run: |
          set -euo pipefail
          need_kb=$(( $(du -sk dist | cut -f1) + 2500000 ))
          ssh root@23.105.176.45 "bash -s -- '$DEPLOY_PATH' '$need_kb'" <<'EOF'
          set -euo pipefail
          app="$1"; need_kb="$2"
          df -h "$app"
          echo '--- scoped release folders (newest first)'
          { ls -1dt "$app"/backups/umsa-campaign-* 2>/dev/null || true; } | head -20 | xargs -r du -sh
          echo '--- backups total'
          du -sh "$app/backups" 2>/dev/null || true
          echo '--- git worktrees'
          git -C "$app" worktree list 2>/dev/null || true
          git -C "$app" worktree prune --dry-run -v 2>/dev/null || true
          used_pct="$(df -Pk "$app" | awk 'NR==2 {gsub(/%/, "", $5); print $5}')"
          if (( used_pct > 90 )); then
            echo "Disk usage ${used_pct}% exceeds the architecture limit of 90%; nothing was uploaded" >&2
            exit 1
          fi
          avail_kb="$(df -Pk "$app" | awk 'NR==2 {print $4}')"
          echo "available_kb=$avail_kb need_kb=$need_kb"
          if (( avail_kb < need_kb )); then
            echo 'Not enough free space to stage this release; nothing was uploaded' >&2
            exit 1
          fi
          EOF

      - name: Stage build outside live site
        run: |
          set -euo pipefail
          STAGE="${DEPLOY_PATH}/backups/umsa-campaign-${RELEASE_ID}/incoming-dist"
          ssh root@23.105.176.45 "mkdir -p '$STAGE'"
          # Keep superseded experiments in Git for provenance, outside the release.
          rsync -az --checksum \
            --exclude='/client/cine/media/cine-v5-*' \
            --exclude='/client/cine/cine-studies-v5.js' \
            --exclude='/client/cine/services-story-v5.js' \
            --exclude='/client/cine/software-layers-v5.js' \
            dist/ "root@23.105.176.45:$STAGE/"

      - name: Swap verified runtime with automatic origin rollback
        run: |
          ssh root@23.105.176.45 "bash -s -- '$RELEASE_ID' deploy" \
            < scripts/ops/deploy-scoped-dist.sh

      - name: Health check origin
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 2m
          script: |
            echo "Waiting for the local Astro origin on the production server..."
            for attempt in $(seq 1 30); do
              if curl -4 -fsS --max-time 3 http://127.0.0.1:4321/health > /tmp/ultimamilla-health.json; then
                echo "✅ Origin health passed on attempt $attempt"
                cat /tmp/ultimamilla-health.json
                break
              fi
              if [ "$attempt" -eq 30 ]; then
                echo "❌ Origin health did not recover within 60 seconds"
                exit 1
              fi
              sleep 2
            done

      - name: Health check edge
        run: |
          echo "Waiting 15s before edge checks..."
          sleep 15

          APEX_CHECK=$(curl -4 -sS -o /dev/null --max-time 20 \
            -w "%{http_code} %{redirect_url}" \
            https://ultimamilla.com.ar/ || true)
          WWW_CHECK=$(curl -4 -sS -o /dev/null --max-time 20 \
            -w "%{http_code} %{redirect_url}" \
            https://www.ultimamilla.com.ar/ || true)

          echo "apex check: $APEX_CHECK"
          echo "www check: $WWW_CHECK"

          if echo "$WWW_CHECK" | grep -Eq '^200[[:space:]]*$' && \
             echo "$APEX_CHECK" | grep -Eq '^30(1|8)[[:space:]]+https://www\.ultimamilla\.com\.ar/'; then
            echo "✅ Canonical health check passed: www serves 200 and apex redirects to www"
          else
            echo "❌ Canonical health check failed"
            exit 1
          fi

      - name: Check colleges landing, demo and GIF at public edge
        run: |
          set -euo pipefail
          BASE=https://www.ultimamilla.com.ar
          curl -4 -fsS --max-time 20 \
            "$BASE/software/gestion-de-comunidades-profesionales" \
            -o /tmp/umsa-colleges-landing.html
          grep -Fq 'Un espacio propio para tu colegio y sus matriculados:' \
            /tmp/umsa-colleges-landing.html
          grep -Fq 'id="gc-form"' /tmp/umsa-colleges-landing.html
          grep -Fq 'data-cta="demo-hero"' /tmp/umsa-colleges-landing.html
          curl -4 -fLsS --max-time 20 \
            "$BASE/software/gestion-de-comunidades-profesionales/demo/" \
            -o /tmp/umsa-colleges-demo.html
          grep -Fq '/software/gestion-de-comunidades-profesionales/demo/app.js' \
            /tmp/umsa-colleges-demo.html
          curl -4 -fsS --max-time 20 \
            "$BASE/software/gestion-de-comunidades-profesionales/demo/app.js" \
            -o /tmp/umsa-colleges-demo-app.js
          cmp /tmp/umsa-colleges-demo-app.js \
            dist/client/software/gestion-de-comunidades-profesionales/demo/app.js
          curl -4 -fsS --max-time 20 \
            "$BASE/images/software-comunidades/credencial-demo-email.gif" \
            -o /tmp/umsa-credential-demo.gif
          cmp /tmp/umsa-credential-demo.gif \
            dist/client/images/software-comunidades/credencial-demo-email.gif

      - name: Smoke test - verify content integrity
        run: |
          HOMEPAGE=$(curl -sL https://www.ultimamilla.com.ar)
          BLOG=$(curl -sL https://www.ultimamilla.com.ar/blog)
          ANTECEDENTES=$(curl -sL https://www.ultimamilla.com.ar/antecedentes)
          ERRORS=0

          # 1. Current theme must emit www canonical and brand content
          if ! echo "$HOMEPAGE" | grep -Eq 'href="https://www\.ultimamilla\.com\.ar/?"'; then
            echo "❌ Homepage canonical does not point to www domain"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Homepage canonical points to www domain"
          fi

          if echo "$HOMEPAGE" | grep -q 'href="https://ultimamilla.com.ar'; then
            echo "❌ Homepage leaks apex canonical URL"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Homepage has no apex canonical leak"
          fi

          if ! echo "$HOMEPAGE" | grep -q 'ULTIMA MILLA'; then
            echo "❌ Homepage missing brand content"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Homepage brand content present"
          fi

          # 2. Directus-backed public collections must render real entries
          BLOG_LINKS=$(echo "$BLOG" | grep -oE 'href="/blog/[^"]+"' | wc -l)
          ANTE_LINKS=$(echo "$ANTECEDENTES" | grep -oE 'href="/antecedentes/[0-9]+/[^"]+"' | wc -l)

          if [ "$BLOG_LINKS" -lt 1 ]; then
            echo "❌ Blog has no rendered article links"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Blog article links: $BLOG_LINKS"
          fi

          if [ "$ANTE_LINKS" -lt 1 ]; then
            echo "❌ Antecedentes has no rendered Directus case links"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Antecedentes case links: $ANTE_LINKS"
          fi

          # 3. Avoid obvious empty/mock states on public collection pages
          if echo "$BLOG$ANTECEDENTES" | grep -qiE 'No hay artículos publicados aún|Lorem ipsum|mock|dummy'; then
            echo "❌ Public collection pages expose empty/mock content"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Public collection pages do not expose empty/mock content"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Smoke test failed with $ERRORS errors"
            exit 1
          fi
          echo "✅ All smoke tests passed"

      - name: SEO and GEO release audit
        run: node scripts/seo-audit.mjs --base-url https://www.ultimamilla.com.ar

      - name: GEO scoring release audit
        run: npm run geo:score -- --base-url https://www.ultimamilla.com.ar --min-score 90 --json

      - name: Blog editorial GEO score audit
        run: npm run blog:score -- --base-url https://www.ultimamilla.com.ar --min-score 80 --json

      - name: UMCLI release contract audit
        run: node scripts/umcli-contract-audit.mjs --base-url https://www.ultimamilla.com.ar

      - name: Directus integration release audit
        run: node scripts/directus-release-audit.mjs --base-url https://www.ultimamilla.com.ar

      - name: Restore previous runtime after failed checks
        if: failure() && steps.ssh_agent.outcome == 'success'
        run: |
          ssh root@23.105.176.45 "bash -s -- '$RELEASE_ID' rollback" \
            < scripts/ops/deploy-scoped-dist.sh

      - name: Send deployment notification
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)

          echo "🚀 Deployment to production"
          echo "Commit: $COMMIT_SHA"
          echo "Author: $AUTHOR"
          echo "Message: $COMMIT_MSG"
          echo "Status: ${{ job.status }}"

  storage-maintenance:
    name: Audited storage maintenance
    if: github.event_name == 'workflow_dispatch' && inputs.operation != 'deploy'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v6
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}
      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 23.105.176.45 >> ~/.ssh/known_hosts
      - name: Execute only the selected maintenance mode
        env:
          OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          case "$OPERATION" in
            storage-plan) script=scripts/ops/prune-inactive-umbot-deps.sh; mode=--plan ;;
            storage-apply) script=scripts/ops/prune-inactive-umbot-deps.sh; mode=--apply ;;
            uploads-audit) script=scripts/ops/audit-directus-uploads.sh; mode=--plan ;;
            *) echo 'Unexpected maintenance operation' >&2; exit 2 ;;
          esac
          ssh root@23.105.176.45 "bash -s -- '$mode'" < "$script" | tee storage-report.txt
      - name: Save maintenance receipt
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storage-maintenance-${{ github.run_id }}
          path: storage-report.txt
          retention-days: 30
