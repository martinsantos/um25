name: Production Deploy

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:  # Allow manual triggers

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  NODE_VERSION: '18.x'
  DEPLOY_PATH: '/root/fumbling-field'

jobs:
  #===========================================================================
  # JOB 1: BUILD & TEST
  #===========================================================================
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # Full history for better caching

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint || echo "Lint check completed"
        continue-on-error: true  # No bloquear por ahora

      - name: CSS interaction contract
        run: npm run audit:css

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Run tests
        run: npm test || echo "Tests completed"
        continue-on-error: true  # No bloquear por ahora

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        continue-on-error: true  # Don't fail build if storage quota exceeded
        with:
          name: dist-build
          path: dist/
          retention-days: 1

  #===========================================================================
  # JOB 2: DEPLOY TO PRODUCTION
  #===========================================================================
  deploy-production:
    name: Deploy to Production
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.ultimamilla.com.ar

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download build artifacts
        id: download-artifact
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: dist-build
          path: dist/

      - name: Build locally if artifacts not available
        if: steps.download-artifact.outcome == 'failure' || !hashFiles('dist/**')
        run: |
          npm ci --include=dev
          npm run build

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H 23.105.176.45 >> ~/.ssh/known_hosts

      - name: Deploy to server via rsync
        run: |
          rsync -avz --delete \
            --exclude='node_modules' \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='directus-admin/.env' \
            --exclude='backups' \
            --exclude='.local_production_files' \
            --exclude='public/cache' \
            --exclude='uploads' \
            --exclude='ecosystem.config.cjs' \
            --exclude='*.log' \
            ./ root@23.105.176.45:${{ env.DEPLOY_PATH }}/

      - name: Install dependencies on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            npm ci --production
            # Ensure Directus uploads dir is writable by container (uid 1000)
            chown -R 1000:1000 ${{ env.DEPLOY_PATH }}/uploads/ 2>/dev/null || true
            chmod 775 ${{ env.DEPLOY_PATH }}/uploads/ 2>/dev/null || true

      - name: Restart PM2 process
        uses: appleboy/ssh-action@v1.2.0
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM: ${{ secrets.SMTP_FROM }}
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            export SMTP_HOST='${{ secrets.SMTP_HOST }}'
            export SMTP_PORT='${{ secrets.SMTP_PORT }}'
            export SMTP_USER='${{ secrets.SMTP_USER }}'
            export SMTP_PASS='${{ secrets.SMTP_PASS }}'
            export SMTP_FROM='${{ secrets.SMTP_FROM }}'
            pm2 startOrRestart ecosystem.config.cjs --only astro-ultimamilla --update-env
            pm2 restart astro-ultimamilla --update-env
            pm2 save

      - name: Apply WWW canonical routing
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            bash ${{ env.DEPLOY_PATH }}/scripts/ops/apply-www-canonical-nginx.sh

      - name: Health check
        run: |
          echo "Waiting 15s for app to start..."
          sleep 15

          APEX_CHECK=$(curl -4 -sS -o /dev/null --max-time 20 \
            -w "%{http_code} %{redirect_url}" \
            https://ultimamilla.com.ar/ || true)
          WWW_CHECK=$(curl -4 -sS -o /dev/null --max-time 20 \
            -w "%{http_code} %{redirect_url}" \
            https://www.ultimamilla.com.ar/ || true)

          echo "apex check: $APEX_CHECK"
          echo "www check: $WWW_CHECK"

          if echo "$WWW_CHECK" | grep -Eq '^200[[:space:]]*$' && \
             echo "$APEX_CHECK" | grep -Eq '^30(1|8)[[:space:]]+https://www\.ultimamilla\.com\.ar/'; then
            echo "✅ Canonical health check passed: www serves 200 and apex redirects to www"
          else
            echo "❌ Canonical health check failed"
            exit 1
          fi

      - name: Smoke test - verify content integrity
        run: |
          HOMEPAGE=$(curl -sL https://www.ultimamilla.com.ar)
          BLOG=$(curl -sL https://www.ultimamilla.com.ar/blog)
          ANTECEDENTES=$(curl -sL https://www.ultimamilla.com.ar/antecedentes)
          ERRORS=0

          # 1. Current theme must emit www canonical and brand content
          if ! echo "$HOMEPAGE" | grep -Eq 'href="https://www\.ultimamilla\.com\.ar/?"'; then
            echo "❌ Homepage canonical does not point to www domain"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Homepage canonical points to www domain"
          fi

          if echo "$HOMEPAGE" | grep -q 'href="https://ultimamilla.com.ar'; then
            echo "❌ Homepage leaks apex canonical URL"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Homepage has no apex canonical leak"
          fi

          if ! echo "$HOMEPAGE" | grep -q 'ULTIMA MILLA'; then
            echo "❌ Homepage missing brand content"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Homepage brand content present"
          fi

          # 2. Directus-backed public collections must render real entries
          BLOG_LINKS=$(echo "$BLOG" | grep -oE 'href="/blog/[^"]+"' | wc -l)
          ANTE_LINKS=$(echo "$ANTECEDENTES" | grep -oE 'href="/antecedentes/[0-9]+/[^"]+"' | wc -l)

          if [ "$BLOG_LINKS" -lt 1 ]; then
            echo "❌ Blog has no rendered article links"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Blog article links: $BLOG_LINKS"
          fi

          if [ "$ANTE_LINKS" -lt 1 ]; then
            echo "❌ Antecedentes has no rendered Directus case links"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Antecedentes case links: $ANTE_LINKS"
          fi

          # 3. Avoid obvious empty/mock states on public collection pages
          if echo "$BLOG$ANTECEDENTES" | grep -qiE 'No hay artículos publicados aún|Lorem ipsum|mock|dummy'; then
            echo "❌ Public collection pages expose empty/mock content"
            ERRORS=$((ERRORS + 1))
          else
            echo "✅ Public collection pages do not expose empty/mock content"
          fi

          if [ "$ERRORS" -gt 0 ]; then
            echo "❌ Smoke test failed with $ERRORS errors"
            exit 1
          fi
          echo "✅ All smoke tests passed"

      - name: Send deployment notification
        if: always()
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%B)
          COMMIT_SHA=$(git rev-parse --short HEAD)
          AUTHOR=$(git log -1 --pretty=%an)

          echo "🚀 Deployment to production"
          echo "Commit: $COMMIT_SHA"
          echo "Author: $AUTHOR"
          echo "Message: $COMMIT_MSG"
          echo "Status: ${{ job.status }}"

  #===========================================================================
  # JOB 3: ROLLBACK (manual, solo en caso de fallo)
  #===========================================================================
  rollback:
    name: Rollback to Previous Version
    if: failure() && github.event_name == 'workflow_dispatch'
    needs: deploy-production
    runs-on: ubuntu-latest

    steps:
      - name: Rollback deployment
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: 23.105.176.45
          username: root
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ${{ env.DEPLOY_PATH }}
            git fetch --tags
            git checkout v1.0.0-mvp
            npm ci --production
            pm2 restart astro-ultimamilla

      - name: Verify rollback
        run: |
          sleep 10
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://www.ultimamilla.com.ar)
          echo "Rollback health check: HTTP $HTTP_STATUS"
