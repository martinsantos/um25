name: Authorize dedicated Hostinger backup identity

on:
  workflow_dispatch:
    inputs:
      public_backup_key:
        description: 'Public Ed25519 key generated by prepare-backup-identity on the new VPS'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: hostinger-backup-receiver-identity
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  authorize:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - name: Validate the receiver key operation
        run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_backup_identity.py' -v
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_BACKUP_RECEIVER_KEY }}
      - name: Add only the restricted public key while preserving existing keys
        env:
          PUBLIC_BACKUP_KEY: ${{ inputs.public_backup_key }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import importlib.util, os
          spec=importlib.util.spec_from_file_location('receiver','scripts/ops/hostinger-migration/authorize-backup-receiver.py')
          module=importlib.util.module_from_spec(spec);spec.loader.exec_module(module)
          module.authorized_line(os.environ['PUBLIC_BACKUP_KEY'])
          PY
          options=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15)
          destination="/root/umsa-backup-key-rollover/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.py"
          ssh "${options[@]}" root@76.13.234.213 'test "$(hostname)" = srv1342577.hstgr.cloud && test ! -L /root/umsa-backup-key-rollover && install -d -m 0700 /root/umsa-backup-key-rollover'
          scp "${options[@]}" scripts/ops/hostinger-migration/authorize-backup-receiver.py "root@76.13.234.213:$destination"
          printf '%s\n' "$PUBLIC_BACKUP_KEY" | ssh "${options[@]}" root@76.13.234.213 "python3 $destination"
