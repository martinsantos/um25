name: Hostinger migration staging

on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-migration.yml'
      - 'scripts/ops/hostinger-migration/**'
  workflow_dispatch:
    inputs:
      phase:
        description: 'Prepare isolated destination; never changes source services or DNS'
        type: choice
        options: [preflight, bootstrap, copy-data, copy-runtime, install-runtime, snapshot-data, restore-databases, recover-empty-storage, materialize-files, rehearsal, prepare-mail, build-clean-web, finish-file-validation, finish-mariadb, build-clean-sitrep, build-clean-arca, build-clean-sgi, rotate-internal, build-clean-cms, clean-node-rehearsal, clean-container-rehearsal, clean-php-rehearsal, clean-tools-plan, rehearsal-bridges, clean-proxy-rehearsal]
        default: preflight
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  # Bulk files write only source/{root,etc,home,opt,var}; preparation writes other
  # staging areas or the fresh OS. All preparation phases remain serialized.
  group: hostinger-migration-${{ github.event_name == 'workflow_dispatch' && (inputs.phase == 'copy-data' && 'bulk-copy' || 'preparation') || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: bash -n scripts/ops/hostinger-migration/stage.sh
      - run: bash -n scripts/ops/hostinger-migration/install-runtime.sh
      - run: bash -n scripts/ops/hostinger-migration/snapshot-data.sh
      - run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_*.py' -v
  stage:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        if: inputs.phase == 'build-clean-web' || inputs.phase == 'build-clean-sitrep' || inputs.phase == 'build-clean-sgi'
        with:
          node-version: '20.19.6'
      - name: Build clean UMSA artifact from reviewed Git and locked dependencies
        if: inputs.phase == 'build-clean-web'
        env:
          NODE_ENV: production
        run: |
          npm ci --include=dev
          npm run build
          npm prune --omit=dev --ignore-scripts
          test -s dist/server/entry.mjs
          tar -czf "$RUNNER_TEMP/umsa-clean-web.tar.gz" dist node_modules package.json package-lock.json
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: |
            ${{ secrets.SSH_PRIVATE_KEY }}
            ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Stage selected phase on the new VPS
        env:
          PHASE: ${{ inputs.phase }}
          GH_TOKEN: ${{ github.token }}
          CLEAN_WEB_PACKAGE: ${{ runner.temp }}/umsa-clean-web.tar.gz
        run: bash scripts/ops/hostinger-migration/stage.sh "$PHASE"
