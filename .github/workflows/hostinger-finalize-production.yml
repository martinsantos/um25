name: Finalize Hostinger certificates and web publisher

on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-finalize-production.yml'
      - 'scripts/ops/hostinger-migration/finalize-production.py'
      - 'scripts/ops/hostinger-migration/test_finalization.py'
      - 'scripts/ops/hostinger-migration/repair-mail-certificates.py'
      - 'scripts/ops/hostinger-migration/test_mail_certificates.py'
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Enter FINALIZE after all service cutovers and public DNS changes pass'
        required: true
        type: string
      operation:
        description: 'Initial certificate finalization or align the existing mail certificate consumers'
        type: choice
        options: [certificates, mail-renewal]
        default: certificates

permissions:
  contents: read

concurrency:
  group: hostinger-migration-${{ github.event_name == 'workflow_dispatch' && 'preparation' || github.run_id }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_finalization.py' -v
      - run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_mail_certificates.py' -v
  finalize:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.acknowledgement == 'FINALIZE'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Issue fresh certificates only after public challenge verification
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15 -o ServerAliveInterval=30)
          target=root@179.198.115.115
          folder="/srv/umsa-migration/production-finalization-tooling/$id"
          ssh "${opts[@]}" "$target" "test ! -e $folder && install -d -m 0700 $folder"
          script=finalize-production.py
          if [[ '${{ inputs.operation }}' == mail-renewal ]]; then script=repair-mail-certificates.py; fi
          for file in "$script" public-vhost.py; do
            scp "${opts[@]}" "scripts/ops/hostinger-migration/$file" "$target:$folder/"
            local_hash=$(sha256sum "scripts/ops/hostinger-migration/$file" | cut -d ' ' -f1)
            remote_hash=$(ssh "${opts[@]}" "$target" "sha256sum $folder/$file" | cut -d ' ' -f1)
            [[ "$local_hash" = "$remote_hash" ]]
          done
          ssh "${opts[@]}" "$target" "python3 $folder/$script $id"
