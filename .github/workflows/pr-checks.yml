name: PR Checks

on:
  pull_request:
    branches: [master, develop]

env:
  NODE_VERSION: '18.x'

jobs:
  #===========================================================================
  # JOB 1: LINT & FORMAT CHECK
  #===========================================================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint || echo "Lint completed with warnings"
        continue-on-error: true

      - name: Check TypeScript
        run: npx tsc --noEmit || echo "TypeScript check completed"
        continue-on-error: true

  #===========================================================================
  # JOB 2: BUILD VERIFICATION
  #===========================================================================
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build
        env:
          NODE_ENV: production

      - name: Check build size
        run: |
          BUILD_SIZE=$(du -sh dist | cut -f1)
          echo "📦 Build size: $BUILD_SIZE"

  #===========================================================================
  # JOB 3: TESTS (if available)
  #===========================================================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test || echo "Tests completed"
        continue-on-error: true

  #===========================================================================
  # JOB 4: SUMMARY COMMENT
  #===========================================================================
  pr-comment:
    name: PR Summary Comment
    runs-on: ubuntu-latest
    needs: [lint, build, test]
    if: always()

    steps:
      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const lintResult = '${{ needs.lint.result }}';
            const buildResult = '${{ needs.build.result }}';
            const testResult = '${{ needs.test.result }}';

            const statusEmoji = {
              'success': '✅',
              'failure': '❌',
              'cancelled': '⚠️',
              'skipped': '⏭️'
            };

            const body = `
            ## 🤖 PR Checks Summary

            | Check | Status |
            |-------|--------|
            | Lint & Format | ${statusEmoji[lintResult]} ${lintResult} |
            | Build | ${statusEmoji[buildResult]} ${buildResult} |
            | Tests | ${statusEmoji[testResult]} ${testResult} |

            ${buildResult === 'success' ? '✅ **Ready to merge!**' : '⚠️ **Please fix the issues above before merging.**'}

            ---
            <sub>Automated checks by GitHub Actions</sub>
            `;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
