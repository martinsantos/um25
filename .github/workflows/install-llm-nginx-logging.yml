name: Install LLM Nginx Logging

on:
  workflow_dispatch:

env:
  DEPLOY_PATH: '/root/fumbling-field'

jobs:
  install:
    name: Install guarded Nginx logging
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.ultimamilla.com.ar

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -T 60 -H 23.105.176.45 >> ~/.ssh/known_hosts
          sort -u ~/.ssh/known_hosts -o ~/.ssh/known_hosts

      - name: Sync ops files
        run: |
          rsync -avz \
            ops/ \
            root@23.105.176.45:${{ env.DEPLOY_PATH }}/ops/
          rsync -avz \
            scripts/ops/ \
            root@23.105.176.45:${{ env.DEPLOY_PATH }}/scripts/ops/

      - name: Install LLM Nginx logging
        run: |
          ssh root@23.105.176.45 "bash ${{ env.DEPLOY_PATH }}/scripts/ops/install-llm-nginx-logging.sh ${{ env.DEPLOY_PATH }}"
