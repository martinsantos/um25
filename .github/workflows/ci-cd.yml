name: 🚀 CI/CD Pipeline - ULTiMA MILLA

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  NODE_VERSION: '18'
  DOCKER_IMAGE: umbot/fumbling-field
  PRODUCTION_HOST: 23.105.176.45
  PRODUCTION_PATH: /root/fumbling-field

jobs:
  # ==========================================
  # JOB 1: LINT Y VALIDACIÓN DE CÓDIGO
  # ==========================================
  lint-and-validate:
    name: 🔍 Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🔍 Lint código
        run: npm run lint

      - name: ✅ Validar TypeScript
        run: npx tsc --noEmit

      - name: 📋 Check formato Prettier
        run: npx prettier --check "src/**/*.{js,ts,jsx,tsx,astro}"

  # ==========================================
  # JOB 2: TESTS UNITARIOS E INTEGRACIÓN
  # ==========================================
  test:
    name: 🧪 Tests & Coverage
    runs-on: ubuntu-latest
    needs: lint-and-validate
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run unit tests
        run: npm run test:ci

      - name: 📊 Generate coverage report
        run: npm run test:coverage

      - name: 📤 Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          file: ./coverage/lcov.info
          fail_ci_if_error: false

  # ==========================================
  # JOB 3: BUILD APLICACIÓN
  # ==========================================
  build:
    name: 🏗️ Build Application
    runs-on: ubuntu-latest
    needs: [lint-and-validate, test]
    outputs:
      version: ${{ steps.version.outputs.version }}
      short-sha: ${{ steps.version.outputs.short-sha }}
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🏗️ Build aplicación
        run: npm run build
        env:
          NODE_ENV: production
          ASTRO_TELEMETRY_DISABLED: 1

      - name: 📋 Generate version info
        id: version
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=${GITHUB_REF#refs/tags/}
          else
            VERSION=$(date +%Y%m%d-%H%M%S)-${GITHUB_SHA::8}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "short-sha=${GITHUB_SHA::8}" >> $GITHUB_OUTPUT

      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-files
          path: |
            dist/
            package.json
            package-lock.json
          retention-days: 7

  # ==========================================
  # JOB 4: BUILD Y PUSH IMAGEN DOCKER
  # ==========================================
  docker-build-push:
    name: 🐳 Docker Build & Push
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-files

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 🏷️ Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.build.outputs.version }}

      - name: 🏗️ Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.astro.prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

  # ==========================================
  # JOB 5: DEPLOY A PRODUCCIÓN
  # ==========================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker-build-push]
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: 📥 Checkout código
        uses: actions/checkout@v4

      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📝 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ env.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: 🚀 Deploy to production server
        run: |
          ssh root@${{ env.PRODUCTION_HOST }} << 'ENDSSH'
            set -e
            cd ${{ env.PRODUCTION_PATH }}
            
            echo "🔄 Pulling latest changes..."
            git pull origin main
            
            echo "🐳 Updating Docker images..."
            docker-compose -f docker-compose.prod.yml pull
            
            echo "🔄 Recreating services..."
            docker-compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            
            echo "🧹 Cleaning up old images..."
            docker image prune -af
            
            echo "✅ Deployment completed successfully!"
          ENDSSH

      - name: 🏥 Health check
        run: |
          sleep 30
          curl -f https://www.ultimamilla.com.ar/health || curl -f https://www.ultimamilla.com.ar/
          echo "✅ Production deployment is healthy!"

  # ==========================================
  # JOB 6: ROLLBACK EN CASO DE FALLO
  # ==========================================
  rollback-on-failure:
    name: 🔄 Rollback on Failure
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure() && github.ref == 'refs/heads/main'
    steps:
      - name: 🔐 Setup SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: 📝 Add server to known hosts
        run: |
          ssh-keyscan -H ${{ env.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: 🔄 Rollback deployment
        run: |
          ssh root@${{ env.PRODUCTION_HOST }} << 'ENDSSH'
            cd ${{ env.PRODUCTION_PATH }}
            echo "🚨 Rolling back to previous version..."
            docker-compose -f docker-compose.prod.yml down
            docker-compose -f docker-compose.prod.yml up -d
            echo "✅ Rollback completed!"
          ENDSSH

      - name: 📢 Notify rollback
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: failure
          text: 🚨 Deployment failed and rollback was executed for ${{ github.ref }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  # ==========================================
  # JOB 7: NOTIFICACIONES
  # ==========================================
  notify-success:
    name: 📢 Success Notification
    runs-on: ubuntu-latest
    needs: [deploy-production]
    if: success() && github.ref == 'refs/heads/main'
    steps:
      - name: 📢 Notify successful deployment
        uses: 8398a7/action-slack@v3
        with:
          status: success
          text: |
            ✅ Deployment successful!
            🌐 Site: https://www.ultimamilla.com.ar
            📝 Commit: ${{ github.event.head_commit.message }}
            👤 Author: ${{ github.actor }}
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }} 