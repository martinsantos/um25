name: Finish authoritative SGI operation on Hostinger
on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-sgi-operation.yml'
      - 'scripts/ops/hostinger-migration/finish-sgi-operation.py'
      - 'scripts/ops/hostinger-migration/test_sgi_operation.py'
  workflow_dispatch:
    inputs:
      acknowledgement:
        description: 'Enter SGI-PRODUCTION to restore the original production flags on the migrated SGI'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: hostinger-migration-${{ github.event_name == 'workflow_dispatch' && 'preparation' || github.run_id }}
  cancel-in-progress: false
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - run: python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_sgi_operation.py' -v
  finish:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.acknowledgement == 'SGI-PRODUCTION'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Restore production flags using the current database and a second port
        run: |
          set -euo pipefail
          [[ "$GITHUB_RUN_ID" =~ ^[0-9]+$ && "$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+$ ]]
          id="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          opts=(-o BatchMode=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15 -o ServerAliveInterval=30)
          target=root@179.198.115.115
          folder="/srv/umsa-migration/sgi-operational-tooling/$id"
          ssh "${opts[@]}" "$target" "test ! -e $folder && install -d -m 0700 $folder"
          for file in finish-sgi-operation.py public-vhost.py; do
            scp "${opts[@]}" "scripts/ops/hostinger-migration/$file" "$target:$folder/"
            local_hash=$(sha256sum "scripts/ops/hostinger-migration/$file" | cut -d ' ' -f1)
            remote_hash=$(ssh "${opts[@]}" "$target" "sha256sum $folder/$file" | cut -d ' ' -f1)
            [[ "$local_hash" = "$remote_hash" ]]
          done
          ssh "${opts[@]}" "$target" "python3 $folder/finish-sgi-operation.py $id"
