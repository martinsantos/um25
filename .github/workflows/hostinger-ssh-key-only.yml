name: Hostinger SSH keys only with timed recovery
on:
  pull_request:
    paths:
      - '.github/workflows/hostinger-ssh-key-only.yml'
      - 'scripts/ops/hostinger-migration/ssh-key-only.py'
      - 'scripts/ops/hostinger-migration/test_ssh_key_only.py'
  workflow_dispatch:
    inputs:
      phase:
        type: choice
        options: [inspect, apply, confirm, rollback]
        default: inspect
        required: true
      expected_snapshot_sha:
        type: string
        default: ''
      operation_id:
        type: string
        default: ''
        description: Exact apply run ID-attempt for confirm or rollback
      admin_receipt_sha:
        type: string
        default: ''
        description: SHA256 of independent fresh administrative key-login verification
permissions:
  contents: read
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && 'hostinger-umsa-production' || github.run_id }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq openssh-server
          sudo install -d -m 0755 /run/sshd
          sudo env PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/ops/hostinger-migration -p 'test_ssh_key_only.py' -v
  controlled_ssh:
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && vars.UMSA_PRODUCTION_TARGET == 'hostinger'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: /scripts/ops/hostinger-migration/
      - uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.HOSTINGER_MIGRATION_KEY }}
      - name: Preserve both administrative keys and all current sessions
        env:
          PHASE: ${{ inputs.phase }}
          EXPECTED_SNAPSHOT: ${{ inputs.expected_snapshot_sha }}
          OPERATION: ${{ inputs.operation_id }}
          ADMIN_RECEIPT: ${{ inputs.admin_receipt_sha }}
        run: |
          set -euo pipefail
          case "$PHASE" in inspect|apply|confirm|rollback) ;; *) exit 1;; esac
          [[ "$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" =~ ^[0-9]+-[0-9]+$ ]]
          operation="$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          expected=""
          if [[ "$PHASE" == apply ]]; then
            [[ "$EXPECTED_SNAPSHOT" =~ ^[a-f0-9]{64}$ ]]
            expected="$EXPECTED_SNAPSHOT"
          elif [[ "$PHASE" == confirm || "$PHASE" == rollback ]]; then
            [[ "$OPERATION" =~ ^[0-9]+-[0-9]+$ ]]
            operation="$OPERATION"
            if [[ "$PHASE" == confirm ]]; then
              [[ "$ADMIN_RECEIPT" =~ ^[a-f0-9]{64}$ ]]
              expected="$ADMIN_RECEIPT"
            fi
          fi
          opts=(-o BatchMode=yes -o PreferredAuthentications=publickey -o PasswordAuthentication=no -o KbdInteractiveAuthentication=no -o ControlMaster=no -o ControlPath=none -o StrictHostKeyChecking=yes -o UserKnownHostsFile=scripts/ops/hostinger-migration/known_hosts -o ConnectTimeout=15 -o ServerAliveInterval=30)
          target=root@179.198.115.115
          folder="/srv/umsa-migration/ssh-key-tooling/$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh "${opts[@]}" "$target" "test ! -e $folder && install -d -m 0700 $folder"
          scp "${opts[@]}" scripts/ops/hostinger-migration/ssh-key-only.py "$target:$folder/tool.py"
          local_hash=$(sha256sum scripts/ops/hostinger-migration/ssh-key-only.py | cut -d ' ' -f1)
          remote_hash=$(ssh "${opts[@]}" "$target" "sha256sum $folder/tool.py" | cut -d ' ' -f1)
          [[ "$local_hash" = "$remote_hash" ]]
          ssh "${opts[@]}" "$target" "env GITHUB_ACTIONS=true python3 $folder/tool.py $PHASE $operation '$expected'" | tee /tmp/ssh-operation.json
          python3 -c 'import json; assert json.load(open("/tmp/ssh-operation.json"))["ok"] is True'
          if [[ "$PHASE" == apply || "$PHASE" == confirm ]]; then
            # A separate TCP/authentication exchange: never reuse the apply session.
            ssh "${opts[@]}" "$target" "env GITHUB_ACTIONS=true python3 $folder/tool.py inspect $operation ''" > /tmp/ssh-fresh-login.json
            python3 - <<'PY'
          import json
          r=json.load(open('/tmp/ssh-fresh-login.json'))
          assert r['ok'] and r['already_hardened']
          assert r['effective']['authenticationmethods']=='publickey'
          assert r['effective']['passwordauthentication']=='no'
          print('Fresh CI public-key login verified; existing authorized keys preserved.')
          PY
