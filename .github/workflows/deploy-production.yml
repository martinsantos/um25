name: Deploy ultimamilla.com.ar to Production

on:
  push:
    branches: [main]

env:
  DRY_RUN: false  # Set to true for testing

jobs:
  deploy-astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Package Astro Source
        run: |
          tar czf /tmp/ultimamilla-source.tar.gz \
            --exclude=node_modules \
            --exclude=dist \
            --exclude=.astro \
            --exclude=.git \
            .

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY_BASE64 }}" | base64 -d > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload Source to VPS
        run: |
          scp -i ~/.ssh/deploy_key /tmp/ultimamilla-source.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/

      - name: Build and Deploy Astro Site on VPS
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'ENDSSH'
            export DRY_RUN=${{ env.DRY_RUN }}
            bash /opt/scripts-cicd/deploy_ultimamilla_with_build.sh
          ENDSSH
