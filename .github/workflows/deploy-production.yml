name: Deploy ultimamilla.com.ar to Production

on:
  push:
    branches: [main]

env:
  DRY_RUN: true  # Cambiar a 'false' cuando se apruebe migración

jobs:
  deploy-astro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Build Astro Site
        run: |
          npm ci
          npm run build

      - name: Package Site
        run: |
          cd dist
          tar czf /tmp/ultimamilla-deploy.tar.gz .

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Upload to VPS
        run: |
          scp -i ~/.ssh/deploy_key /tmp/ultimamilla-deploy.tar.gz root@${{ secrets.VPS_HOST }}:/tmp/

      - name: Deploy Astro Site (Dry-Run)
        run: |
          ssh -i ~/.ssh/deploy_key root@${{ secrets.VPS_HOST }} << 'ENDSSH'
            export DRY_RUN=${{ env.DRY_RUN }}
            bash /opt/scripts-cicd/deploy_ultimamilla.sh
          ENDSSH
