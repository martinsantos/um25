# Configuración Nginx Simplificada para Emergency App
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;
    
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    upstream astro_backend {
        server umbot-astro-static:4321;
}

    # Servidor HTTP principal
server {
    listen 80;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar 23.105.176.45;
        
        # UMBot Emergency App - Servir archivos estáticos
        location /emergency {
            alias /usr/share/nginx/html/emergency;
            index index.html;
            try_files $uri $uri/ /emergency/index.html;
            
            # Headers para Emergency App
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }
        
        # Admin redirect
        location /admin {
            return 301 http://www.ultimamilla.com.ar:8055/admin;
        }
        
        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Todas las demás rutas al backend Astro
        location / {
            try_files $uri $uri/ @astro;
        }
        
        location @astro {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }

    # Servidor HTTPS (si los certificados están disponibles)
    server {
        listen 443 ssl http2;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;
        
        # Configuración SSL básica
        ssl_certificate /etc/letsencrypt/live/www.ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.ultimamilla.com.ar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # UMBot Emergency App - Servir archivos estáticos
        location /emergency {
            alias /usr/share/nginx/html/emergency;
            index index.html;
            try_files $uri $uri/ /emergency/index.html;
            
            # Headers para Emergency App
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            add_header Access-Control-Allow-Origin "*";
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }
        
        # Admin redirect
        location /admin {
            return 301 http://www.ultimamilla.com.ar:8055/admin;
        }
        
        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
        
        # Todas las demás rutas al backend Astro
        location / {
            proxy_pass http://astro_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
    }
}
