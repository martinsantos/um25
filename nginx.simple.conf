upstream directus_simple {
    server directus-simple:8055;
}

# Redirección HTTP a HTTPS
server {
    listen 80;
    server_name www.umbot.com.ar;
    return 301 https://$server_name$request_uri;
}

# Servidor principal HTTPS
server {
    listen 443 ssl http2;
    server_name www.umbot.com.ar;

    # Certificados SSL
    ssl_certificate /etc/letsencrypt/live/www.umbot.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.umbot.com.ar/privkey.pem;

    # Headers de seguridad
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # Panel de administración Directus
    location /admin {
        proxy_pass http://directus_simple;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API Directus
    location /api/ {
        proxy_pass http://directus_simple;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Assets de Directus
    location /assets/ {
        proxy_pass http://directus_simple;
        proxy_set_header Host $host;
    }

    # Sitio web estático
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ $uri.html /index.html;
        
        # Cache para assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
