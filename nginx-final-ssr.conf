# SSR Dynamic Services Configuration for Nginx
# Esta configuración redirige /servicios/{id}/{slug} al proxy SSR dinámico

# Agregar esta configuración dentro del server block existente de ultimamilla.com.ar

    # ===== DYNAMIC SERVICIOS SSR - NUEVA CONFIGURACIÓN =====
    # Redirigir rutas de servicios específicos al proxy SSR dinámico
    location ~ ^/servicios/(\d+)/([^/]+)/?$ {
        # Headers para identificar contenido dinámico
        add_header X-SSR-Dynamic "true" always;
        add_header X-Content-Source "Astro-SSR" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
        
        # Proxy al servidor Astro
        proxy_pass http://astro-app:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeouts específicos para SSR
        proxy_connect_timeout 10s;
        proxy_send_timeout 10s;
        proxy_read_timeout 10s;
        
        # Fallback si el proxy SSR no responde
        error_page 502 503 504 = @astro_fallback;
    }
    
    # Fallback para cuando el proxy SSR no esté disponible
    location @astro_fallback {
        add_header X-Fallback "Astro-Static" always;
        proxy_pass http://umbot-astro-static:4321;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # ===== RESTO DE CONFIGURACIÓN EXISTENTE =====
    # Las demás rutas siguen funcionando normalmente con Astro
    location / {
        try_files $uri $uri/ @astro;
    }
    
    location @astro {
        proxy_pass http://umbot-astro-static:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    } 