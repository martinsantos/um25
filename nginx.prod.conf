# Configuración Nginx para Producción - UM25-0.3
# Servidor: 23.105.176.45 - Dominio: www.ultimamilla.com.ar

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;
    
    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    upstream astro_backend {
        server astro-app:80;
    }
    
    # Servidor HTTP - Redirección a HTTPS con excepciones
    server {
        listen 80;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;
        
        # Configuración para UMBot Emergency App (sin redirección HTTPS)
        location /emergency/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /emergency/index.html;
            
            # Headers para PWA
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            
            # CORS para API calls
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }
        
        # Redirección automática a HTTPS para todas las demás rutas
        location / {
        return 301 https://$server_name$request_uri;
        }
    }
    
    # Servidor HTTPS - Configuración principal
    server {
        listen 443 ssl http2;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;
        
        # Configuración SSL
        ssl_certificate /etc/nginx/ssl/fullchain.pem;
        ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Configuración para Grafana
        location /grafana/ {
            proxy_pass http://umbot-grafana:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;
        }
        
        location /admin/uploads/ {
            alias /var/www/html/admin/uploads/;
            try_files $uri $uri/ =404;
            add_header Access-Control-Allow-Origin *;
        }
        
        location /admin {
            return 301 http://www.ultimamilla.com.ar:8055/admin;
        }
        
        # Configuración para UMBot Emergency App
        location /emergency/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /emergency/index.html;
            
            # Headers para PWA
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            
            # CORS para API calls
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }
        
        # Configuración para Prometheus
        location /prometheus/ {
            proxy_pass http://umbot-prometheus:9090/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuración para API de Directus
        location /api/ {
            proxy_pass http://directus:8055/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuración para todas las rutas
        location / {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configuración específica para SSR
            proxy_buffering off;
            proxy_cache off;
            
            # Timeouts más largos para SSR
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # Servir imágenes estáticas directamente
        location /images/ {
            alias /var/www/html/images/;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Fallback para imágenes
        location @fallback_images {
            root /usr/share/nginx/html;
            try_files $uri /images/default.jpg;
        }
        
        # Manejo específico para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
    
    # Servidor para IP directa - Solo HTTP
    server {
        listen 80;
        server_name 23.105.176.45;
        
        # Configuración para UMBot Emergency App en IP directa
        location /emergency/ {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /emergency/index.html;
            
            # Headers para PWA
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma "no-cache";
            add_header Expires "0";
            
            # CORS para API calls
            add_header Access-Control-Allow-Origin *;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
            add_header Access-Control-Allow-Headers "Content-Type, Authorization";
        }
        
        # Configuración para IP directa (sin SSL)
        location / {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_buffering off;
            proxy_cache off;
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        location /images/ {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
            
            proxy_intercept_errors on;
            error_page 404 = @fallback_images;
        }
        
        location @fallback_images {
            root /usr/share/nginx/html;
            try_files $uri /images/default.jpg;
        }
        
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
} 