# Configuración CORREGIDA para ultimamilla.com.ar - Compatible con Cloudflare
# Soluciona el problema de redirect loop

# Configuración principal - Cloudflare envía HTTP al servidor
server {
    listen 80;
    listen 443 ssl http2;
    server_name ultimamilla.com.ar www.ultimamilla.com.ar;
    
    # SSL Configuration (para conexiones directas sin Cloudflare)
    ssl_certificate /etc/letsencrypt/live/ultimamilla.com.ar/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ultimamilla.com.ar/privkey.pem;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-Powered-By "ULTIMA MILLA - Nginx Dynamic (Cloudflare Fixed)" always;
    
    # ==========================================
    # DETECCIÓN DE CLOUDFLARE
    # ==========================================
    
    # Detectar si la petición viene de Cloudflare o directa
    set $is_cloudflare 0;
    if ($http_cf_ray) {
        set $is_cloudflare 1;
    }
    
    # Solo redirigir a HTTPS si NO viene de Cloudflare y es HTTP
    set $redirect_https 0;
    if ($scheme = http) {
        set $redirect_https 1;
    }
    if ($is_cloudflare = 1) {
        set $redirect_https 0;
    }
    if ($redirect_https = 1) {
        return 301 https://ultimamilla.com.ar$request_uri;
    }
    
    # ==========================================
    # RUTAS DINÁMICAS ESPECÍFICAS (ALTA PRIORIDAD)
    # ==========================================
    
    # Servicios dinámicos via Proxy SSR (puerto 8093)
    location ~ ^/servicios/[0-9]+/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "dynamic-service";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Antecedentes dinámicos via Proxy SSR (puerto 8093)
    location ~ ^/antecedentes/[0-9]+/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "dynamic-antecedente";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # Blog dinámico via Proxy SSR (puerto 8093)
    location ~ ^/blog/[^/]+/?$ {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "dynamic-blog";
        
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }
    
    # ==========================================
    # API ENDPOINTS Y SERVICIOS
    # ==========================================
    
    # Directus API (puerto 8055)
    location /api/ {
        proxy_pass http://127.0.0.1:8055/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "directus-api";
    }
    
    # Admin de Directus (puerto 8055)
    location /admin {
        proxy_pass http://127.0.0.1:8055/admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "directus-admin";
    }
    
    # Dashboard de emergencia (puerto 8091)
    location /log/ {
        proxy_pass http://127.0.0.1:8091/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "emergency-dashboard";
    }
    
    # ==========================================
    # APLICACIÓN PRINCIPAL ASTRO (FALLBACK)
    # ==========================================
    
    # Páginas estáticas y rutas generales (puerto 3000 -> Astro Container)
    location / {
        # Intentar Astro primero, fallback a proxy SSR si falla
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "astro-main";
        proxy_cache_bypass $http_upgrade;
        
        proxy_connect_timeout 5s;
        proxy_send_timeout 5s;
        proxy_read_timeout 5s;
        
        # Fallback a proxy SSR si Astro falla
        error_page 502 504 = @fallback_ssr;
    }
    
    # Fallback location para cuando Astro falla
    location @fallback_ssr {
        proxy_pass http://127.0.0.1:8093;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Route-Type "fallback-ssr";
        add_header X-Served-By "Fallback-SSR" always;
    }
    
    # ==========================================
    # ASSETS Y ARCHIVOS ESTÁTICOS
    # ==========================================
    
    # Assets optimizados con caché largo
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif)$ {
        proxy_pass http://localhost:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
        proxy_set_header Host $host;
        proxy_set_header X-Route-Type "static-asset";
        
        # Fallback para assets si Astro falla
        error_page 502 504 = @assets_fallback;
    }
    
    location @assets_fallback {
        return 404;
    }
    
    # ==========================================
    # HEALTH CHECKS Y MONITOREO
    # ==========================================
    
    # Health check del sistema
    location /health {
        access_log off;
        return 200 "OK - ULTIMA MILLA Dynamic System (Cloudflare Fixed)";
        add_header Content-Type text/plain;
        add_header X-System-Status "Operational";
        add_header X-Cloudflare-Status $is_cloudflare;
    }
    
    # Status de servicios
    location /status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 23.105.176.45;
        # IPs de Cloudflare (algunos rangos principales)
        allow 103.21.244.0/22;
        allow 103.22.200.0/22;
        allow 103.31.4.0/22;
        allow 104.16.0.0/13;
        allow 108.162.192.0/18;
        deny all;
    }
}
