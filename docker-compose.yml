# docker-compose.yml
# Versión corregida y optimizada para producción y desarrollo.

version: '3.8'

services:
  # 1. Servicio de la Base de Datos (PostgreSQL)
  database:
    image: postgres:15-alpine
    container_name: database
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: mydatabase
    volumes:
      - directus_db_data:/var/lib/postgresql/data
    networks:
      - directusnet
    # No es necesario exponer puertos de la DB al exterior.
    # Los servicios se comunican por la red interna 'directusnet'.

  # 2. Servicio de Directus
  # Carga TODA su configuración desde el archivo .env
  directus-app:
    image: directus/directus:11.7.2 # Se recomienda usar una versión específica
    container_name: directus-app
    ports:
      - "8055:8055"
    environment:
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: mydatabase
      DB_USER: myuser
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET}
      DIRECTUS_STATIC_TOKEN: ${DIRECTUS_STATIC_TOKEN:-}
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD}
      LOG_LEVEL: debug
    depends_on:
      - database
    volumes:
      # El :Z al final es para contextos de seguridad de SELinux, puedes quitarlo si no lo usas.
      - ./directus-admin/uploads:/directus/uploads:Z
      - directus_extensions:/directus/extensions
    networks:
      - directusnet

  # 3. Servicio de Astro (Configuración para Desarrollo)
  # Usa el Dockerfile de desarrollo y monta el volumen local para live-reload.
  astro-app:
    build:
      context: .
      # Asegúrate de tener este Dockerfile en tu proyecto
      dockerfile: Dockerfile.astro.dev
    container_name: astro-app
    ports:
      - "4321:4321" # Puerto estándar de 'npm run dev' en Astro
    volumes:
      # Monta el código fuente para reflejar cambios en tiempo real
      - .:/app
      # Usa un volumen para node_modules para evitar sobreescribir los del contenedor
      - astro_node_modules:/app/node_modules
    environment:
      NODE_ENV: development
      PUBLIC_DIRECTUS_URL: http://directus-app:8055
      DIRECTUS_STATIC_TOKEN: ${DIRECTUS_STATIC_TOKEN:-}
      HOST: 0.0.0.0
      PORT: 4321
    # El comando se puede simplificar si el Dockerfile ya maneja el npm install
    command: sh -c "npm install && npm run dev -- --port 4321"
    depends_on:
      - directus-app
    networks:
      - directusnet

# Volúmenes para persistencia de datos
volumes:
  directus_db_data:
  directus_extensions:
  astro_node_modules:

# Red interna para la comunicación entre servicios
networks:
  directusnet:
    driver: bridge
