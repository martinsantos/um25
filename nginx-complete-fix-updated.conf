user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Configuración de compresión gzip
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        application/xhtml+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype
        image/svg+xml
        image/x-icon
        application/octet-stream;
    gzip_disable "msie6";
    
    # Configuración de compresión brotli (si está disponible)
    brotli on;
    brotli_comp_level 6;
    brotli_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        text/javascript
        image/svg+xml
        application/x-font-ttf
        application/vnd.ms-fontobject
        font/opentype;
    
    # Configuración de buffer y límites de tamaño
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 4k;
    output_buffers 1 32k;
    postpone_output 1460;
    
    # Configuración de caché de archivos
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Configuración de upstream
    upstream astro {
        server astro-app:4321;
    }
    
    upstream directus {
        server directus-app:8055;
    }
    
    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name ultimamilla.com.ar www.ultimamilla.com.ar;
        return 301 https://$host$request_uri;
    }
    
    # Servidor HTTPS
    server {
        listen 443 ssl;
        server_name ultimamilla.com.ar www.ultimamilla.com.ar;
        
        ssl_certificate /etc/letsencrypt/live/www.ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.ultimamilla.com.ar/privkey.pem;
        
        # Configuración SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Configuración de caché para assets estáticos de Astro
        location ~* /_astro/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            
            # Proxy al contenedor Astro para assets
            proxy_pass http://astro;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configuración específica para assets
            proxy_cache_bypass $http_pragma $http_authorization;
            proxy_no_cache $http_pragma $http_authorization;
        }
        
        # Configuración de caché para imágenes WebP y AVIF
        location ~* \.(webp|avif)$ {
            expires 6M;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            
            proxy_pass http://astro;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuración de caché para fuentes
        location ~* \.(woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*";
            access_log off;
            
            proxy_pass http://astro;
            proxy_set_header Host $host;
        }
        
        # Servir archivos estáticos de uploads con caché optimizado
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 3M;
            add_header Cache-Control "public, immutable";
            add_header Vary "Accept-Encoding";
            access_log off;
            
            # Configuración específica para diferentes tipos de archivos
            location ~* \.(jpg|jpeg|png|gif|webp|avif)$ {
                expires 6M;
                add_header Cache-Control "public, immutable";
            }
            
            location ~* \.(pdf|doc|docx|xls|xlsx)$ {
                expires 1M;
                add_header Cache-Control "public";
            }
        }
        
        # Proxy para Directus - TODAS las rutas necesarias incluyendo revisions y versions
        location ~ ^/(auth|server|assets|extensions|users|roles|policies|notifications|translations|permissions|fields|relations|collections|flows|operations|presets|webhooks|settings|activity|utils|graphql|items|revisions|versions|files|folders) {
            proxy_pass http://directus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            
            # Headers CORS para API
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            # Manejo de OPTIONS para CORS
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
        
        # Proxy para Directus admin con trailing slash
        location /admin/ {
            proxy_pass http://directus/admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            
            # Cookies seguras
            proxy_cookie_path / "/; HTTPOnly; Secure";
        }
        
        # Redirección para /admin sin trailing slash
        location = /admin {
            return 301 $scheme://$host/admin/;
        }
        
        # Proxy para Astro (frontend) - DEBE IR AL FINAL
        location / {
            proxy_pass http://astro;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
} 