user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    
    # Configuración de upstream
    upstream astro {
        server astro-app:4321;
    }
    
    upstream directus {
        server directus-app:8055;
    }
    
    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name umbot.com.ar www.umbot.com.ar;
        return 301 https://$host$request_uri;
    }
    
    # Servidor HTTPS
    server {
        listen 443 ssl;
        server_name umbot.com.ar www.umbot.com.ar;
        
        ssl_certificate /etc/letsencrypt/live/www.umbot.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.umbot.com.ar/privkey.pem;
        
        # Configuración SSL
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Servir archivos estáticos de uploads directamente
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            autoindex off;
            access_log off;
            expires 30d;
            add_header Cache-Control "public";
        }
        
        # Proxy para Directus - TODAS las rutas necesarias
        location ~ ^/(auth|server|assets|extensions|users|roles|policies|notifications|translations|permissions|fields|relations|collections|flows|operations|presets|webhooks|settings|activity|utils|graphql|items|files|folders) {
            proxy_pass http://directus;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            
            # Headers CORS para API
            add_header Access-Control-Allow-Origin * always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
            
            # Manejo de OPTIONS para CORS
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
        
        # Proxy para Directus admin con trailing slash
        location /admin/ {
            proxy_pass http://directus/admin/;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
            
            # Cookies seguras
            proxy_cookie_path / "/; HTTPOnly; Secure";
        }
        
        # Redirección para /admin sin trailing slash
        location = /admin {
            return 301 $scheme://$host/admin/;
        }
        
        # Proxy para Astro (frontend) - DEBE IR AL FINAL
        location / {
            proxy_pass http://astro;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }
    }
} 