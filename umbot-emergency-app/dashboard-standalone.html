<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UMBot Emergency Dashboard v3.1 - Estilos Corregidos</title>
    <style>
        /* Variables CSS personalizadas */
        :root {
            --primary: #d32f2f;
            --primary-dark: #b71c1c;
            --background: #111827;
            --card-bg: #1f2937;
            --text-color: #f9fafb;
            --subtle-text-color: #9ca3af;
            --border-color: #374151;
            --success: #10b981;
            --warning: #f59e0b;
            --error: #ef4444;
            --info: #3b82f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--background);
            color: var(--text-color);
            line-height: 1.6;
        }

        /* Header */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0,0,0,0.3);
        }

        .header h1 {
            font-size: 1.8rem;
            margin-bottom: 8px;
        }

        .version-badge {
            background: rgba(255,255,255,0.2);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            display: inline-block;
        }

        /* Contenedor principal */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Grid principal */
        .main-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        /* Cards */
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .card h2 {
            font-size: 1.2rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Sistema de logs mejorado */
        .logs-section {
            grid-column: span 2;
        }

        .logs-controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
            padding: 16px;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
        }

        .filter-btn {
            padding: 6px 12px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 16px;
            cursor: pointer;
            font-size: 0.75rem;
            transition: all 0.3s ease;
        }

        .filter-btn:hover,
        .filter-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        /* Contenedor de logs */
        .logs-container {
            max-height: 400px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 8px;
        }

        /* Entradas de log - ESTILOS CORREGIDOS */
        .log-entry {
            padding: 12px;
            margin-bottom: 8px;
            border-radius: 8px;
            background: rgba(255,255,255,0.05);
            transition: all 0.2s ease;
            border-left: 4px solid transparent;
            position: relative;
            backdrop-filter: blur(5px);
        }
        
        .log-entry:hover {
            background: rgba(255,255,255,0.1);
            transform: translateX(2px);
        }
        
        /* Colores por tipo de log */
        .log-entry.log-info { 
            border-left-color: var(--info);
            background: rgba(59, 130, 246, 0.1);
        }
        .log-entry.log-warning { 
            border-left-color: var(--warning);
            background: rgba(245, 158, 11, 0.1);
        }
        .log-entry.log-error { 
            border-left-color: var(--error);
            background: rgba(239, 68, 68, 0.1);
        }
        .log-entry.log-success { 
            border-left-color: var(--success);
            background: rgba(16, 185, 129, 0.1);
        }
        .log-entry.log-system { 
            border-left-color: #8b5cf6;
            background: rgba(139, 92, 246, 0.1);
        }

        .log-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 6px;
        }

        .log-timestamp {
            font-size: 0.75rem;
            opacity: 0.7;
            font-family: 'Courier New', monospace;
        }

        .log-type-badge {
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.7rem;
            text-transform: uppercase;
            font-weight: 600;
        }

        .log-type-badge.info { background: #dbeafe; color: #1e40af; }
        .log-type-badge.warning { background: #fef3c7; color: #92400e; }
        .log-type-badge.error { background: #fee2e2; color: #b91c1c; }
        .log-type-badge.success { background: #d1fae5; color: #065f46; }
        .log-type-badge.system { background: #ede9fe; color: #5b21b6; }

        .log-message {
            font-size: 0.875rem;
            line-height: 1.4;
            color: var(--text-color);
        }

        /* Demo controls */
        .demo-controls {
            position: fixed;
            top: 120px;
            right: 20px;
            background: var(--card-bg);
            padding: 16px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            z-index: 1000;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .demo-btn {
            display: block;
            width: 100%;
            padding: 8px 12px;
            margin: 6px 0;
            background: rgba(255,255,255,0.1);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: all 0.3s ease;
        }

        .demo-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🚨 UMBot Emergency Dashboard v3.1</h1>
        <div class="version-badge">Estilos de Logs Corregidos</div>
    </div>

    <!-- Controles de demostración -->
    <div class="demo-controls">
        <h4 style="margin-bottom: 12px; color: var(--text-color);">🎮 Demo Controls</h4>
        <button class="demo-btn" onclick="generateTestLogs()">Generar Logs de Prueba</button>
        <button class="demo-btn" onclick="clearAllLogs()">Limpiar Logs</button>
    </div>

    <div class="container">
        <!-- Sistema de logs mejorado -->
        <div class="card logs-section">
            <h2>📝 Sistema de Logs Mejorado</h2>
            
            <!-- Controles -->
            <div class="logs-controls">
                <button class="filter-btn active" data-filter="">Todos</button>
                <button class="filter-btn" data-filter="system">Sistema</button>
                <button class="filter-btn" data-filter="info">Info</button>
                <button class="filter-btn" data-filter="warning">Advertencias</button>
                <button class="filter-btn" data-filter="error">Errores</button>
                <button class="filter-btn" data-filter="success">Éxitos</button>
            </div>

            <!-- Contenedor de logs -->
            <div class="logs-container" id="logs-container">
                <div style="text-align: center; padding: 40px; color: var(--subtle-text-color);">
                    <div style="font-size: 2rem; margin-bottom: 16px;">📝</div>
                    <div>Sistema de logs listo para demostración</div>
                    <div style="font-size: 0.9rem; margin-top: 8px; opacity: 0.7;">
                        Usa los controles de demo para generar logs de ejemplo
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Estado de la aplicación
        const appState = {
            logs: [],
            currentFilter: ''
        };

        // Función para agregar logs
        function addLog(type, message) {
            const timestamp = new Date().toLocaleTimeString('es-ES');
            const log = {
                id: Date.now() + Math.random(),
                type,
                message,
                timestamp
            };
            
            appState.logs.unshift(log);
            
            // Limitar a 20 logs para demo
            if (appState.logs.length > 20) {
                appState.logs = appState.logs.slice(0, 20);
            }
            
            renderLogs();
        }

        // Renderizar logs
        function renderLogs() {
            const container = document.getElementById('logs-container');
            let filteredLogs = appState.logs;

            // Aplicar filtros
            if (appState.currentFilter) {
                filteredLogs = filteredLogs.filter(log => log.type === appState.currentFilter);
            }

            if (filteredLogs.length === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px; color: var(--subtle-text-color);">
                        <div style="font-size: 2rem; margin-bottom: 16px;">🔍</div>
                        <div>No se encontraron logs</div>
                        <div style="font-size: 0.9rem; margin-top: 8px; opacity: 0.7;">
                            Prueba generar logs o ajustar los filtros
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredLogs.map(log => `
                <div class="log-entry log-${log.type}" data-id="${log.id}">
                    <div class="log-header">
                        <span class="log-timestamp">${log.timestamp}</span>
                        <span class="log-type-badge ${log.type}">${log.type}</span>
                    </div>
                    <div class="log-message">${log.message}</div>
                </div>
            `).join('');
        }

        // Funciones de demostración
        function generateTestLogs() {
            const testLogs = [
                { type: 'system', message: 'Sistema iniciado correctamente' },
                { type: 'info', message: 'Verificación de servicios completada' },
                { type: 'success', message: 'Conexión a base de datos establecida' },
                { type: 'warning', message: 'Uso de memoria por encima del 80%' },
                { type: 'error', message: 'Fallo en la conexión con Prometheus' },
                { type: 'info', message: 'Backup programado ejecutado' },
                { type: 'success', message: 'Certificados SSL renovados' },
                { type: 'warning', message: 'Espacio en disco: 85% utilizado' }
            ];

            testLogs.forEach((log, index) => {
                setTimeout(() => {
                    addLog(log.type, log.message);
                }, index * 300);
            });
        }

        function clearAllLogs() {
            appState.logs = [];
            renderLogs();
            addLog('system', 'Logs limpiados correctamente');
        }

        // Event listeners
        document.addEventListener('DOMContentLoaded', function() {
            // Filtros
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    appState.currentFilter = this.dataset.filter;
                    renderLogs();
                });
            });

            // Generar logs iniciales
            setTimeout(() => {
                addLog('system', 'Dashboard iniciado - estilos corregidos aplicados');
                addLog('info', 'Sistema de logs mejorado activado');
                addLog('success', 'Demostración de estilos funcionando correctamente');
            }, 500);
        });
    </script>
</body>
</html>
