# nginx-cloudflare-optimized.conf
# Configuración optimizada para ultimamilla.com.ar con Cloudflare
# Resuelve el problema de redirect loop 301
# Última actualización: 10 Sep 2025

# =================================
# CONFIGURACIONES GLOBALES
# =================================

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # =================================
    # CONFIGURACIÓN HTTP BÁSICA
    # =================================
    
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Configuración de logs
    log_format main_format '$remote_addr - $remote_user [$time_local] "$request" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'CF-Ray: $http_cf_ray CF-IP: $http_cf_connecting_ip';
                          
    access_log /var/log/nginx/access.log main_format;
    error_log /var/log/nginx/error.log warn;
    
    # Performance y seguridad
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 100M;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        application/xml
        image/svg+xml;

    # =================================
    # RATE LIMITING Y SEGURIDAD
    # =================================
    
    limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    
    # Security headers (aplicados globalmente)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # =================================
    # CLOUDFLARE REAL IP DETECTION
    # =================================
    
    # IPs de Cloudflare actualizadas (principales rangos)
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    
    # IPv6 ranges principales
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # =================================
    # SERVIDOR PRINCIPAL: ultimamilla.com.ar
    # CONFIGURACIÓN CLOUDFLARE-AWARE
    # =================================
    
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        # Acepta tanto www como non-www
        server_name ultimamilla.com.ar www.ultimamilla.com.ar;
        
        # =================================
        # CONFIGURACIÓN SSL
        # =================================
        ssl_certificate /etc/letsencrypt/live/ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ultimamilla.com.ar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # =================================
        # DETECCIÓN DE CLOUDFLARE
        # =================================
        
        # Variable para detectar si viene de Cloudflare
        set $from_cloudflare 0;
        if ($http_cf_ray) {
            set $from_cloudflare 1;
        }
        if ($http_cf_connecting_ip) {
            set $from_cloudflare 1;
        }
        
        # Headers de información para debugging
        add_header X-Served-By "ULTIMA-MILLA-CF-Optimized" always;
        add_header X-CF-Status $from_cloudflare always;
        add_header X-Server-Port $server_port always;
        
        # =================================
        # LÓGICA DE REDIRECTS INTELIGENTE
        # =================================
        
        # IMPORTANTE: NO hacer redirects HTTPS si viene de Cloudflare
        # Cloudflare ya maneja SSL/TLS termination
        
        # Solo redirigir a HTTPS si:
        # 1. NO viene de Cloudflare
        # 2. Es una conexión HTTP directa al servidor
        # 3. No es una petición de health check o certificados
        
        set $should_redirect_https 0;
        
        # Si es HTTP y NO viene de Cloudflare, redirigir a HTTPS
        if ($scheme = http) {
            set $should_redirect_https 1;
        }
        if ($from_cloudflare = 1) {
            set $should_redirect_https 0;
        }
        if ($request_uri ~* "^/\.well-known/") {
            set $should_redirect_https 0;
        }
        if ($request_uri ~* "^/(health|status)") {
            set $should_redirect_https 0;
        }
        
        # Aplicar redirect solo cuando sea necesario
        if ($should_redirect_https = 1) {
            return 301 https://$server_name$request_uri;
        }
        
        # =================================
        # CERTIFICADOS LET'S ENCRYPT
        # =================================
        
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            try_files $uri =404;
        }
        
        # =================================
        # RUTAS ESPECIALES Y API
        # =================================
        
        # Rate limiting para rutas generales
        limit_req zone=general burst=20 nodelay;
        
        # Admin de Directus (puerto 8055)
        location /admin {
            limit_req zone=api burst=30 nodelay;
            
            proxy_pass http://localhost:8055/admin;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Route-Type "directus-admin";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            proxy_buffering off;
        }
        
        # API de Directus (puerto 8055)
        location /api/ {
            limit_req zone=api burst=50 nodelay;
            
            proxy_pass http://localhost:8055/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Route-Type "directus-api";
            
            # CORS headers para API pública
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Content-Type, Authorization, X-Requested-With" always;
            
            if ($request_method = OPTIONS) {
                return 204;
            }
        }
        
        # Assets de Directus
        location /assets/ {
            proxy_pass http://localhost:8055/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Route-Type "directus-assets";
            
            # Cache largo para assets
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
        }
        
        # =================================
        # APLICACIÓN ASTRO (FALLBACK PRINCIPAL)
        # =================================
        
        # Todas las demás rutas van a Astro (puerto según arquitectura)
        location / {
            # Usar el puerto correcto según la regla HrtA1Jbyogb7yWfW83RCRc
            # La aplicación Astro debe estar en puerto 3000 (arquitectura), no 4321
            proxy_pass http://localhost:4321;  # Temporalmente mantener 4321 hasta migrar a 3000
            
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Route-Type "astro-main";
            proxy_cache_bypass $http_upgrade;
            
            # Timeouts optimizados para SSR
            proxy_connect_timeout 10s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
            
            # Buffering optimizado para SSR
            proxy_buffering off;
            proxy_request_buffering off;
        }
        
        # =================================
        # ASSETS ESTÁTICOS
        # =================================
        
        # Assets con cache largo
        location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|avif|map)$ {
            proxy_pass http://localhost:4321;
            proxy_set_header Host $host;
            proxy_set_header X-Route-Type "static-asset";
            
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header Access-Control-Allow-Origin "*" always;
            
            # Fallback si falla
            proxy_intercept_errors on;
            error_page 404 = @asset_fallback;
        }
        
        location @asset_fallback {
            return 404;
        }
        
        # =================================
        # HEALTH CHECKS Y MONITOREO
        # =================================
        
        # Health check del sistema
        location /health {
            access_log off;
            return 200 "OK - ULTIMA MILLA (CF-Optimized)\nCloudflare: $from_cloudflare\nScheme: $scheme\nServer: $server_name";
            add_header Content-Type text/plain;
            add_header X-Health-Status "OK";
        }
        
        # Status detallado para monitoreo interno
        location /status {
            access_log off;
            stub_status on;
            
            # Solo permitir desde IPs confiables
            allow 127.0.0.1;
            allow 23.105.176.45;
            # Permitir rangos de Cloudflare principales
            allow 104.16.0.0/13;
            allow 172.64.0.0/13;
            deny all;
        }
        
        # =================================
        # CONFIGURACIÓN DE ERRORES
        # =================================
        
        # Páginas de error personalizadas
        error_page 404 /404.html;
        error_page 500 502 503 504 /50x.html;
        
        location = /404.html {
            root /usr/share/nginx/html;
            internal;
        }
        
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }
    
    # =================================
    # SERVIDOR SGI: sgi.ultimamilla.com.ar
    # =================================
    
    server {
        listen 80;
        listen [::]:80;
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        
        server_name sgi.ultimamilla.com.ar;
        
        # SSL (mismo certificado wildcard o separado)
        ssl_certificate /etc/letsencrypt/live/ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ultimamilla.com.ar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Headers de seguridad específicos para SGI
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Detección de Cloudflare también para SGI
        set $from_cloudflare_sgi 0;
        if ($http_cf_ray) {
            set $from_cloudflare_sgi 1;
        }
        
        # Lógica de redirect similar para SGI
        set $should_redirect_https_sgi 0;
        if ($scheme = http) {
            set $should_redirect_https_sgi 1;
        }
        if ($from_cloudflare_sgi = 1) {
            set $should_redirect_https_sgi 0;
        }
        
        if ($should_redirect_https_sgi = 1) {
            return 301 https://$server_name$request_uri;
        }
        
        # Proxy al sistema SGI (puerto 3456 según arquitectura)
        location / {
            proxy_pass http://localhost:3456;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Route-Type "sgi-app";
            
            proxy_connect_timeout 30s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Health check para SGI
        location /health {
            proxy_pass http://localhost:3456/health;
            proxy_set_header Host $host;
            access_log off;
        }
    }
    
    # =================================
    # SERVIDOR DEFAULT (CATCH-ALL)
    # =================================
    
    # Captura peticiones a otros dominios o IPs
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        listen 443 ssl http2 default_server;
        listen [::]:443 ssl http2 default_server;
        
        server_name _;
        
        # SSL básico para conexiones HTTPS no reconocidas
        ssl_certificate /etc/letsencrypt/live/ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ultimamilla.com.ar/privkey.pem;
        
        # Return 444 (close connection) para peticiones no reconocidas
        return 444;
    }
}
