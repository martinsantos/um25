events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Configuración básica de seguridad
    server_tokens off;
    
    upstream astro_backend {
        server umbot-astro-static:4321;
    }
    
    upstream directus_backend {
        server directus-app:8055;
    }

    # Redirigir HTTP a HTTPS
    server {
        listen 80;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;
        return 301 https://www.ultimamilla.com.ar$request_uri;
    }

    # Servidor HTTPS principal
    server {
        listen 443 ssl http2;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;

        # Configuración SSL
        ssl_certificate /etc/letsencrypt/live/www.ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.ultimamilla.com.ar/privkey.pem;
        
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        
        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=63072000" always;
        add_header X-Content-Type-Options nosniff;
        add_header X-Frame-Options DENY;

        # Admin panel (Directus) - CORREGIDO para incluir subrutas
        location /admin/ {
            proxy_pass http://directus_backend/admin/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_redirect off;
        }

        # Admin panel sin barra final - redirigir con barra
        location = /admin {
            return 301 $scheme://$host/admin/;
        }

        # API endpoints (Directus)
        location /api/ {
            proxy_pass http://directus_backend/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Assets from Directus
        location /assets/ {
            proxy_pass http://directus_backend/assets/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Main website (Astro)
        location / {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
} 