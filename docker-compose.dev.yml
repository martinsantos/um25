# ===========================================
# 🐳 DOCKER COMPOSE PARA DESARROLLO LOCAL
# ULTiMA MILLA - Fumbling Field
# ===========================================

version: '3.8'

services:
  # ===========================================
  # BASE DE DATOS POSTGRESQL (DESARROLLO)
  # ===========================================
  postgres-dev:
    image: postgres:15-alpine
    container_name: umbot-postgres-dev
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: directus_dev
      POSTGRES_USER: directus
      POSTGRES_PASSWORD: dev_password_2025
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - umbot-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U directus -d directus_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================================
  # DIRECTUS CMS (DESARROLLO)
  # ===========================================
  directus-dev:
    image: directus/directus:10.8.3
    container_name: umbot-directus-dev
    ports:
      - "8055:8055"
    environment:
      # Base de datos
      DB_CLIENT: pg
      DB_HOST: postgres-dev
      DB_PORT: 5432
      DB_DATABASE: directus_dev
      DB_USER: directus
      DB_PASSWORD: dev_password_2025
      
      # Seguridad
      KEY: directus-dev-key-fumbling-field-2025
      SECRET: directus-dev-secret-fumbling-field-2025
      
      # Admin por defecto
      ADMIN_EMAIL: admin@ultimamilla.local
      ADMIN_PASSWORD: admin123dev
      
      # Configuración de desarrollo
      NODE_ENV: development
      LOG_LEVEL: debug
      LOG_STYLE: pretty
      
      # CORS para desarrollo
      CORS_ENABLED: true
      CORS_ORIGIN: 'http://localhost:4321,http://localhost:3000,http://127.0.0.1:4321'
      CORS_METHODS: 'GET,POST,PATCH,DELETE,OPTIONS'
      CORS_ALLOWED_HEADERS: 'Content-Type,Authorization,X-Requested-With'
      
      # URL pública
      PUBLIC_URL: http://localhost:8055
      
      # Cache deshabilitado para desarrollo
      CACHE_ENABLED: false
      
      # Rate limiting relajado
      RATE_LIMITER_ENABLED: true
      RATE_LIMITER_POINTS: 1000
      RATE_LIMITER_DURATION: 60
      
      # Extensiones
      EXTENSIONS_PATH: ./extensions
      
      # Hot reload
      REFRESH_TOKEN_TTL: 7d
      ACCESS_TOKEN_TTL: 15m
    volumes:
      - directus_dev_uploads:/directus/uploads
      - directus_dev_extensions:/directus/extensions
      - ./directus-admin/extensions:/directus/extensions:ro
      - ./directus-admin/uploads:/directus/uploads
    networks:
      - umbot-dev-network
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: 
        - CMD-SHELL
        - >
          node -e "require('http')
          .get('http://localhost:8055/server/health',
          r=>process.exit(r.statusCode===200?0:1));"
      interval: 30s
      timeout: 10s
      retries: 3

  # ===========================================
  # REDIS PARA CACHE (DESARROLLO)
  # ===========================================
  redis-dev:
    image: redis:7-alpine
    container_name: umbot-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_dev_data:/data
    networks:
      - umbot-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ===========================================
  # APLICACIÓN ASTRO (DESARROLLO)
  # ===========================================
  astro-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
      target: development
    container_name: umbot-astro-dev
    ports:
      - "4321:4321"
      - "24678:24678" # Vite HMR
    environment:
      NODE_ENV: development
      DIRECTUS_URL: http://directus-dev:8055
      PUBLIC_DIRECTUS_URL: http://localhost:8055
      REDIS_URL: redis://redis-dev:6379
      HOST: 0.0.0.0
      PORT: 4321
      
      # Variables de debugging
      DEBUG: astro:*
      ASTRO_TELEMETRY_DISABLED: 1
      
      # Hot reload
      CHOKIDAR_USEPOLLING: true
      CHOKIDAR_INTERVAL: 1000
    volumes:
      # Código fuente con hot reload
      - .:/app
      - /app/node_modules
      - /app/dist
      - /app/.astro
    networks:
      - umbot-dev-network
    depends_on:
      directus-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    restart: unless-stopped
    stdin_open: true
    tty: true
    command: npm run dev -- --host 0.0.0.0

  # ===========================================
  # MAILHOG PARA TESTING DE EMAILS
  # ===========================================
  mailhog:
    image: mailhog/mailhog:latest
    container_name: umbot-mailhog-dev
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # Web UI
    networks:
      - umbot-dev-network
    restart: unless-stopped

  # ===========================================
  # ADMINER PARA DB MANAGEMENT
  # ===========================================
  adminer:
    image: adminer:standalone
    container_name: umbot-adminer-dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres-dev
      ADMINER_DESIGN: pepa-linha-dark
    networks:
      - umbot-dev-network
    restart: unless-stopped

volumes:
  postgres_dev_data:
    driver: local
  directus_dev_uploads:
    driver: local
  directus_dev_extensions:
    driver: local
  redis_dev_data:
    driver: local

networks:
  umbot-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

# ===========================================
# CONFIGURACIÓN DE DESARROLLO
# ===========================================
# Servicios disponibles:
# - App principal: http://localhost:4321
# - Directus Admin: http://localhost:8055
# - Adminer DB: http://localhost:8080
# - MailHog: http://localhost:8025
# - Redis: localhost:6379
# - PostgreSQL: localhost:5432 