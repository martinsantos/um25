# HTTP-context snippet for LLM crawler and referral measurement.
# Install with scripts/ops/install-llm-nginx-logging.sh.

# Cloudflare real client IPs. Keep this list aligned with Cloudflare published ranges.
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $http_user_agent $umsa_llm_bot {
    default "";
    ~*OAI-SearchBot "OAI-SearchBot";
    ~*ChatGPT-User "ChatGPT-User";
    ~*GPTBot "GPTBot";
    ~*Claude-SearchBot "Claude-SearchBot";
    ~*Claude-User "Claude-User";
    ~*ClaudeBot "ClaudeBot";
    ~*PerplexityBot "PerplexityBot";
    ~*Perplexity-User "Perplexity-User";
    ~*Google-Extended "Google-Extended";
    ~*Googlebot "Googlebot";
    ~*Bingbot "Bingbot";
    ~*Applebot "Applebot";
    ~*DuckAssistBot "DuckAssistBot";
    ~*Amazonbot "Amazonbot";
    ~*meta-externalagent "Meta-ExternalAgent";
    ~*Bytespider "Bytespider";
    ~*CCBot "CCBot";
}

map $http_referer $umsa_llm_referer {
    default "";
    ~*chatgpt\.com "chatgpt.com";
    ~*claude\.ai "claude.ai";
    ~*perplexity\.ai "perplexity.ai";
    ~*copilot\.microsoft\.com "copilot.microsoft.com";
    ~*gemini\.google\.com "gemini.google.com";
    ~*poe\.com "poe.com";
    ~*you\.com "you.com";
}

map "$umsa_llm_bot:$umsa_llm_referer" $umsa_log_llm_request {
    default 1;
    ":" 0;
}

log_format umsa_llm_json escape=json '{'
    '"time":"$time_iso8601",'
    '"host":"$host",'
    '"server_name":"$server_name",'
    '"method":"$request_method",'
    '"uri":"$uri",'
    '"args":"$args",'
    '"status":$status,'
    '"body_bytes_sent":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_status":"$upstream_status",'
    '"upstream_response_time":"$upstream_response_time",'
    '"remote_addr":"$remote_addr",'
    '"http_cf_connecting_ip":"$http_cf_connecting_ip",'
    '"http_x_forwarded_for":"$http_x_forwarded_for",'
    '"http_user_agent":"$http_user_agent",'
    '"http_referer":"$http_referer",'
    '"http_cf_ray":"$http_cf_ray",'
    '"llm_bot":"$umsa_llm_bot",'
    '"llm_referer":"$umsa_llm_referer"'
'}';

access_log /var/log/nginx/ultimamilla-llm-access.log umsa_llm_json if=$umsa_log_llm_request;
