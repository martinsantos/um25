<svg viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Arial, sans-serif">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0a;stop-opacity:1" />
      <stop offset="60%" style="stop-color:#111827;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0505;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#DC2626;stop-opacity:0" />
      <stop offset="50%" style="stop-color:#DC2626;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DC2626;stop-opacity:0" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1f2937;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#111827;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="0.3" opacity="0.08"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Top red line accent -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#redAccent)"/>

  <!-- Circuit/node decorative elements - left -->
  <circle cx="80" cy="180" r="4" fill="#DC2626" opacity="0.6" filter="url(#glow)"/>
  <circle cx="80" cy="280" r="3" fill="#DC2626" opacity="0.4"/>
  <circle cx="160" cy="230" r="5" fill="#DC2626" opacity="0.5" filter="url(#glow)"/>
  <line x1="80" y1="180" x2="160" y2="230" stroke="#DC2626" stroke-width="1" opacity="0.3"/>
  <line x1="80" y1="280" x2="160" y2="230" stroke="#DC2626" stroke-width="1" opacity="0.3"/>
  <circle cx="50" cy="420" r="3" fill="#DC2626" opacity="0.3"/>
  <circle cx="120" cy="460" r="4" fill="#DC2626" opacity="0.4"/>
  <line x1="50" y1="420" x2="120" y2="460" stroke="#DC2626" stroke-width="1" opacity="0.2"/>

  <!-- Circuit/node decorative elements - right -->
  <circle cx="1120" cy="150" r="4" fill="#DC2626" opacity="0.5"/>
  <circle cx="1060" cy="200" r="3" fill="#DC2626" opacity="0.4"/>
  <circle cx="1150" cy="350" r="5" fill="#DC2626" opacity="0.5" filter="url(#glow)"/>
  <line x1="1120" y1="150" x2="1060" y2="200" stroke="#DC2626" stroke-width="1" opacity="0.3"/>
  <line x1="1150" y1="350" x2="1120" y2="150" stroke="#DC2626" stroke-width="1" opacity="0.2"/>

  <!-- Main title area -->
  <!-- Category badge -->
  <rect x="200" y="80" width="160" height="32" rx="16" fill="#DC2626" opacity="0.15"/>
  <rect x="200" y="80" width="160" height="32" rx="16" fill="none" stroke="#DC2626" stroke-width="1.5" opacity="0.6"/>
  <text x="280" y="101" text-anchor="middle" font-size="13" font-weight="600" fill="#DC2626" letter-spacing="1">OPEN SOURCE · 2026</text>

  <!-- Main headline -->
  <text x="200" y="175" font-size="46" font-weight="800" fill="#ffffff" letter-spacing="-1">Del SAP al</text>
  <text x="200" y="230" font-size="46" font-weight="800" fill="#DC2626" letter-spacing="-1" filter="url(#glow)">open source:</text>
  <text x="200" y="280" font-size="28" font-weight="400" fill="#9ca3af">cómo una PyME argentina</text>
  <text x="200" y="315" font-size="28" font-weight="400" fill="#9ca3af">liberó</text>
  <text x="345" y="315" font-size="28" font-weight="700" fill="#ffffff">USD 120.000</text>
  <text x="550" y="315" font-size="28" font-weight="400" fill="#9ca3af">en licencias</text>

  <!-- Divider -->
  <line x1="200" y1="345" x2="560" y2="345" stroke="#DC2626" stroke-width="2" opacity="0.4"/>

  <!-- Stats row -->
  <text x="200" y="375" font-size="13" fill="#6b7280">ultimamilla.com.ar · Abril 2026 · 8 min de lectura</text>

  <!-- Tags -->
  <rect x="200" y="395" width="90" height="24" rx="12" fill="#1f2937"/>
  <text x="245" y="411" text-anchor="middle" font-size="11" fill="#9ca3af">Odoo 17</text>
  <rect x="300" y="395" width="100" height="24" rx="12" fill="#1f2937"/>
  <text x="350" y="411" text-anchor="middle" font-size="11" fill="#9ca3af">Constructoras</text>
  <rect x="410" y="395" width="110" height="24" rx="12" fill="#1f2937"/>
  <text x="465" y="411" text-anchor="middle" font-size="11" fill="#9ca3af">PyMEs Argentina</text>

  <!-- RIGHT SIDE: Infographic cards -->
  <!-- Card 1: Before (SAP) -->
  <rect x="650" y="60" width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <rect x="650" y="60" width="240" height="6" rx="6" fill="#6b7280" opacity="0.5"/>
  <text x="770" y="95" text-anchor="middle" font-size="12" fill="#6b7280" letter-spacing="1">ANTES (SAP B1)</text>
  <text x="770" y="140" text-anchor="middle" font-size="38" font-weight="800" fill="#ef4444">$148K</text>
  <text x="770" y="165" text-anchor="middle" font-size="12" fill="#6b7280">USD / año en licencias</text>
  <text x="770" y="195" text-anchor="middle" font-size="11" fill="#4b5563">12 usuarios · SAP B1 · mantenimiento</text>

  <!-- Arrow down with label -->
  <text x="770" y="250" text-anchor="middle" font-size="24" fill="#DC2626">↓</text>
  <rect x="710" y="255" width="120" height="22" rx="11" fill="#DC2626" opacity="0.15"/>
  <text x="770" y="270" text-anchor="middle" font-size="11" fill="#DC2626" font-weight="600">MIGRACIÓN ODOO 17</text>

  <!-- Card 2: After (Odoo) -->
  <rect x="650" y="285" width="240" height="160" rx="12" fill="url(#cardGrad)" stroke="#374151" stroke-width="1"/>
  <rect x="650" y="285" width="240" height="6" rx="6" fill="#DC2626"/>
  <text x="770" y="320" text-anchor="middle" font-size="12" fill="#6b7280" letter-spacing="1">DESPUÉS (ODOO 17)</text>
  <text x="770" y="365" text-anchor="middle" font-size="38" font-weight="800" fill="#22c55e">$28K</text>
  <text x="770" y="390" text-anchor="middle" font-size="12" fill="#6b7280">USD / año en soporte</text>
  <text x="770" y="415" text-anchor="middle" font-size="11" fill="#4b5563">Licencia CERO · soporte local UMSA</text>

  <!-- Card 3: Savings -->
  <rect x="920" y="60" width="240" height="385" rx="12" fill="url(#cardGrad)" stroke="#DC2626" stroke-width="1.5" opacity="0.8"/>
  <rect x="920" y="60" width="240" height="6" rx="6" fill="#DC2626"/>
  <text x="1040" y="95" text-anchor="middle" font-size="12" fill="#DC2626" letter-spacing="1" font-weight="700">AHORRO TOTAL</text>
  <text x="1040" y="160" text-anchor="middle" font-size="52" font-weight="800" fill="#ffffff" filter="url(#glow)">$120K</text>
  <text x="1040" y="185" text-anchor="middle" font-size="14" fill="#9ca3af">USD liberados · Año 1</text>

  <!-- Divider in card -->
  <line x1="940" y1="205" x2="1140" y2="205" stroke="#374151" stroke-width="1"/>

  <!-- Stats in card -->
  <text x="940" y="235" font-size="11" fill="#6b7280">ROI implementación</text>
  <text x="1140" y="235" text-anchor="end" font-size="13" font-weight="700" fill="#22c55e">340%</text>

  <text x="940" y="265" font-size="11" fill="#6b7280">Tiempo de implementación</text>
  <text x="1140" y="265" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">14 semanas</text>

  <text x="940" y="295" font-size="11" fill="#6b7280">Módulos activos</text>
  <text x="1140" y="295" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">8 módulos</text>

  <text x="940" y="325" font-size="11" fill="#6b7280">Usuarios migrados</text>
  <text x="1140" y="325" text-anchor="end" font-size="13" font-weight="700" fill="#ffffff">12 usuarios</text>

  <text x="940" y="355" font-size="11" fill="#6b7280">Datos históricos</text>
  <text x="1140" y="355" text-anchor="end" font-size="13" font-weight="700" fill="#22c55e">100% migrados</text>

  <!-- Divider in card -->
  <line x1="940" y1="375" x2="1140" y2="375" stroke="#374151" stroke-width="1"/>

  <text x="940" y="395" font-size="11" fill="#6b7280">Payback implementación</text>
  <text x="1140" y="395" text-anchor="end" font-size="13" font-weight="700" fill="#DC2626">4.2 meses</text>

  <text x="940" y="425" font-size="11" fill="#6b7280">Sector</text>
  <text x="1140" y="425" text-anchor="end" font-size="13" font-weight="700" fill="#9ca3af">Constructora · Mendoza</text>

  <!-- Bottom bar -->
  <rect x="0" y="580" width="1200" height="50" fill="#0a0a0a" opacity="0.8"/>
  <text x="200" y="611" font-size="12" fill="#6b7280">Fuentes: Odoo S.A. pricing 2025 · SAP Partner Channel LAT · INDEC PyMEs 2024 · caso real anonimizado por UMSA</text>
  <!-- Logo bottom right -->
  <text x="900" y="611" font-size="14" font-weight="700" fill="#ffffff">ultimamilla</text>
  <text x="1006" y="611" font-size="14" font-weight="700" fill="#DC2626">.</text>
  <text x="1013" y="611" font-size="14" font-weight="700" fill="#ffffff">com</text>
  <text x="1047" y="611" font-size="14" font-weight="700" fill="#DC2626">.</text>
  <text x="1054" y="611" font-size="14" font-weight="700" fill="#ffffff">ar</text>

  <!-- Bottom red line -->
  <rect x="0" y="626" width="1200" height="4" fill="url(#redAccent)"/>
</svg>
