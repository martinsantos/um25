<style>

:root{--ink:#07080a;--red:#DC2626;--en:#E2B04A;--da:#3FC7B8;--se:#8B7CF6;--de:#F07A5A}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:var(--ink);color:#fff;font-family:'UM Sans',Arial,system-ui,sans-serif}
.iso{position:relative;width:100%;height:100vh;min-height:520px;overflow:hidden;background:radial-gradient(120% 90% at 50% 40%,#151a21 0%,#0b0e12 55%,#07080a 100%)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.cap{position:absolute;left:clamp(16px,3.2vw,32px);top:clamp(16px,3vw,32px);max-width:min(440px,calc(100% - 32px));pointer-events:none}
.cap small{display:flex;align-items:center;gap:10px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:rgba(255,255,255,.6)}
.cap small i{width:28px;height:2px;background:var(--red)}
.cap h2{margin-top:12px;font-weight:700;font-size:clamp(22px,2.6vw,36px);line-height:1.1;letter-spacing:-.01em}
.cap p{margin-top:10px;font-size:clamp(14px,1.1vw,17px);line-height:1.55;color:rgba(255,255,255,.72)}
.cap h2,.cap p{transition:opacity .5s ease,transform .6s cubic-bezier(.2,.7,.1,1)}
.cap.out h2,.cap.out p{opacity:0;transform:translateY(6px)}
.legend{position:absolute;left:clamp(16px,3.2vw,32px);bottom:clamp(16px,3vw,28px);display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.5)}
.legend span{display:flex;align-items:center;gap:8px;transition:color .4s}
.legend span b{width:8px;height:8px;border-radius:50%;background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 18%,transparent)}
.legend span.on{color:#fff}
.bar{position:absolute;right:clamp(16px,3.2vw,32px);bottom:clamp(16px,3vw,28px);display:flex;align-items:center;gap:14px}
.steps{display:flex;gap:6px}.steps i{width:22px;height:2px;background:rgba(255,255,255,.2);overflow:hidden;position:relative}
.steps i::after{content:'';position:absolute;inset:0;background:#fff;transform:scaleX(var(--p,0));transform-origin:left}
button{width:40px;height:40px;border:1px solid rgba(255,255,255,.24);background:rgba(7,8,10,.5);color:#fff;cursor:pointer;display:grid;place-items:center}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.tags{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;transform:translate(10px,-50%);padding:6px 10px 6px 8px;background:rgba(7,8,10,.82);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px);display:flex;align-items:center;gap:8px;font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;white-space:nowrap;color:#fff;opacity:0;transition:opacity .5s}
.tag::before{content:'';width:6px;height:6px;border-radius:50%;background:var(--c,#fff);box-shadow:0 0 0 4px rgba(255,255,255,.08)}
.tag.on{opacity:.92}
@media (max-width:640px){.legend{bottom:76px}.tag{font-size:10px}}

box(.8,2.1,1,M.rack,0,0,0,{parent:rackG});
for(let u=0;u<14;u++){const led=box(.62,.05,.02,M.led(u%4===0?C.da:0x1f6f66),0,.25+u*.12,.51,{parent:rackG,edges:false,shadow:false});LAYER_OBJ.da.push(led)}
const ups=box(.7,1.2,.9,M.dark,techCx+.7,0,-4.6);const upsLed=box(.3,.06,.02,M.led(C.en),0,.3,.46,{parent:ups,edges:false,shadow:false});LAYER_OBJ.en.push(upsLed);
box(.9,1.1,.18,M.white,techCx+.2,1,-D/2+.32);
const acc=box(.12,.2,.05,M.led(C.se),W/2-1.3,1.1,ROOM_Z1+.06,{edges:false,shadow:false});LAYER_OBJ.se.push(acc);
TAGS.push({p:new THREE.Vector3(techCx-.6,2.4,-4.6),label:'Rack',c:'#3FC7B8',only:['da','all']});
TAGS.push({p:new THREE.Vector3(techCx+.7,1.5,-4.6),label:'UPS',c:'#E2B04A',only:['en','all']});

// ---------- ceiling services (exploded layer) ----------
const services=new THREE.Group();world.add(services);
const TY=2.62;
box(W-1.6,.06,.4,M.tray,-0.2,TY,-.6,{parent:services});                        // cable tray along corridor
for(let x=-10.5;x<=10.5;x+=3)box(.04,H-TY,.04,M.tray,x,TY,-.6,{parent:services,edges:false});
const devices=[];
rooms.forEach((cx,i)=>{
 const ap=cyl(.22,.05,M.white,cx,TY+.1,-4.2,{parent:services});devices.push(ap);LAYER_OBJ.da.push(box(.06,.02,.06,M.led(C.da),cx,TY+.08,-4.2,{parent:services,edges:false,shadow:false}));
 const det=cyl(.13,.09,M.white,cx-1.2,TY+.08,-3,{parent:services});LAYER_OBJ.de.push(box(.05,.02,.05,M.led(C.de),cx-1.2,TY+.06,-3,{parent:services,edges:false,shadow:false}));
});
const cams=[[-11.4,TY,-.9],[0,TY,-.9],[11.2,TY,-.9],[10.6,TY,6.4]].map(([x,y,z])=>{const g=new THREE.Mesh(new THREE.SphereGeometry(.16,20,12,0,Math.PI*2,0,Math.PI/2),M.dark);g.rotation.x=Math.PI;g.position.set(x,y+.12,z);services.add(g);const l=box(.05,.02,.05,M.led(C.se),x,y+.08,z,{parent:services,edges:false,shadow:false});LAYER_OBJ.se.push(l);return new THREE.Vector3(x,y,z)});
TAGS.push({p:new THREE.Vector3(rooms[0],TY+.6,-4.2),label:'Wi‑Fi',c:'#3FC7B8',only:['da']});
TAGS.push({p:new THREE.Vector3(rooms[3]-1.2,TY+.6,-3),label:'Detector',c:'#F07A5A',only:['de']});
TAGS.push({p:new THREE.Vector3(0,TY+.6,-.9),label:'Cámara',c:'#8B7CF6',only:['se']});

// ---------- animated flows ----------
const flowMat=c=>new THREE.ShaderMaterial({transparent:true,depthWrite:false,blending:THREE.NormalBlending,
 uniforms:{t:{value:0},c:{value:new THREE.Color(c)},len:{value:10},a:{value:0}},
 vertexShader:'varying vec2 vUv;void main(){vUv=uv;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'uniform float t,len,a;uniform vec3 c;varying vec2 vUv;void main(){float s=vUv.x*len;float p=fract(s*.45-t*.9);float head=smoothstep(.0,.04,p)*smoothstep(.34,.0,p);float base=.42;gl_FragColor=vec4(mix(c,vec3(1.),head*.35),min(1.,base+head)*a);}'});
const flows={en:[],da:[],se:[],de:[]};
function flow(k,pts,r=.06){const path=new THREE.CurvePath();for(let i=1;i<pts.length;i++)path.add(new THREE.LineCurve3(new THREE.Vector3(...pts[i-1]),new THREE.Vector3(...pts[i])));
 const len=path.getLength(),seg=Math.max(8,Math.round(len*6));const m=flowMat(C[k]);m.uniforms.len.value=len;const mesh=new THREE.Mesh(new THREE.TubeGeometry(path,seg,r,8,false),m);services.add(mesh);flows[k].push(mesh);
 const hm=flowMat(C[k]);hm.uniforms.len.value=len;hm.fragmentShader=hm.fragmentShader.replace('float base=.42','float base=.08');const halo=new THREE.Mesh(new THREE.TubeGeometry(path,seg,r*3.2,8,false),hm);services.add(halo);flows[k].push(halo);return mesh}
const rk=[techCx-.6,2.1,-4.6],up=[techCx+.7,1.2,-4.6];
rooms.forEach((cx,i)=>{
 flow('da',[rk,[rk[0],TY+.05,rk[2]],[rk[0],TY+.05,-.6],[cx+.85,TY+.05,-.6],[cx+.85,TY+.05,-5.6],[cx+.85,2.1,-5.6]]);
 flow('da',[[cx+.85,TY+.05,-.6+.0],[cx,TY+.05,-.6],[cx,TY+.05,-4.2]],.042);
 flow('en',[up,[up[0],TY+.12,up[2]],[up[0],TY+.12,-.45],[cx-.3,TY+.12,-.45],[cx-.3,TY+.12,-6.75],[cx-.3,1.45,-6.75]]);
 flow('de',[[techCx+.2,TY+.18,-6.6],[techCx+.2,TY+.18,-.75],[cx-1.2,TY+.18,-.75],[cx-1.2,TY+.18,-3]],.042);
});
flow('da',[[rk[0],TY+.05,-.6],[-1.5,TY+.05,-.6],[-1.5,TY+.05,3.2],[-1.5,1.1,3.2]]);
cams.forEach(v=>flow('se',[[techCx-.6,TY+.25,-4.6],[techCx-.6,TY+.25,-.85],[v.x,TY+.25,-.85],[v.x,TY+.25,v.z]],.025));
flow('se',[[techCx-.6,TY+.25,-.85],[W/2-1.3,TY+.25,-.85],[W/2-1.3,TY+.25,ROOM_Z1+.06],[W/2-1.3,1.2,ROOM_Z1+.06]],.042);

// Only furniture-scale objects cast shadows; long walls, trays and frames read cleaner without them.
{const sz=new THREE.Vector3();world.traverse(o=>{if(!o.isMesh)return;o.geometry.computeBoundingBox();o.geometry.boundingBox.getSize(sz);if(Math.max(sz.x,sz.z)>3)o.castShadow=false;});}
// ---------- tags ----------
const tagHost=document.getElementById('tags');
TAGS.forEach(t=>{t.el=document.createElement('span');t.el.className='tag';t.el.style.setProperty('--c',t.c);t.el.textContent=t.label;tagHost.appendChild(t.el)});

// ---------- layout / camera framing ----------
let fit=1;
function resize(){const w=host.clientWidth,h=host.clientHeight;renderer.setSize(w,h,false);if(typeof composer!=='undefined'){composer.setPixelRatio(Math.min(devicePixelRatio,2));composer.setSize(w,h)}const a=w/h;
 fit=a<1?15.5/Math.max(a,.5):a<1.4?12.4:10.4;const sh=a>1.2?fit*a*.3:0,sv=a<1?fit*.12:0;cam.left=-fit*a-sh;cam.right=fit*a-sh;cam.top=fit+sv;cam.bottom=-fit+sv;cam.updateProjectionMatrix()}
const composer=new EffectComposer(renderer);composer.addPass(new RenderPass(scene,cam));
const ao=new GTAOPass(scene,cam,1,1);ao.updateGtaoMaterial({radius:.45,distanceExponent:1.4,thickness:1.2,scale:1.1,samples:16});ao.blendIntensity=.85;composer.addPass(ao);composer.addPass(new OutputPass());
addEventListener('resize',resize);resize();

// ---------- chapters ----------
const cap=document.getElementById('cap'),steps=document.getElementById('steps'),pp=document.getElementById('pp'),legend=[...document.querySelectorAll('.legend span')];
CHAPTERS.forEach(()=>steps.appendChild(document.createElement('i')));
let ci=0,ct=0,paused=reduce,lift=0,liftT=0,zoom=1,zoomT=1;
function setChapter(i){ci=i;ct=0;cap.classList.add('out');setTimeout(()=>{cap.querySelector('h2').textContent=CHAPTERS[i].t;cap.querySelector('p').textContent=CHAPTERS[i].p;cap.classList.remove('out')},380);
 const k=CHAPTERS[i].k;legend.forEach(s=>s.classList.toggle('on',k==='all'||s.dataset.l===k));liftT=k&&k!=='all'?1.1:k==='all'?.6:0;zoomT=1}
setChapter(Math.min(CHAPTERS.length-1,Math.max(0,+new URLSearchParams(location.search).get('c')||0)));lift=liftT;zoom=zoomT;
pp.onclick=()=>{paused=!paused;pp.textContent=paused?'▶':'❚❚';pp.setAttribute('aria-label',paused?'Reanudar recorrido':'Pausar recorrido')};
const io=new IntersectionObserver(([e])=>visible=e.isIntersecting);let visible=true;io.observe(host);

// ---------- loop ----------
const clock=new THREE.Clock(),v=new THREE.Vector3();let time=0;
function frame(){requestAnimationFrame(frame);if(!visible||document.hidden)return;
 const dt=Math.min(clock.getDelta(),.05);if(!paused){time+=dt;ct+=dt;if(ct>CHAPTERS[ci].d)setChapter((ci+1)%CHAPTERS.length)}
 const k=CHAPTERS[ci].k,ease=1-Math.pow(.001,dt);
 lift+=(liftT-lift)*ease*.9;zoom+=(zoomT-zoom)*ease*.6;
 services.position.y=lift;
 for(const key in flows){const on=k==='all'||k===key||k===null;for(const f of flows[key]){f.material.uniforms.t.value=time;f.material.uniforms.a.value+=((on?(k===null?.28:1):.04)-f.material.uniforms.a.value)*ease}}
 for(const key in LAYER_OBJ){const on=k===null||k==='all'||k===key;for(const o of LAYER_OBJ[key])o.visible=on}
 // slow isometric drift
 const ang=Math.PI/4,el=.62;const r=40;
 cam.position.set(Math.sin(ang)*r*Math.cos(el),Math.sin(el)*r,Math.cos(ang)*r*Math.cos(el));cam.lookAt(0,lift*.35,-1.2);cam.zoom=zoom;cam.updateProjectionMatrix();
 drawEcg(paused?0:dt);
 steps.querySelectorAll('i').forEach((s,i)=>s.style.setProperty('--p',i<ci?1:i===ci?Math.min(1,ct/CHAPTERS[ci].d):0));
 const w=host.clientWidth,h=host.clientHeight;
 for(const t of TAGS){const on=t.only.includes(k);if(on){v.copy(t.p);if(t.p.y>2.5)v.y+=lift;v.project(cam);t.el.style.left=((v.x+1)/2*w)+'px';t.el.style.top=((1-v.y)/2*h)+'px'}t.el.classList.toggle('on',on)}
 composer.render()}
frame();
</script>
