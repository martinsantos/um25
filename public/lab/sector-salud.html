<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Salud · Última Milla</title>
<style>
@font-face{font-family:'UM Sans';src:url('/fonts/um-sans/UMSans-Regular.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'UM Sans';src:url('/fonts/um-sans/UMSans-Bold.woff2') format('woff2');font-weight:700;font-display:swap}
:root{--bg:#14232f;--ink:#0a0f14;--line:rgba(255,255,255,.14);--mute:rgba(255,255,255,.62);--red:#DC2626;--g:clamp(20px,4vw,64px)}
*{box-sizing:border-box}
html,body{margin:0;background:var(--ink);color:#fff;font-family:'UM Sans',Arial,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit}button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:2px solid var(--red);outline-offset:3px}

.nav{position:fixed;inset:0 0 auto;z-index:20;display:flex;align-items:center;justify-content:space-between;height:68px;padding:0 var(--g)}
.logo{font-weight:700;letter-spacing:-.02em;font-size:20px;text-decoration:none}.logo i{color:var(--red);font-style:normal}
.nav ul{display:flex;gap:32px;list-style:none;margin:0;padding:0;font-size:14px;color:var(--mute)}.nav ul a{text-decoration:none}
.nav .cta{padding:11px 18px;border:1px solid rgba(255,255,255,.3);text-decoration:none;font-size:14px}

/* The film carries the story; the text says one thing per moment. */
.film{position:relative;height:760vh}
.film__pin{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;background:var(--bg)}
.film__video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:translateX(17vw) scale(.92);transform-origin:right center}
.film__scrim{position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,var(--bg) 0%,var(--bg) var(--s1,14%),rgba(20,35,47,.7) var(--s2,30%),rgba(20,35,47,0) var(--s3,46%));transition:--s1 .8s}

.story{position:absolute;left:var(--g);top:50%;transform:translateY(-50%);width:min(600px,calc(100% - 2*var(--g)))}
.story__in{transition:opacity .6s ease,transform .8s cubic-bezier(.2,.7,.1,1)}
.story.is-swap .story__in{opacity:0;transform:translateY(14px)}
.kicker{display:flex;align-items:center;gap:14px;margin:0;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}
.kicker b{width:32px;height:2px;background:var(--red)}
.story h1,.story h2{margin:20px 0 0;font-weight:700;letter-spacing:-.025em;line-height:1.02;max-width:13ch;font-size:clamp(42px,5vw,80px)}
.story p.lead{margin:22px 0 0;max-width:38ch;font-size:clamp(17px,1.35vw,21px);line-height:1.55;color:rgba(255,255,255,.8)}
.stats{display:flex;gap:clamp(28px,3.4vw,56px);margin:40px 0 0;padding:0}
.stats div{display:flex;flex-direction:column-reverse;gap:6px}
.stats dt{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.stats dd{margin:0;font-size:clamp(30px,2.8vw,44px);font-weight:700;letter-spacing:-.02em}
.proof-line{display:grid;grid-template-columns:76px 1fr;gap:18px;align-items:center;margin:34px 0 0;padding:18px 0 0;border-top:1px solid var(--line);max-width:470px;text-decoration:none}
.proof-line.no-img{grid-template-columns:1fr}
.proof-line img{width:76px;height:57px;object-fit:cover;display:block}
.proof-line small{display:block;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.proof-line strong{display:block;margin-top:5px;font-size:17px;line-height:1.3}
.proof-line span span{display:block;margin-top:3px;font-size:14px;color:var(--mute)}
.proof-line:hover strong{text-decoration:underline;text-underline-offset:4px}
.more{display:inline-flex;align-items:center;gap:10px;margin:28px 0 0;padding:0 0 5px;border:0;border-bottom:2px solid var(--red);background:none;font-size:16px;font-weight:700;cursor:pointer}
.more span{transition:transform .3s}.more:hover span{transform:translateX(4px)}
.go{display:inline-block;margin:34px 0 0;padding:18px 26px;background:var(--red);font-weight:700;text-decoration:none}
.layers{margin:30px 0 0;padding:0;list-style:none;max-width:480px}
.layers li{border-top:1px solid var(--line)}.layers li:last-child{border-bottom:1px solid var(--line)}
.layers button{display:grid;grid-template-columns:12px 1fr auto;align-items:baseline;gap:16px;width:100%;padding:16px 2px;border:0;background:none;text-align:left;cursor:pointer;color:rgba(255,255,255,.48);transition:color .35s}
.layers b{width:9px;height:9px;border-radius:50%;background:var(--c);align-self:center;transition:transform .35s}
.layers strong{font-size:20px;font-weight:700}
.layers em{font-style:normal;font-size:14px;color:var(--mute)}
.layers li.on button,.layers button:hover{color:#fff}
.layers li.on b{transform:scale(1.5);box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 22%,transparent)}

.progress{position:absolute;left:var(--g);right:var(--g);bottom:32px;height:1px;background:rgba(255,255,255,.14)}
.progress i{position:absolute;inset:0;background:#fff;transform-origin:left;transform:scaleX(var(--p,0))}
.hint{position:absolute;left:var(--g);bottom:52px;margin:0;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);transition:opacity .4s}

/* service sheet: the detail, only for whoever asks */
.sheet{position:fixed;top:0;right:0;bottom:0;z-index:30;width:min(500px,100%);background:#0c1218;border-left:1px solid var(--line);transform:translateX(100%);transition:transform .6s cubic-bezier(.2,.7,.1,1);overflow:auto;overscroll-behavior:contain}
.sheet.open{transform:none}
.sheet__in{padding:96px 44px 48px}
.sheet__close{position:absolute;top:20px;right:20px;width:44px;height:44px;border:1px solid var(--line);background:none;cursor:pointer;font-size:18px}
.sheet .kicker b{background:var(--c)}
.sheet h3{margin:16px 0 0;font-size:40px;line-height:1.04;letter-spacing:-.02em}
.sheet .lead{margin:14px 0 0;font-size:18px;line-height:1.5;color:rgba(255,255,255,.8)}
.sheet h4{margin:36px 0 12px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);font-weight:400}
.sheet ol{margin:0;padding:0;list-style:none}
.sheet ol li{padding:13px 0;border-top:1px solid var(--line);font-size:16px;line-height:1.45}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:0;padding:0;list-style:none}.chips li{padding:7px 11px;border:1px solid var(--line);font-size:13px;color:rgba(255,255,255,.85)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin:32px 0 0;padding:20px 0 0;border-top:1px solid var(--line)}
.facts dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}.facts dd{margin:6px 0 0;font-size:15px;line-height:1.45}
.cases{display:grid;gap:12px}.cases a{display:grid;grid-template-columns:96px 1fr;gap:16px;align-items:center;text-decoration:none}
.cases img,.cases i{width:96px;height:72px;object-fit:cover;display:block;background:#1b2630}
.cases strong{display:block;font-size:15px;line-height:1.35}.cases small{display:block;margin-top:4px;font-size:12px;color:var(--mute)}
.veil{position:fixed;inset:0;z-index:25;background:rgba(5,8,11,.4);opacity:0;pointer-events:none;transition:opacity .45s}.veil.on{opacity:1;pointer-events:auto}

.after{padding:clamp(88px,11vw,160px) var(--g);max-width:1480px;margin:0 auto}
.after h2{margin:20px 0 0;max-width:18ch;font-size:clamp(34px,3.8vw,58px);line-height:1.05;letter-spacing:-.02em}
.proof{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(14px,1.8vw,28px);margin-top:48px}
.proof a{text-decoration:none}.proof img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;background:#1b2630;transition:filter .4s}.proof a:hover img{filter:brightness(1.08)}
.proof small{display:block;margin-top:16px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
.proof strong{display:block;margin-top:6px;font-size:20px;line-height:1.3}
.proof .all{display:flex;flex-direction:column;justify-content:flex-end;aspect-ratio:4/3;padding:28px;border:1px solid var(--line)}
.proof .all b{font-size:clamp(48px,5vw,72px);letter-spacing:-.03em;line-height:1}
.proof .all strong{font-size:18px}.proof .all:hover{border-color:rgba(255,255,255,.4)}

@media (max-width:820px){
 .nav ul{display:none}
 .film{height:680vh}
 .film__pin{display:flex;flex-direction:column}
 .film__video{position:relative;inset:auto;height:auto;aspect-ratio:1/1;flex:none;margin-top:60px;transform:none}
 .film__scrim{background:linear-gradient(0deg,var(--bg) 0%,rgba(20,35,47,0) 20%);height:calc(100vw + 60px)}
 .story{position:relative;left:auto;top:auto;transform:none;width:auto;margin:0 var(--g)}
 .story h1,.story h2{font-size:34px;margin-top:12px;max-width:none}
 .story p.lead{font-size:16px;margin-top:12px}
 .stats{margin-top:20px}.stats dd{font-size:26px}
 .proof-line{margin-top:18px;padding-top:12px}.more{margin-top:16px}.go{margin-top:18px}
 .layers{margin-top:16px}.layers button{padding:10px 2px}.layers strong{font-size:16px}
 .story:has(.layers) p.lead{display:none}
 .hint{display:none}.progress{bottom:20px}
 .sheet{top:auto;height:88svh;width:100%;border-left:0;border-top:1px solid var(--line);transform:translateY(100%)}
 .sheet__in{padding:72px 22px 36px}.sheet h3{font-size:32px}
 .proof{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.story__in,.sheet,.veil{transition:none}}
</style>
</head>
<body>
<header class="nav">
  <a class="logo" href="/">ultimamilla<i>.</i>com<i>.</i>ar</a>
  <ul><li><a href="/servicios">Servicios</a></li><li><a href="/sectores">Sectores</a></li><li><a href="/antecedentes">Antecedentes</a></li><li><a href="/blog">Blog</a></li></ul>
  <a class="cta" href="/contacto">Contactar</a>
</header>

<main>
<section class="film" id="film" aria-label="Historia: infraestructura para hospitales">
  <div class="film__pin">
    <video class="film__video" id="video" muted playsinline preload="auto" aria-hidden="true"></video>
    <div class="film__scrim"></div>
    <div class="story" id="story" aria-live="polite"><div class="story__in" id="storyIn"></div></div>
    <p class="hint" id="hint">Deslizá para recorrer</p>
    <div class="progress" aria-hidden="true"><i id="bar"></i></div>
  </div>
</section>

<section class="after">
  <p class="kicker"><b></b>Antecedentes en salud</p>
  <h2>Hospitales que ya funcionan sobre lo que instalamos.</h2>
  <div class="proof" id="proof"></div>
</section>
</main>

<div class="veil" id="veil"></div>
<aside class="sheet" id="sheet" aria-hidden="true" aria-labelledby="sheetTitle"><button class="sheet__close" id="sheetClose" aria-label="Cerrar">✕</button><div class="sheet__in" id="sheetIn"></div></aside>

<script type="module">
const C={en:'#E2B04A',da:'#3FC7B8',se:'#8B7CF6',de:'#F07A5A',all:'#ffffff'};
const LAYER={en:'Energía',da:'Datos',se:'Seguridad',de:'Detección',all:'Operación'};
const IMG={'3072':'3072-infraestructura-hospitalaria-rack-y-patch-panel-hospital-a-italo-perrupato-principal.webp','3069':'3069-instalacion-electrica-para-data-center-principal.webp'};
const img=id=>IMG[id]?`/images/antecedentes/generated/lote_001/${IMG[id]}`:'';
// One message per moment of the film: what is at stake, what we do, who proves it.
const STORY=[
 {t:0,kicker:'Salud',h1:'En un hospital, la red no puede caerse.',lead:'Diseñamos, instalamos y sostenemos la infraestructura de edificios sanitarios que funcionan las 24 horas.',stats:[['51','Proyectos en salud'],['24/7','Soporte'],['22','Años']]},
 {t:2.8,kicker:'En cada cabecera',h2:'Cada monitor reporta. Siempre.',lead:'Llevamos cableado certificado y Wi‑Fi hasta cada cama, para que los equipos clínicos no pierdan la conexión.',proof:{id:'3072',title:'Hospital Italo Perrupato',what:'Rack y patch panel certificados · 2025',href:'/antecedentes/3072/infraestructura-hospitalaria-rack-y-patch-panel-hospital-a-italo-perrupato'},more:'101'},
 {t:6.6,scrim:['40%','52%','66%'],kicker:'En el puesto de enfermería',h2:'Todo el piso, visible desde un solo puesto.',lead:'Llamadores, comunicaciones y sistemas del área llegan al lugar donde se toman las decisiones.',proof:{id:'',title:'FUESMEN · Escuela de Medicina Nuclear',what:'Redes de datos y fibra óptica · 2025',href:'/antecedentes/3075/implementacion-de-redes-de-datos-y-fibra-optica-fuesmen-fundacion-escuela-medicina-nuclear-3'},more:'103'},
 {t:10.8,kicker:'Detrás de la pared',h2:'Cuatro sistemas que nadie ve, y de los que todo depende.',lead:'Los diseñamos, instalamos y documentamos como uno solo.',layers:[['en','108',10.8,12],['da','101',12,13.2],['se','102',13.2,14.4],['de','107',14.4,16]]},
 {t:15.6,kicker:'Después de la obra',h2:'Y a las tres de la mañana, alguien atiende.',lead:'Mesa de ayuda 24/7, mantenimiento con SLA y la documentación de todo lo instalado.',go:true},
];
const services=await fetch('/lab/sector-salud.json').then(r=>r.json());
const svc=code=>services.find(s=>s.code===code);

const video=document.getElementById('video'),film=document.getElementById('film');
const phoneFilm=matchMedia('(max-width: 820px)').matches;video.poster=phoneFilm?'/cine/media/cine-hospital-proyecto-v5-poster-sq.jpg':'/cine/media/cine-hospital-proyecto-v5-poster.jpg';video.src=phoneFilm?'/lab/scrub/salud-sq-1080.mp4':'/lab/scrub/salud-1920.mp4';
let D=18;video.addEventListener('loadedmetadata',()=>{D=video.duration||18});

const story=document.getElementById('story'),storyIn=document.getElementById('storyIn');
function render(i){const s=STORY[i];let h=`<p class="kicker"><b></b>${s.kicker}</p>`+(s.h1?`<h1>${s.h1}</h1>`:`<h2>${s.h2}</h2>`)+`<p class="lead">${s.lead}</p>`;
 if(s.stats)h+=`<dl class="stats">${s.stats.map(([v,l])=>`<div><dt>${l}</dt><dd>${v}</dd></div>`).join('')}</dl>`;
 if(s.layers)h+=`<ul class="layers">${s.layers.map(([k,code])=>`<li data-k="${k}" style="--c:${C[k]}"><button type="button" data-open="${code}"><b></b><strong>${LAYER[k]}</strong><em>${svc(code)?.name||''} →</em></button></li>`).join('')}</ul>`;
 if(s.proof){const p=s.proof,src=img(p.id);h+=`<a class="proof-line${src?'':' no-img'}" href="${p.href}">${src?`<img src="${src}" alt="">`:''}<span><small>Lo hicimos en</small><strong>${p.title}</strong><span>${p.what}</span></span></a>`}
 if(s.more)h+=`<div><button type="button" class="more" data-open="${s.more}">Cómo lo hacemos <span>→</span></button></div>`;
 if(s.go)h+=`<div><a class="go" href="/contacto">Solicitar relevamiento</a></div>`;
 storyIn.innerHTML=h}
const scrimEl=document.querySelector('.film__scrim');
let cur=-1;function setStory(i){if(i===cur)return;const sc=STORY[i].scrim||['14%','30%','46%'];['--s1','--s2','--s3'].forEach((k,j)=>scrimEl.style.setProperty(k,sc[j]));const first=cur<0;cur=i;if(first){render(i);return}story.classList.add('is-swap');setTimeout(()=>{render(i);story.classList.remove('is-swap')},300)}
storyIn.addEventListener('click',e=>{const b=e.target.closest('[data-open]');if(b)openSheet(b.dataset.open)});

const progress=()=>{const r=film.getBoundingClientRect(),span=film.offsetHeight-innerHeight;return Math.min(1,Math.max(0,-r.top/span))};
const freeze=new URLSearchParams(location.search).get('t');if(freeze!==null)film.style.height='100vh';
let shown=freeze!==null?+freeze:0;const bar=document.getElementById('bar'),hint=document.getElementById('hint');
function tick(){const target=freeze!==null?+freeze:progress()*D;shown+=(target-shown)*.16;if(Math.abs(target-shown)<.004)shown=target;
 if(video.readyState>=1&&!video.seeking&&Math.abs(video.currentTime-shown)>1/45)video.currentTime=shown;
 const t=shown,i=Math.max(0,STORY.findLastIndex(s=>t>=s.t-.001));setStory(i);
 bar.style.setProperty('--p',t/D);hint.style.opacity=t<.4?1:0;
 storyIn.querySelectorAll('.layers li').forEach(li=>{const L=STORY[3].layers.find(([k])=>k===li.dataset.k);li.classList.toggle('on',t>=L[2]&&t<L[3])});
 requestAnimationFrame(tick)}
requestAnimationFrame(tick);

const sheet=document.getElementById('sheet'),sheetIn=document.getElementById('sheetIn'),veil=document.getElementById('veil');
const LAYER_OF={'101':'da','103':'da','104':'da','102':'se','108':'en','107':'de','105':'all','106':'all'};
function openSheet(code,quiet){const s=svc(code);if(!s)return;sheet.style.setProperty('--c',C[LAYER_OF[code]]);
 const cases=s.cases.length?`<h4>Lo hicimos en</h4><div class="cases">${s.cases.slice(0,3).map(c=>{const id=(c.h.match(/antecedentes\/(\d+)/)||[])[1];return `<a href="${c.h}">${img(id)?`<img src="${img(id)}" alt="">`:'<i></i>'}<span><strong>${c.t}</strong><small>${c.m}</small></span></a>`}).join('')}</div>`:'';
 sheetIn.innerHTML=`<p class="kicker"><b></b>${LAYER[LAYER_OF[code]]}</p><h3 id="sheetTitle">${s.name}</h3><p class="lead">${s.promise}</p>
 <h4>Qué hacemos</h4><ol>${s.scope.map(x=>`<li>${x}</li>`).join('')}</ol><h4>Con qué</h4><ul class="chips">${s.equipment.map(x=>`<li>${x}</li>`).join('')}</ul>
 <dl class="facts"><div><dt>Lo que entregamos</dt><dd>${s.deliverable}</dd></div><div><dt>Bajo norma</dt><dd>${s.standard}</dd></div></dl>${cases}`;
 sheet.classList.add('open');sheet.setAttribute('aria-hidden','false');veil.classList.add('on');if(!quiet)sheet.querySelector('.sheet__close').focus({preventScroll:true})}
const closeSheet=()=>{sheet.classList.remove('open');sheet.setAttribute('aria-hidden','true');veil.classList.remove('on')};
document.getElementById('sheetClose').onclick=closeSheet;veil.onclick=closeSheet;addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});

const proofEl=document.getElementById('proof');
[['3072','Hospital Italo Perrupato','Rack y patch panel · 2025','/antecedentes/3072/infraestructura-hospitalaria-rack-y-patch-panel-hospital-a-italo-perrupato'],['3069','Hospital Italo Perrupato','Instalación eléctrica para data center · 2025','/antecedentes/3069/instalacion-electrica-para-data-center']]
 .forEach(([id,t,w,h])=>proofEl.insertAdjacentHTML('beforeend',`<a href="${h}"><img src="${img(id)}" alt="" loading="lazy"><small>${w}</small><strong>${t}</strong></a>`));
proofEl.insertAdjacentHTML('beforeend',`<a class="all" href="/antecedentes?sector=salud"><b>51</b><strong>proyectos en salud. Ver todos →</strong></a>`);
const q=new URLSearchParams(location.search);if(q.has('open'))setTimeout(()=>openSheet(q.get('open'),true),300);
</script>
</body>
</html>
