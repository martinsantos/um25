version: '3.8'

services:
  astro-app:
    image: docker.io/santosma/um25:astro-1.0.0
    container_name: astro-app
    restart: always
    ports:
      - "3000:4321"
    env_file:
      - .env.prod
    environment:
      - NODE_ENV=production
      - DIRECTUS_URL=http://directus-app:8055
      - DIRECTUS_STATIC_TOKEN=k6P8LAY8_x_y1miB_KTlWnysCnx2Abky
      - PUBLIC_DIRECTUS_TOKEN=k6P8LAY8_x_y1miB_KTlWnysCnx2Abky
    depends_on:
      - directus-app
    networks:
      - um25_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: docker.io/postgres:15-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-myuser}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-mypassword}
      POSTGRES_DB: ${DB_DATABASE:-mydatabase}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - um25_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-myuser} -d ${DB_DATABASE:-mydatabase}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  directus-app:
    image: directus/directus:10.8
    container_name: directus-app
    restart: always
    ports:
      - "8055:8055"
    depends_on:
      - database
    env_file:
      - .env.prod
    environment:
      KEY: ${DIRECTUS_KEY:-pzdIoGXgfJODqy8lLFxwi2NOK/K7j7Qii7W26rHS9Tk=}
      SECRET: ${DIRECTUS_SECRET:-d/QUPftXXNdfnAmN5SSmWPrYLzHqWF9rixk6XrwchR4=}
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: ${DB_USER:-myuser}
      DB_PASSWORD: ${DB_PASSWORD:-mypassword}
      DB_DATABASE: ${DB_DATABASE:-mydatabase}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@example.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-adminpassword}
      PUBLIC_URL: ${PUBLIC_URL:-http://23.105.176.45:8055}
      PUBLIC_ASSETS: true
      ASSETS_TRANSFORM_TOKEN_OPTIONAL: true
      CORS_ENABLED: true
      CORS_ORIGINS: http://www.umbot.com.ar,http://localhost:4321
      PUBLIC_ROLE: ${PUBLIC_ROLE:-74e3b05e-0f14-422e-9ad3-759d426db60a}
      RATE_LIMITER_ENABLED: "true"
      RATE_LIMITER_STORE: "memory"
      RATE_LIMITER_POINTS: "50"
      RATE_LIMITER_DURATION: "1"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    networks:
      - um25_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8055/server/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: um25_postgres_data
  directus_uploads:
    name: um25_directus_uploads
  directus_extensions:
    name: um25_directus_extensions

networks:
  um25_network:
    name: um25_network
