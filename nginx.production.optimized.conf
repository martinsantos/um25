# nginx.production.optimized.conf
# Configuración unificada de Nginx para ultimamilla.com.ar
# Arquitectura: Astro:3000, Directus:8055, Proxy SSR:8093, SGI:3456

# =================================
# CONFIGURACIONES GLOBALES
# =================================

worker_processes auto;
worker_rlimit_nofile 65535;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # =================================
    # CONFIGURACIONES BÁSICAS
    # =================================
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Configuración de logs
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" '
                   '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Optimizaciones de red
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100;
    
    # Compresión GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/json
        application/javascript
        application/xml+rss
        application/atom+xml
        image/svg+xml;

    # =================================
    # CONFIGURACIÓN REAL IP (Cloudflare)
    # =================================
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    real_ip_header CF-Connecting-IP;
    
    # =================================
    # LÍMITES Y SEGURIDAD
    # =================================
    client_max_body_size 64m;
    client_body_timeout 60s;
    client_header_timeout 60s;
    send_timeout 60s;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;
    
    # =================================
    # UPSTREAMS - ARQUITECTURA ULTIMAMILLA
    # =================================
    
    # Astro App (Puerto 3000) - CORREGIDO SEGÚN ARQUITECTURA
    upstream astro_app {
        server 127.0.0.1:3000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }
    
    # Directus CMS (Puerto 8055)
    upstream directus_app {
        server 127.0.0.1:8055 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # Proxy SSR (Puerto 8093)
    upstream proxy_ssr {
        server 127.0.0.1:8093 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }
    
    # SGI System (Puerto 3456)
    upstream sgi_system {
        server 127.0.0.1:3456 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

    # =================================
    # SERVIDOR PRINCIPAL: ultimamilla.com.ar
    # =================================
    server {
        listen 80;
        listen [::]:80;
        server_name ultimamilla.com.ar www.ultimamilla.com.ar;
        
        # Redirección HTTPS
        location / {
            return 301 https://$server_name$request_uri;
        }
        
        # Let's Encrypt validation
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name ultimamilla.com.ar www.ultimamilla.com.ar;
        
        # =================================
        # CONFIGURACIÓN SSL
        # =================================
        ssl_certificate /etc/letsencrypt/live/ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ultimamilla.com.ar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        
        # =================================
        # RUTAS PRINCIPALES - ASTRO APP (Puerto 3000)
        # =================================
        
        # Assets estáticos con caché largo y fingerprinting
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://astro_app;
            proxy_cache_bypass $http_upgrade;
            
            # Headers de proxy
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caché largo para assets con fingerprinting
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Cache-Status "STATIC";
        }
        
        # Archivos versionados específicos (performanceOptimizer.v2.js, etc.)
        location ~* \.(v\d+\.)?(js|css)$ {
            proxy_pass http://astro_app;
            
            # Headers de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caché intermedio para archivos versionados
            expires 7d;
            add_header Cache-Control "public";
            add_header X-Cache-Status "VERSIONED";
        }
        
        # Páginas dinámicas sin caché
        location / {
            limit_req zone=general burst=20 nodelay;
            
            proxy_pass http://astro_app;
            proxy_cache_bypass $http_upgrade;
            
            # Headers de proxy
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Sin caché para contenido dinámico
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            add_header Pragma no-cache;
            add_header Expires 0;
            add_header X-Cache-Status "DYNAMIC";
        }
        
        # =================================
        # DIRECTUS CMS - /admin y /assets
        # =================================
        location ^~ /admin {
            limit_req zone=api burst=10 nodelay;
            
            proxy_pass http://directus_app;
            proxy_cache_bypass $http_upgrade;
            
            # Headers especiales para Directus
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Timeouts mayores para admin
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            add_header X-Cache-Status "DIRECTUS-ADMIN";
        }
        
        location ^~ /assets {
            proxy_pass http://directus_app;
            
            # Headers de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Caché para assets de Directus
            expires 1d;
            add_header Cache-Control "public";
            add_header X-Cache-Status "DIRECTUS-ASSETS";
        }
        
        # API de Directus
        location ^~ /api {
            limit_req zone=api burst=15 nodelay;
            
            proxy_pass http://directus_app;
            
            # Headers CORS para API
            add_header Access-Control-Allow-Origin "*" always;
            add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
            add_header Access-Control-Allow-Headers "DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization" always;
            
            # Headers de proxy
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header X-Cache-Status "DIRECTUS-API";
        }
        
        # =================================
        # HEALTH CHECKS
        # =================================
        location = /health {
            proxy_pass http://astro_app;
            access_log off;
        }
        
        location = /health/directus {
            proxy_pass http://directus_app/server/health;
            access_log off;
        }
    }
    
    # =================================
    # SERVIDOR SGI: sgi.ultimamilla.com.ar
    # =================================
    server {
        listen 80;
        listen [::]:80;
        server_name sgi.ultimamilla.com.ar;
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name sgi.ultimamilla.com.ar;
        
        # SSL (mismo certificado wildcard o separado)
        ssl_certificate /etc/letsencrypt/live/ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ultimamilla.com.ar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        
        # Headers de seguridad
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        
        # Proxy a SGI System (Puerto 3456)
        location / {
            limit_req zone=api burst=20 nodelay;
            
            proxy_pass http://sgi_system;
            proxy_cache_bypass $http_upgrade;
            
            # Headers de proxy
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            add_header X-Cache-Status "SGI-SYSTEM";
        }
    }
}
