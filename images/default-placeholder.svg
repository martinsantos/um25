<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo gradiente profesional -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#0f172a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9;stop-opacity:0.3" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:0.3" />
    </linearGradient>
  </defs>
  
  <!-- Fondo base -->
  <rect width="1200" height="800" fill="url(#bgGradient)"/>
  
  <!-- Patrón de puntos -->
  <circle cx="200" cy="150" r="3" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="400" cy="300" r="3" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="600" cy="200" r="3" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="800" cy="400" r="3" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="1000" cy="250" r="3" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="300" cy="600" r="3" fill="#0ea5e9" opacity="0.2"/>
  <circle cx="700" cy="650" r="3" fill="#8b5cf6" opacity="0.2"/>
  <circle cx="950" cy="700" r="3" fill="#0ea5e9" opacity="0.2"/>
  
  <!-- Rectángulo de acento -->
  <rect x="100" y="100" width="1000" height="600" fill="url(#accentGradient)" rx="20"/>
  
  <!-- Líneas decorativas -->
  <line x1="150" y1="250" x2="1050" y2="250" stroke="#0ea5e9" stroke-width="1" opacity="0.1"/>
  <line x1="150" y1="350" x2="1050" y2="350" stroke="#8b5cf6" stroke-width="1" opacity="0.1"/>
  <line x1="150" y1="450" x2="1050" y2="450" stroke="#0ea5e9" stroke-width="1" opacity="0.1"/>
  <line x1="150" y1="550" x2="1050" y2="550" stroke="#8b5cf6" stroke-width="1" opacity="0.1"/>
  
  <!-- Icono central -->
  <g transform="translate(600, 400)">
    <!-- Círculo de fondo -->
    <circle cx="0" cy="0" r="80" fill="#0ea5e9" opacity="0.1"/>
    <circle cx="0" cy="0" r="70" fill="none" stroke="#0ea5e9" stroke-width="2" opacity="0.3"/>
    
    <!-- Icono de imagen -->
    <rect x="-40" y="-40" width="80" height="80" fill="none" stroke="#0ea5e9" stroke-width="2" rx="4"/>
    <circle cx="-20" cy="-20" r="8" fill="#0ea5e9" opacity="0.5"/>
    <polyline points="-40,-40 -10,10 20,-20 40,10 40,40" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-linejoin="round"/>
  </g>
  
  <!-- Texto -->
  <text x="600" y="520" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#0ea5e9" text-anchor="middle" opacity="0.6">
    Imagen no disponible
  </text>
  <text x="600" y="560" font-family="Arial, sans-serif" font-size="16" fill="#64748b" text-anchor="middle" opacity="0.5">
    Cargando contenido...
  </text>
</svg>
