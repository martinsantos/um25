# Configuración Nginx para Producción - UM25-0.3 con SSL e Imágenes Corregidas
# Servidor: 23.105.176.45 - Dominio: www.umbot.com.ar

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Configuración de logs
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;
    
    upstream astro_backend {
        server umbot-astro-static:4321;
    }
    
    # Redirección HTTP -> HTTPS
    server {
        listen 80;
        server_name www.umbot.com.ar umbot.com.ar 23.105.176.45;
        return 301 https://$server_name$request_uri;
    }
    
    # Servidor HTTPS
    server {
        listen 443 ssl http2;
        server_name www.umbot.com.ar umbot.com.ar;

        # Configuración SSL
        ssl_certificate /etc/letsencrypt/live/www.umbot.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.umbot.com.ar/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        
        # ✅ NUEVO: Servir imágenes directamente desde el filesystem
        location /images/ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri @proxy_images;
        }
        
        # ✅ NUEVO: Servir imágenes de antecedentes directamente
        location /imagenes_antecedentes_versionproduccion/ {
            root /var/www/html;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri @proxy_images;
        }
        
        # Fallback para imágenes que no están en filesystem
        location @proxy_images {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # Configuración para todas las demás rutas
        location / {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Configuración específica para SSR
            proxy_buffering off;
            proxy_cache off;
            
            # Timeouts más largos para SSR
            proxy_connect_timeout 30s;
            proxy_send_timeout 30s;
            proxy_read_timeout 30s;
        }
        
        # Manejo específico para assets estáticos
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://astro_backend;
            proxy_set_header Host $host;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Health check
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }
} 