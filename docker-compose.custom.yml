services:
  astro-app:
    build:
      context: .
      dockerfile: Dockerfile.astro
    container_name: astro-app
    restart: always
    ports:
      - "8080:4321"
    environment:
      - NODE_ENV=production
      - DIRECTUS_URL=http://directus-app:8055
      - PUBLIC_DIRECTUS_URL=http://23.105.176.45:8055
      - DIRECTUS_STATIC_TOKEN=k6P8LAY8_x_y1miB_KTlWnysCnx2Abky
    depends_on:
      - directus-app
    networks:
      - um25_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://0.0.0.0:4321"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  database:
    image: postgres:15-alpine
    container_name: database
    restart: always
    environment:
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
      POSTGRES_DB: mydatabase
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - um25_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  directus-app:
    image: directus/directus:11.7.2
    container_name: directus-app
    restart: always
    ports:
      - "8055:8055"
    depends_on:
      - database
    environment:
      KEY: pzdIoGXgfJODqy8lLFxwi2NOK/K7j7Qii7W26rHS9Tk=
      SECRET: d/QUPftXXNdfnAmN5SSmWPrYLzHqWF9rixk6XrwchR4=
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      DB_USER: myuser
      DB_PASSWORD: mypassword
      DB_DATABASE: mydatabase
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: adminpassword
      PUBLIC_URL: http://23.105.176.45:8055
      CORS_ENABLED: true
      CORS_ORIGIN: http://23.105.176.45,http://23.105.176.45:8080
      PUBLIC_ASSETS: true
      ASSETS_CACHE_TTL: "0"
      ASSETS_TRANSFORM_TOKEN_OPTIONAL: "true"
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: "10000"
      FILE_IMPORT_MAX_SIZE: "100000000"
      STORAGE_UPLOAD_MAX_SIZE: "100000000"
    volumes:
      - directus_uploads:/directus/uploads
      - directus_extensions:/directus/extensions
    networks:
      - um25_network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "--header=Accept: text/html", "http://0.0.0.0:8055"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  postgres_data:
    name: um25_postgres_data
  directus_uploads:
    name: um25_directus_uploads
  directus_extensions:
    name: um25_directus_extensions

networks:
  um25_network:
    name: um25_network
