version: '3.8'

services:
  database:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mydatabase
      POSTGRES_USER: myuser
      POSTGRES_PASSWORD: mypassword
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myuser -d mydatabase"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - umbot_network

  directus-app:
    image: directus/directus:11.7.2
    environment:
      KEY: '255d861b-5ea1-5996-9aa3-922530ec40b1'
      SECRET: '6116487b-cda1-52c2-b5b5-c8022c45e263'
      DB_CLIENT: 'pg'
      DB_HOST: 'database'
      DB_PORT: '5432'
      DB_DATABASE: 'mydatabase'
      DB_USER: 'myuser'
      DB_PASSWORD: 'mypassword'
      CACHE_ENABLED: 'false'
      ADMIN_EMAIL: 'admin@umbot.com.ar'
      ADMIN_PASSWORD: 'UmbotHybridAdmin2025!'
      PUBLIC_URL: 'https://www.umbot.com.ar'
      CORS_ENABLED: 'true'
      CORS_ORIGIN: 'https://www.umbot.com.ar,http://localhost:4321'
      STORAGE_LOCATIONS: 'local'
      STORAGE_LOCAL_DRIVER: 'local'
      STORAGE_LOCAL_ROOT: './uploads'
    ports:
      - "8055:8055"
    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - >
          node -e "require('http')
          .get('http://localhost:8055/server/health',
          r=>process.exit(r.statusCode===200?0:1));"
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 5
    networks:
      - umbot_network

  # Mantener Astro estático como está
  umbot-astro-static:
    build:
      context: .
      dockerfile: Dockerfile.astro.prod
    environment:
      NODE_ENV: production
      ASTRO_ENV: production
      PUBLIC_SITE_URL: https://www.umbot.com.ar
      STATIC_MODE: true
      USE_STATIC_DATA: true
    volumes:
      - ./public/images:/app/public/images:ro
    networks:
      - umbot_network

  # Nginx con configuración híbrida
  umbot-nginx-hybrid:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.hybrid.conf:/etc/nginx/nginx.conf:ro
      - ./public/images:/var/www/html/images:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - umbot-astro-static
      - directus-app
    networks:
      - umbot_network

volumes:
  postgres_data:

networks:
  umbot_network:
    driver: bridge
