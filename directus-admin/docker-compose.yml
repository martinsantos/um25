version: '3'
services:
  directus-app:
    image: directus/directus:latest
    restart: unless-stopped
    environment:
      KEY: ${DIRECTUS_KEY:?Set DIRECTUS_KEY}
      SECRET: ${DIRECTUS_SECRET:?Set DIRECTUS_SECRET}
      DB_CLIENT: 'pg'
      DB_HOST: ${DB_HOST:?Set DB_HOST}
      DB_PORT: '5432'
      DB_USER: 'directus'
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      DB_DATABASE: 'directus'
      ADMIN_EMAIL: 'admin@example.com'
      ADMIN_PASSWORD: ${DIRECTUS_ADMIN_PASSWORD:?Set DIRECTUS_ADMIN_PASSWORD}
      PUBLIC_URL: 'https://www.ultimamilla.com.ar/admin'
      ASSETS_TRANSFORM_IMAGE_MAX_DIMENSION: '8000'
      ASSETS_TRANSFORM_MAX_MAP_SIZE: '500mp'
    ports:
      - "8055:8055"
    volumes:
      - ../uploads:/directus/uploads
      - ./extensions:/directus/extensions
    networks:
      - fumbling-field_umbot-network

networks:
  fumbling-field_umbot-network:
    external: true
