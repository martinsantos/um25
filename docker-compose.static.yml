version: '3.8'

services:
  # Aplicación Astro (Frontend)
  umbot-astro-static:
    build:
      context: .
      dockerfile: Dockerfile.astro.prod
    container_name: umbot-astro-static
    environment:
      - NODE_ENV=production
      - STATIC_MODE=true
      - USE_STATIC_DATA=true
      - PUBLIC_DIRECTUS_URL=http://localhost:8055
      - DIRECTUS_STATIC_TOKEN=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjAzOTdkNzkwLWVkOWItNDkxMC1iOWIxLWI4NjJiODZiODUyNiIsInJvbGUiOiI4NWMxZTZiZi1kZWI1LTRjMGYtYWI5Ny1lYjJkZTA0NGYzODUiLCJhcHBfYWNjZXNzIjp0cnVlLCJhZG1pbl9hY2Nlc3MiOnRydWUsImlhdCI6MTc1MDMzODgxMywiZXhwIjoxNzUwMzM5NzEzLCJpc3MiOiJkaXJlY3R1cyJ9.KAEAhsiVWo61Y1YF7SvKkm7tw-7D4iPU4yrjhNxu76w
    env_file:
      - .env
    volumes:
      - ./public:/app/public:ro
    networks:
      - umbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx (Reverse Proxy)
  umbot-nginx-static:
    image: nginx:alpine
    container_name: umbot-nginx-static
    ports:
      - "80:80"
    volumes:
      - ./nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./public/images:/var/www/html/images:ro
    depends_on:
      - umbot-astro-static
    networks:
      - umbot-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  umbot-network:
    driver: bridge

volumes:
  umbot_static_data:
    driver: local 