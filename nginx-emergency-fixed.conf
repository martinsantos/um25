events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    client_max_body_size 100M;
    
    server {
        listen 80;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl;
        server_name www.ultimamilla.com.ar ultimamilla.com.ar;
        
        ssl_certificate /etc/letsencrypt/live/www.ultimamilla.com.ar/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/www.ultimamilla.com.ar/privkey.pem;
        
        root /var/www/html;
        
        # UMBot Emergency App - redirect sin barra a con barra
        location = /emergency {
            return 301 https://$server_name/emergency/;
        }
        
        # UMBot Emergency App API Proxy
        location ^~ /emergency/api/ {
            proxy_pass http://umbot-emergency:8092/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }
        
        # UMBot Emergency App
        location ^~ /emergency/ {
            alias /usr/share/nginx/html/emergency/;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
        
        location /admin/uploads/ {
            alias /var/www/html/admin/uploads/;
            try_files $uri $uri/ =404;
            add_header Access-Control-Allow-Origin *;
        }
        
        location /admin/ {
            rewrite ^/admin/(.*)$ /$1 break;
            proxy_pass http://umbot-directus:8055;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_buffering off;
            proxy_cache off;
        }
        
        location / {
            proxy_pass http://umbot-astro-static:4321;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
} 