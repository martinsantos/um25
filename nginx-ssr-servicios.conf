# Nginx Configuration for Dynamic Servicios SSR
# Esta configuración intercepta /servicios/{id}/{slug} y los redirige al PHP SSR

server {
    listen 80;
    server_name www.ultimamilla.com.ar ultimamilla.com.ar;
    
    # Redirect HTTP to HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name www.ultimamilla.com.ar ultimamilla.com.ar;
    
    # SSL Configuration
    ssl_certificate /etc/nginx/ssl/ultimamilla.com.ar.crt;
    ssl_certificate_key /etc/nginx/ssl/ultimamilla.com.ar.key;
    
    # Root directory
    root /var/www/emergency/public;
    index index.html index.php;
    
    # Logs
    access_log /var/log/nginx/umbot_access.log;
    error_log /var/log/nginx/umbot_error.log;
    
    # 1. DYNAMIC SERVICIOS SSR - Intercept servicios routes
    location ~ ^/servicios/(\d+)/([^/]+)/?$ {
        # Pass to PHP handler for dynamic content
        try_files /dynamic-servicios.php /dynamic-servicios.php;
        
        # PHP-FPM configuration
        fastcgi_pass php-fpm:9000;
        fastcgi_index dynamic-servicios.php;
        fastcgi_param SCRIPT_FILENAME $document_root/dynamic-servicios.php;
        
        # Pass all parameters
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
        fastcgi_param QUERY_STRING $query_string;
        
        # Headers for dynamic content
        add_header X-SSR-Dynamic "true" always;
        add_header X-Content-Source "PHP-Directus" always;
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # 2. Emergency Dashboard (existing functionality)
    location /log/ {
        alias /var/www/emergency/public/log/;
        try_files $uri $uri/ @astro;
    }
    
    # 3. Static Astro content (fallback for other pages)
    location / {
        try_files $uri $uri/ @astro;
    }
    
    # Astro SSR backend
    location @astro {
        proxy_pass http://umbot-astro-static:4321;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # 4. PHP-FPM for dynamic content
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass php-fpm:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }
    
    # 5. Static assets
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Source "Static" always;
    }
    
    # 6. Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
}

# Upstream definitions
upstream php-fpm {
    server umbot-php:9000;
}

upstream astro-backend {
    server umbot-astro-static:4321;
} 